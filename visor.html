<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFrame</title>
<!-- icono vacio en linea: sin el, el navegador pide /favicon.ico y el servidor responde 404 (ruido en consola) -->
<link rel="icon" href="data:,">
<style>
  /* ═══ TEMA CLARO (por defecto) ═══ */

  /* ── Color por AUTOR (mecanismo de Frame.io: el color identifica QUIEN, no QUE nota).
     Tu violeta, Agente coral. El mismo color se repite en la tarjeta y en el marcador
     de la linea de tiempo: sin leer, ves de quien es cada nota. ── */

  /* ── SELECCION visible ──
     Antes: .pitem.on diferenciaba #FFF de #F8F8F6 -> 3 unidades de luminancia, o sea
     nada. Ahora 5 canales a la vez: barra, fondo, borde, peso y tamano del icono. */
  /* ═══ BLANCO Y NEGRO ═══
     Cristian: "No uses el morado, usa negro. Que la app sea a blanco y negro."
     No hay color: la distincion entre tu nota, la de Agente y los cambios de Agente
     la carga la FORMA y el grosor, no el tono. Negro para lo activo y el cursor,
     gris para lo inactivo. El unico color que queda es el ambar del timecode,
     porque es el dato que hay que leer. */
  :root{
    --bg:#ffffff;--panel:#ffffff;--panel-2:#f6f6f5;--raised:#ffffff;
    --line:#dcdcdc;--line-soft:#ebebeb;
    --fg:#111111;--fg-dim:#4a4a4a;--fg-mute:#8a8a8a;
    /* acento = negro. Todo lo activo es negro. */
    --accent:#111111;--accent-dim:#555555;--accent-ink:#ffffff;--accent-hover:#000000;
    --danger:#111111;--ok:#1a1a1a;--info:#333333;
    --accent-soft:rgba(0,0,0,.06);--accent-glow:rgba(0,0,0,.16);
    --accent-glow-2:rgba(0,0,0,.30);--ok-soft:rgba(0,0,0,.07);
    --ok-glow:rgba(0,0,0,.26);--info-soft:rgba(0,0,0,.06);
    --track:#e0e0e0;--hover:#f2f2f2;--hover-ink:#111111;
    --pri-ink:#ffffff;--pri-hover:#000000;--on-border:#c8c8c8;
    --scroll:#c4c4c4;--scroll-h:#a8a8a8;
    --chk-border:#b4b4b4;--strike:#9a9a9a;
    --screen-a:#fbfbfb;--screen-b:#ededed;
    --nocodec-bg:rgba(255,255,255,.97);--modal-bg:rgba(0,0,0,.35);
    --shadow:rgba(0,0,0,.14);--shadow-soft:rgba(0,0,0,.09);
    --sheet-shadow:0 18px 48px rgba(0,0,0,.16);
    --badge-no-bg:#f2f2f2;--badge-no-line:#c8c8c8;
    --line-c:#d0d0d0;--line-y:#d0d0d0;
    /* seleccion: negra, no violeta */
    --sel-bg:#f0f0f0;--sel-line:#b8b8b8;--sel-bar:#000000;
    /* autores: se distinguen por TONO DE GRIS y por forma, no por color */
    --yo:#111111;        /* Cristian: negro solido, 3px */
    --yo-ring:#555555;
    --claude:#8a8a8a;     /* Agente: gris medio */
    --claude-ring:#b4b4b4;
    /* el ambar del chip se queda: es el dato, y a blanco y negro seria un gris mas */
    --tcf:#1a1a1a;--tcb:#f0f0f0;
    --cambio:#111111;--cambio-ring:#111111;--cambio-soft:#f0f0f0;
    /* ── GEOMETRIA FIJA DE LA BARRA DE TIEMPO ──
       Un solo sitio decide el tamano de la barra y de los marcadores, y ese tamano
       NO depende del zoom. Antes el JS escribia host.style.minHeight segun cuantos
       marcadores se pisaban: al acercar, la barra crecia, crecia el transporte, se
       encogia la pantalla del video y el ResizeObserver volvia a medirlo todo.
       Eso era el "se descuadra la pantalla". Con la altura fija eso no puede pasar. */
    /* ── UNA SOLA BANDA: tres capas que comparten caja y eje X ──
       De abajo arriba: regleta (solo con zoom) · pista de progreso · marcadores.
       Las medidas se declaran aqui y en ningun otro sitio, para que el apilado de
       marcadores no pueda volver a empujar la caja (eso era el descuadre del zoom). */
    --scrub-h:32px;      /* alto de la banda: constante en cualquier zoom */
    --track-y:4px;       /* la pista, medida desde el suelo de la banda */
    --track-h:5px;
    --mark-base:9px;     /* la fila 0 de marcadores arranca justo sobre la pista */
    --mark-h:9px;        /* alto de un marcador */
    --lane-px:11px;      /* separacion entre filas de marcadores apilados */
    --rule-h:6px;        /* la regleta del video entero, pegada bajo la pista */
    --radius:7px;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  }
  /* ═══ TEMA OSCURO ═══ */
  [data-theme="dark"]{
    --bg:#111111;--panel:#151515;--panel-2:#1c1c1c;--raised:#212121;
    --line:#2e2e2e;--line-soft:#242424;
    --fg:#f0f0f0;--fg-dim:#c0c0c0;--fg-mute:#8f8f8f;
    --accent:#f0f0f0;--accent-dim:#a0a0a0;--accent-ink:#111111;--accent-hover:#ffffff;
    --danger:#e0e0e0;--ok:#d0d0d0;--info:#a0a0a0;
    --accent-soft:rgba(255,255,255,.08);--accent-glow:rgba(255,255,255,.18);
    --accent-glow-2:rgba(255,255,255,.32);--ok-soft:rgba(255,255,255,.09);
    --ok-glow:rgba(255,255,255,.28);--info-soft:rgba(255,255,255,.08);
    --track:#333333;--hover:#242424;--hover-ink:#f0f0f0;
    --pri-ink:#111111;--pri-hover:#ffffff;--on-border:#3a3a3a;
    --scroll:#3a3a3a;--scroll-h:#4a4a4a;
    --chk-border:#4a4a4a;--strike:#6a6a6a;
    --screen-a:#0d0d0d;--screen-b:#1a1a1a;
    --nocodec-bg:rgba(20,20,20,.97);--modal-bg:rgba(0,0,0,.55);
    --shadow:rgba(0,0,0,.5);--shadow-soft:rgba(0,0,0,.35);
    --sheet-shadow:0 18px 48px rgba(0,0,0,.55);
    --badge-no-bg:#242424;--badge-no-line:#3a3a3a;
    --line-c:#333333;--line-y:#333333;
    --sel-bg:#242424;--sel-line:#4a4a4a;--sel-bar:#ffffff;
    --yo:#f0f0f0;--yo-ring:#a0a0a0;--claude:#9a9a9a;--claude-ring:#6a6a6a;
    --tcf:#e0e0e0;--tcb:#262626;
    --cambio:#f0f0f0;--cambio-ring:#f0f0f0;--cambio-soft:#242424;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:9px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--scroll-h)}

  .topbar{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:10px;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent-glow-2)}
  .sep{width:1px;height:20px;background:var(--line);flex:0 0 1px}
  .conn{font-size:11px;color:var(--fg-mute);display:flex;align-items:center;gap:5px;white-space:nowrap}
  .conn i{width:6px;height:6px;border-radius:50%;background:var(--fg-mute);flex:0 0 6px}
  .conn.live i{background:var(--ok);box-shadow:0 0 7px var(--ok-glow)}
  .conn.live{color:var(--ok)}
  .spacer{flex:1}
  .sello{font-family:var(--mono);font-size:9.5px;color:var(--fg-mute);
    background:var(--panel-2);border:1px solid var(--line);padding:1px 5px;border-radius:4px;white-space:nowrap}

  .btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius);
    border:1px solid var(--line);background:var(--panel-2);color:var(--fg-dim);font-size:12px;white-space:nowrap}
  .btn:hover{background:var(--raised);color:var(--fg);border-color:var(--on-border)}
  .btn svg{width:14px;height:14px;flex:0 0 14px}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--accent-ink)}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
  .btn.danger:hover{filter:brightness(.92)}
  .btn.on{background:var(--raised);color:var(--fg);border-color:var(--on-border)}
  .btn.icon{width:28px;padding:0;justify-content:center}
  .btn.sm{height:24px;padding:0 8px;font-size:11px}
  .btn:disabled{opacity:.3;cursor:default}
  .btn:disabled:hover{background:var(--panel-2);color:var(--fg-dim);border-color:var(--line)}

  .main{flex:1;display:flex;min-height:0}

  /* ── Barra de proyectos ── */
  .rail{flex:0 0 216px;width:216px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .rail-head{padding:9px 10px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:6px}
  .hdricon{width:13px;height:13px;color:var(--fg-mute);flex:0 0 13px}
  .rail-head h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-mute);flex:1}
  .plist{flex:1;overflow-y:auto;padding:6px}
  .pitem{position:relative;padding:8px 9px;border-radius:var(--radius);cursor:pointer;margin-bottom:3px;border:1px solid transparent}
  .pitem:hover{background:var(--panel-2)}
  .pitem.on{background:var(--raised);border-color:var(--line)}
  .pitem.on .pname{color:var(--fg)}
  .pname{font-size:12.5px;font-weight:500;color:var(--fg-dim);margin-bottom:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pmeta{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--fg-mute);font-family:var(--mono)}
  .pmeta .vd{color:var(--info)}
  .pmeta .pn{color:var(--accent)}
  .pmeta .pz{color:var(--ok)}

  /* ── Columna de videos ── */
  .vcol{flex:0 0 246px;width:246px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .vcol-head{padding:9px 11px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:7px}
  .vcol-head h3{font-size:12px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vlist{flex:1;overflow-y:auto;padding:7px}
  .vitem{padding:8px;border-radius:var(--radius);cursor:pointer;margin-bottom:4px;
    border:1px solid var(--line-soft);background:var(--panel-2)}
  .vitem:hover{background:var(--raised)}
  .vitem.on{background:var(--raised);border-color:var(--on-border)}
  .vitem .vn{font-size:12px;font-weight:500;margin-bottom:4px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
  .vitem .vc{font-size:10px;color:var(--fg-mute);font-family:var(--mono);display:flex;gap:7px;flex-wrap:wrap}
  .badge{font-size:9.5px;padding:1px 5px;border-radius:3px;background:var(--raised);
    color:var(--fg-mute);border:1px solid var(--line);font-family:var(--mono);flex:0 0 auto}
  .badge.no{color:var(--danger);border-color:var(--badge-no-line);background:var(--badge-no-bg)}
  .vitem .vrow{display:flex;align-items:center;gap:8px;margin-top:5px}
  .bar{flex:1;height:3px;background:var(--track);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok)}
  .vitem .vn2{font-size:10px;font-family:var(--mono);color:var(--fg-mute)}

  /* ── Reproductor ── */
  .stage{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);min-height:0}
  .screen{flex:1;display:grid;place-items:center;min-height:0;padding:16px;position:relative;
    background:radial-gradient(ellipse at 50% 0%,var(--screen-a) 0%,var(--screen-b) 70%)}
  .framewrap{position:relative;line-height:0;max-width:100%;max-height:100%;display:none}
  .framewrap.on{display:block}
  .framewrap video{max-width:100%;max-height:100%;display:block;background:#000;border-radius:2px}
  .framewrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
  .nocodec{position:absolute;inset:0;display:none;place-items:center;z-index:20;
    background:var(--nocodec-bg);padding:26px;text-align:center}
  .nocodec.on{display:grid}
  .nocodec b{display:block;color:var(--danger);font-size:14px;margin-bottom:7px}
  .nocodec span{color:var(--fg-dim);font-size:12.5px;line-height:1.75;max-width:400px;display:block}
  .nocodec code{font-family:var(--mono);font-size:11px;background:var(--panel-2);padding:2px 6px;
    border-radius:4px;color:var(--fg-mute);display:inline-block;margin-top:9px}

  /* tres bandas con rango distinto: linea de tiempo > transporte > dibujo.
     Antes las separaba el mismo gap:7px y ninguna mandaba. */
  .transport{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
    padding:8px 12px 7px;display:flex;flex-direction:column;gap:0}
  .transport > .tlinesa{padding-bottom:9px}
  .transport > .tp-row{border-top:1px solid var(--line-soft);padding-top:7px}
  .transport > .tools{border-top:1px solid var(--line-soft);padding-top:7px;margin-top:6px}
  .scrub{position:relative;height:var(--scrub-h);cursor:pointer;display:flex;align-items:center;
    touch-action:none;flex:0 0 var(--scrub-h)}
  /* top/transform explicitos: antes la pista no tenia posicion vertical y dependia de
     como el navegador coloca un hijo absoluto dentro de un flex (static position).
     Con el alto de la barra fijo da igual, pero el contrato queda escrito. */
  /* la pista y los marcadores se anclan al SUELO de la banda, no a su linea media.
     Asi la fila de marcadores crece hacia arriba y la regleta cuelga por debajo:
     las tres capas quedan pegadas y leen como una sola pieza (Frame.io hace lo
     mismo con sus dos filas). Anclarlo al centro obligaba a repartir el alto a
     ambos lados y la regleta no tenia donde ir. */
  .scrub-track{position:absolute;left:0;right:0;bottom:var(--track-y);
    height:var(--track-h);background:var(--track);border-radius:3px}
  .scrub-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-dim);border-radius:3px}
  .scrub-head{position:absolute;bottom:calc(var(--track-y) + var(--track-h) / 2 - 6px);
    width:12px;height:12px;margin-left:-6px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);pointer-events:none}
  /* la FILA del marcador la pone el JS en --fila (0 = sobre la pista, 1 = encima).
     Toda la geometria vive aqui: el JS ya no escribe top/bottom/height/transform
     en linea, que era la via por la que el zoom movia cajas. */
  .mark{position:absolute;bottom:calc(var(--mark-base) + var(--fila,0) * var(--lane-px));
    width:3px;height:var(--mark-h);margin-left:-1.5px;border-radius:3px;
    background:var(--own,var(--fg-mute));pointer-events:auto;cursor:grab;z-index:2}
  .mark:hover{filter:brightness(1.25)}
  .mark:active{cursor:grabbing}
  .mark.done{opacity:.4}
  /* Los botones NO pueden encogerse: con flex-wrap y sin flex-shrink:0 el navegador
     los estrujaba a 16px de ancho con un icono de 14px dentro — el de reproducir
     quedaba invisible. Cristian: "el boton de reproducir no se ve". */
  .tp-row{display:flex;align-items:center;gap:8px}
  .tp-row > .btn{flex:0 0 auto}
  .tp-row .btn.icon{width:30px;height:30px;flex:0 0 30px}
  .tp-row .btn svg{width:16px;height:16px;flex:0 0 16px}
  .tc{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;min-width:92px;letter-spacing:-.02em}
  .tc .fr{color:var(--accent)}
  .tc .s{color:var(--fg-mute);font-size:11px;margin-left:6px;font-family:var(--sans)}
  .tools{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .tool{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--fg-dim);border:1px solid transparent}
  .tool:hover{background:var(--raised);color:var(--fg)}
  .tool.on{background:var(--raised);color:var(--fg);border-color:var(--on-border)}
  .tool svg{width:15px;height:15px}
  .swatches{display:flex;gap:3px;padding:2px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line)}
  .sw{width:15px;height:15px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:var(--fg);transform:scale(1.12)}
  .wsize{display:flex;align-items:center;gap:5px;padding:2px 7px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line)}
  .wsize button{width:8px;height:8px;border-radius:50%;background:var(--fg-dim);cursor:pointer}
  .wsize button.on{background:var(--accent);transform:scale(1.25)}

  /* ── Panel de notas ── */
  .side{flex:0 0 360px;width:360px;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  .side-head{flex:0 0 auto;padding:8px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
  .side-head h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-mute);flex:1}
  .cnt{font-family:var(--mono);font-size:11px;color:var(--fg-mute)}
  .filter{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:6px 11px;border-bottom:1px solid var(--line-soft);font-size:11px}
  .vfilter{padding:3px 6px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);
    font-size:10.5px;color:var(--fg-dim);max-width:118px}
  .chk{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;padding:2px 0}
  .chk input{appearance:none;width:13px;height:13px;border:1px solid var(--chk-border);border-radius:3.5px;cursor:pointer;position:relative;flex:0 0 13px}
  .chk input:checked{background:var(--accent);border-color:var(--accent)}
  .chk input:checked::after{content:"";position:absolute;left:4px;top:1px;width:3.5px;height:7px;
    border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(42deg)}
  .chk:hover{color:var(--fg-dim)}
  .list{flex:1;overflow-y:auto;min-height:0}
  .empty{padding:34px 20px;text-align:center;color:var(--fg-mute);font-size:12px;line-height:1.8}
  .empty svg{width:24px;height:24px;opacity:.4;margin-bottom:9px}

  .note{padding:8px 11px;border-bottom:1px solid var(--line-soft);cursor:pointer;display:flex;gap:8px;position:relative}
  .note:hover{background:var(--panel-2)}
  .note.on{background:var(--raised)}
  .note.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
  /* la nota que esta bajo el cursor del reproductor */
  .note.ph{background:var(--accent-soft)}

  .note[data-who="cristian"]{--own:var(--yo);    --own-ring:var(--yo-ring)}
  .note[data-who="claude"] {--own:var(--claude); --own-ring:var(--claude-ring)}
  /* anillo de identidad a la izquierda, como el avatar-ring de Frame.io */
  .note[data-who]::before{
    content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;
    border-radius:0 3px 3px 0;background:var(--own);opacity:.9;
  }
  .note.res::before{opacity:.32}
  .note.on::before{opacity:1;box-shadow:0 0 0 1px var(--own)}
  /* el timecode pasa de texto suelto a CHIP calido (unico color calido de la UI) */
  /* el chip del timecode ya no usa color (todo es gris). Se destaca por
     fondo, borde y peso de fuente — igual que hace Frame.io, pero sin tono. */
  .note .tcx{
    font-family:var(--mono);font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums;
    color:var(--tcf);background:var(--tcb);padding:1px 5px;border-radius:5px;
    letter-spacing:.2px;border:1px solid var(--line);
  }
  /* el marcador de la barra de tiempo toma el color del autor */
  .mark::after{
    content:"";position:absolute;inset:-2.5px -1px;border-radius:2px;
    border:1px solid var(--own,#111);opacity:.5;
  }
  .mark.done{opacity:.38}

  .note.ph .txt{color:var(--fg)}
  .note.ph .phdot{
    display:block;position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
  }
  .note .phdot{display:none}
  .note.ph.on{background:var(--raised)}
  .note.ph.on .phdot{width:3px;background:var(--accent)}
  .note.on .phdot{display:block;background:var(--accent)}
  .note.res .txt{color:var(--fg-mute);text-decoration:line-through;text-decoration-color:var(--strike)}
  .note .body{flex:1;min-width:0}

  /* X2 · decisiones + chat paginado. La lista nunca desplaza: cada pagina se
     calcula con la altura disponible y solo monta las entradas que caben. */
  .list{overflow:hidden}
  .x2filters{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:5px;padding:6px 9px;
    border-bottom:1px solid var(--line-soft);background:var(--panel)}
  .x2search,.x2select{height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);
    padding:0 8px;font-size:11px;min-width:0}
  .x2select{max-width:94px}
  .x2checks{grid-column:1/-1;display:flex;align-items:center;gap:12px;min-height:20px}
  .x2pager{flex:0 0 34px;display:flex;align-items:center;justify-content:space-between;padding:3px 9px;
    border-top:1px solid var(--line);font:11px var(--mono);color:var(--fg-mute)}
  .x2pager button{width:28px;height:28px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center}
  .x2pager button:disabled{opacity:.3;cursor:default}
  .x2round{font:10px var(--mono);color:var(--fg-dim);white-space:nowrap}
  .note.change{border:1px solid var(--fg);border-left-width:3px;margin:6px 8px;padding:8px;border-radius:6px;background:var(--panel)}
  .note.change::before{display:none}
  .note.change .tcx{border-style:dashed}
  .decision{font:10px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap}
  .decision.adjust{border-style:dashed}
  .decide{display:flex;gap:5px;margin-top:7px}
  .decide button{min-height:28px;padding:0 7px;border:1px solid var(--line);border-radius:5px;font-size:11px;display:inline-flex;align-items:center;gap:4px}
  .decide button:hover{border-color:var(--fg);background:var(--hover)}
  .decide svg{width:13px;height:13px}
  .draft-badge{font:10px var(--mono);border:1px dashed var(--fg-dim);border-radius:4px;padding:1px 5px}
  .editor.adjusting{border-top-style:dashed}
  .note .meta{display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}
  /* (la regla vieja de .tcx que pisaba el chip la borramos) */
  .note .frx,.note .rng{font-family:var(--mono);font-size:10px;color:var(--fg-mute)}
  .note .who{font-size:9.5px;padding:1px 5px;border-radius:3px;font-family:var(--mono)}
  .note .who.c{background:var(--info-soft);color:var(--info);border:1px solid var(--line-c)}
  .note .who.y{background:var(--ok-soft);color:var(--ok);border:1px solid var(--line-y)}
  .note .txt{font-size:12.5px;white-space:pre-wrap;word-break:break-word;line-height:1.55}
  .note .thumb{width:54px;height:31px;border-radius:4px;object-fit:cover;flex:0 0 54px;border:1px solid var(--line);background:#000}
  .note .acts{display:flex;gap:1px;opacity:0;flex:0 0 auto}
  .note:hover .acts,.note.on .acts{opacity:1}
  .note .acts button{width:21px;height:21px;border-radius:4px;display:grid;place-items:center;color:var(--fg-mute)}
  .note .acts button:hover{background:var(--hover);color:var(--hover-ink)}
  .note .acts button svg{width:12px;height:12px}
  .note .acts button.ok:hover{color:var(--ok)}
  .note .acts button.ed:hover{color:var(--accent)}
  .note .acts button.mv:hover{color:var(--accent)}
  .note .acts button.del:hover{color:var(--danger)}
  .note .acts button[disabled]{opacity:.35;cursor:default}

  /* ═══ HILOS ═══
     Un hilo es un bloque: la nota raiz y debajo sus respuestas, colgando de una
     linea vertical fina que sale del anillo de identidad de la raiz (es como lo
     hace Frame.io: "linea vertical fina colgando del avatar del padre").
     El separador entre HILOS es el hairline de siempre; entre la raiz y sus
     respuestas no hay separador, porque son la misma conversacion. */
  .hilo-b{border-bottom:1px solid var(--line-soft);position:relative}
  .hilo-b .note{border-bottom:0}
  /* la raiz de un hilo con respuestas no se separa de ellas */
  .hilo-b .note.raiz{padding-bottom:5px}
  /* las respuestas: sangradas, mas pequenas, sin chip de timecode (comparten el
     momento de la raiz: repetirlo seria ruido que miente sobre que son) */
  .rep{display:flex;gap:7px;padding:4px 11px 4px 26px;position:relative;cursor:pointer}
  .rep:hover{background:var(--panel-2)}
  .rep[data-who="cristian"]{--own:var(--yo); --own-ring:var(--yo-ring)}
  .rep[data-who="claude"]  {--own:var(--claude); --own-ring:var(--claude-ring)}
  /* el hilo vertical: nace bajo el anillo de la raiz y baja por todas las respuestas */
  .rep::before{content:"";position:absolute;left:13px;top:0;bottom:0;width:1px;
    background:var(--line)}
  .rep:last-child::before{bottom:calc(100% - 11px)}   /* la ultima lo corta a su altura */
  /* el codo que entra a la respuesta */
  .rep::after{content:"";position:absolute;left:13px;top:10px;width:8px;height:1px;
    background:var(--line)}
  .rep .rbody{flex:1;min-width:0}
  .rep .rmeta{display:flex;align-items:center;gap:5px;margin-bottom:2px}
  .rep .rwho{font-size:9.5px;font-family:var(--mono);color:var(--fg-mute);
    display:flex;align-items:center;gap:4px}
  /* el punto de identidad de quien responde: mismo mecanismo de anillo, en pequeno */
  .rep .rwho::before{content:"";width:6px;height:6px;border-radius:50%;
    background:var(--own,var(--fg-mute));flex:0 0 6px}
  .rep .rtxt{font-size:12px;white-space:pre-wrap;word-break:break-word;line-height:1.5;color:var(--fg-dim)}
  .rep .racts{display:flex;gap:1px;opacity:0;flex:0 0 auto}
  .rep:hover .racts{opacity:1}
  .rep .racts button{width:19px;height:19px;border-radius:4px;display:grid;place-items:center;color:var(--fg-mute)}
  .rep .racts button:hover{background:var(--hover);color:var(--hover-ink)}
  .rep .racts button svg{width:11px;height:11px}

  /* ── ESTADO DEL HILO: una pastilla, tres formas, cero color ──
     pendiente  = sin pastilla (el caso normal no gasta tinta)
     respondida = pastilla con la cuenta de respuestas, borde solido
     cerrada    = pastilla con check, borde punteado y texto tachado (ya lo hacia .res) */
  .hst{font-size:9.5px;font-family:var(--mono);padding:1px 5px;border-radius:9px;
    border:1px solid var(--line);color:var(--fg-mute);background:var(--panel-2);
    cursor:pointer;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
  .hst:hover{border-color:var(--on-border);color:var(--fg)}
  .hst.abierto{border-color:var(--fg-mute);color:var(--fg-dim);font-weight:600}
  .hst.cerrado{border-style:dashed}
  .hst .cv{display:inline-block;width:5px;height:5px;border-right:1.5px solid currentColor;
    border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-bottom:2px}
  .hst.plegado .cv{transform:rotate(-45deg);margin:0 0 0 1px}
  /* chip "viene de la version anterior" */
  .vfrom{font-size:9.5px;font-family:var(--mono);padding:1px 5px;border-radius:5px;
    border:1px dashed var(--line);color:var(--fg-mute);white-space:nowrap}
  /* la caja de respuesta abierta: el editor de abajo cambia de modo, y aqui se marca
     a QUE hilo esta apuntando para que no se responda a ciegas */
  .note.respondiendo, .rep.respondiendo{background:var(--accent-soft)}
  .note.respondiendo::after{content:"";position:absolute;left:0;right:0;bottom:0;
    height:2px;background:var(--accent)}

  .editor{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel-2);padding:9px 11px}
  .ed-head{display:flex;align-items:center;gap:7px;margin-bottom:6px;min-height:19px}
  .ed-head .at{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);
    padding:2px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
  .ed-head .lbl{font-size:11px;color:var(--fg-mute);flex:1}
  .ed-head button{font-size:10.5px;color:var(--fg-dim);padding:2px 5px;border-radius:4px;display:flex;align-items:center;gap:3px}
  .ed-head button:hover{background:var(--hover);color:var(--hover-ink)}
  .ed-head button svg{width:11px;height:11px}
  /* aviso de nota sin guardar */
  .dirty{
    font-size:10px;color:var(--accent);display:none;align-items:center;gap:4px;
    padding:2px 6px;border-radius:4px;background:var(--accent-soft);white-space:nowrap;
  }
  .dirty.on{display:flex}
  .dirty::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 5px}
  #ta{width:100%;min-height:64px;max-height:180px;resize:vertical;font-size:12.5px;line-height:1.55;
    background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:8px 9px}
  #ta:focus{border-color:var(--on-border)}
  #ta::placeholder{color:var(--fg-mute)}
  .ed-foot{display:flex;align-items:center;gap:7px;margin-top:6px}
  /* Los atajos ya no se imprimen aqui: ocupan dos lineas y empujaban el boton de
     borrar. Ahora viven en el tooltip del boton Guardar y en el panel de ayuda. */
  .hint{flex:1;min-width:0}
  kbd{font-family:var(--mono);font-size:9.5px;background:var(--track);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:3.5px;padding:1px 4px;color:var(--fg-dim)}


  /* ── Mover nota: vista previa + barra ── */
  .mvprev{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;
    margin-bottom:10px;max-height:210px;display:grid;place-items:center}
  .mvprev video{max-width:100%;max-height:210px;display:block}
  .mvtc{position:absolute;left:8px;bottom:6px;font-family:var(--mono);font-size:12px;
    color:#fff;background:rgba(0,0,0,.66);padding:2px 7px;border-radius:4px;
    font-variant-numeric:tabular-nums}
  .mvbar{position:relative;height:26px;cursor:pointer;touch-action:none;margin-bottom:8px}
  .mvtrack{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:4px;
    background:var(--track);border-radius:3px}
  .mvhead{position:absolute;top:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;
    background:var(--accent);transform:translateY(-50%);box-shadow:0 0 0 3px var(--accent-glow);
    pointer-events:none}
  .mvmarks{position:absolute;left:0;right:0;top:50%;height:26px;transform:translateY(-50%);pointer-events:none}
  .mark2{position:absolute;top:50%;width:2px;height:9px;margin-left:-1px;transform:translateY(-50%);
    background:var(--fg-mute);opacity:.7;border-radius:1px}
  .mvrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .mvsec{width:96px;margin:0;font-family:var(--mono);text-align:center}
  .mvsec::-webkit-outer-spin-button,.mvsec::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}


  /* ── etiqueta flotante al pasar el mouse ──
     Antes era un ::after dentro del propio boton. No se veia nunca en los sitios
     donde mas falta hacia: los botones de cada nota viven dentro de .list, que
     tiene overflow-y:auto (eso recorta en los DOS ejes), y la etiqueta sale por
     el borde derecho y por arriba de la lista. Los de la barra superior se
     cortaban contra el techo de la ventana (body tiene overflow:hidden).
     Ahora es UNA sola capa position:fixed colgada del <body>: nada la recorta. */
  .has-tip{position:relative}
  #tipLayer{
    position:fixed;left:0;top:0;z-index:300;pointer-events:none;
    background:var(--raised);color:var(--fg);border:1px solid var(--on-border);
    padding:5px 9px;border-radius:5px;font-size:11.5px;font-family:var(--sans);
    line-height:1.35;white-space:nowrap;box-shadow:0 4px 14px var(--shadow-soft);
    opacity:0;transform:translateY(3px);transition:opacity .11s,transform .11s;
  }
  /* la posicion va en left/top (sin transicion, salto limpio entre botones) y la
     entrada se anima solo con opacity + un transform de 3px */
  #tipLayer.on{opacity:1;transform:translateY(0)}
  #tipLayer{will-change:opacity}
  #tipLayer kbd{margin-left:6px}
  @media (prefers-reduced-motion: reduce){ #tipLayer{transition:none} }


  /* ── Timeline con zoom ──
     Los botones [−] [+] ya NO viven dentro de la banda: se fueron a .tlctrls con el
     resto de controles. Eso elimina de raiz el desfase de eje que obligaba a poner
     `margin:0 28px` en la regleta para que su 50 % cayera sobre el 50 % de la pista. */
  .scrub-fill{background:var(--accent-dim)}
  /* zona de agarre invisible mas ancha que el marcador (6px -> 22px) */
  .mark::before{content:"";position:absolute;left:-9px;right:-9px;top:-9px;bottom:-9px}
  .mark::after{border-radius:3px}
  .tlinfo{font-family:var(--mono);font-size:10px;color:var(--fg-mute);letter-spacing:.2px}
  /* height:22px = misma altura que los botones de zoom. Los cuatro .xs viven en
     .tlctrls y son el mismo grupo: tienen que medir lo mismo. */
  .btn.xs{height:22px;padding:0 7px;font-size:10.5px;border-radius:4px;font-family:var(--sans)}
  /* los .xs con icono: mismo cuadro que los de zoom, geometria en vez de texto */
  .btn.xs.icon{width:22px;height:22px;padding:0;justify-content:center}
  .btn.xs svg{width:13px;height:13px;flex:0 0 13px}


  /* ── Deshacer / rehacer ── */
  .undoBox{display:flex;align-items:center;gap:3px}
  .undoBox .btn.icon{width:24px;height:24px;padding:0}
  .undoLbl{font-size:11.5px;color:var(--fg-mute);font-family:var(--sans);white-space:nowrap;
    max-width:210px;overflow:hidden;text-overflow:ellipsis}
  #bRedoAccion:disabled{opacity:.4;cursor:default}


  /* ── Marcadores de CAMBIO (kind:"cambio") ──
     Agente los pone donde toco algo. Punto verde, sin texto: solo una senal para
     saltar directo al cambio y no ver el video entero. */
  .mark.cambio{background:var(--cambio) !important;border-color:var(--cambio) !important}
  /* el anillo del punto de cambio tambien es redondo: con inset:-2.5px -1px y
     border-radius:3px (heredados de .mark::after) quedaba un cuadrado alrededor
     de un circulo */
  .mark.cambio::after{border-color:var(--cambio) !important;opacity:.85;
    inset:-2.5px;border-radius:50%}
  .mark.cambio::before{ /* area de agarre igual de comoda */
    content:"";position:absolute;left:-9px;right:-9px;top:-9px;bottom:-9px}
  .mark.cambio:hover{filter:brightness(1.3)}
  /* el punto de cambio es una esfera, no una linea: se distingue de un vistazo.
     Sin `top`: con top + bottom + height a la vez la caja queda sobre-restringida y
     el navegador descarta el bottom — el marcador se iba de su fila. */
  .mark.cambio{width:var(--mark-h);height:var(--mark-h);margin-left:calc(var(--mark-h) * -0.5);
    border-radius:50%;border:0;background:var(--cambio)}

  /* ── MARCADOR DE HILO ──
     Una nota con respuestas es la MISMA marca con una muesca encima: un hilo no es
     otra cosa, es una nota que ya tiene conversacion. Sin color: la senal es la forma
     (el ancho sube de 3 a 5px y aparece la muesca), que es lo que se lee a 9px. */
  .mark.hilo{width:5px;margin-left:-2.5px}
  .mark.hilo::before{top:-11px}             /* el agarre crece con la muesca */
  .mark.hilo .muesca{position:absolute;left:-1px;right:-1px;top:-4px;height:3px;
    border-radius:1px;background:var(--own,var(--fg-mute))}
  /* heredada de la version anterior: contorno abierto en vez de barra solida.
     "Esto viene de v1" se ve antes de leer nada. */
  .mark.her{background:var(--panel)}
  .mark.her::after{border-width:1.5px;opacity:1}

  /* ── SPRITE DE ICONOS ──
     Los <path> son geometria Lucide exacta, pero Lucide depende de heredar
     fill:none + stroke:currentColor del <svg> host. Sin este contrato, el
     navegador los pinta con fill:black -> siluetas negras. Estan todos vacios
     a proposito: la app es local y no puede depender de la red. */
  svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* los iconos que son silueta solida (play, pause, prev, next) llevan
     fill="currentColor" inline, que gana sobre el CSS: se ven rellenos. */
  svg.sprite{display:none}


  /* ── REGLETA DEL VIDEO ENTERO ──
     Antes era un CARRIL de 18px con borde, fondo y etiqueta propios, apilado ENCIMA
     de la barra de tiempo: dos cajas del mismo ancho, una sobre otra, leidas como dos
     lineas de tiempo. El problema no era la informacion, era que tenia cuerpo de barra.

     Ahora es una REGLETA de 6px sin borde, pegada bajo la pista de progreso DENTRO de
     la misma banda, y solo existe cuando hay zoom (.on lo pone tlPintarVentana).
     Con zoom 1 — el estado normal — la pista YA es el video entero y los marcadores
     agarrables ya estan ahi: la regleta no tendria nada que anadir, asi que no esta.
     Hay UNA barra.

     Lo que NO cambia: la coordenada sigue siendo frame/duracionTotal, pura, sin pasar
     por la ventana de zoom. Por eso los ticks no se mueven al navegar, el clic en el
     fondo sigue llevando a cualquier punto del video (la unica via de salir de la
     ventana con zoom alto) y el clic en un tick sigue saltando a su fotograma. */
  .tlrail{position:relative;height:var(--rule-h);flex:0 0 var(--rule-h);
    margin:1px 0 0;border-radius:3px;background:var(--panel-2);border:0;
    overflow:visible;cursor:pointer;display:none}
  .tlrail.on{display:block}
  /* nota = tick de 2px · cambio = 3px con capa por encima. Dos formas, cero color. */
  .tlrail .rnote{position:absolute;bottom:0;width:2px;height:var(--rule-h);
    border-radius:1px;transform:translateX(-50%);
    background:var(--own,var(--fg-mute));opacity:.85;cursor:pointer;z-index:1}
  /* area de clic comoda alrededor de un tick de 2px */
  .tlrail .rnote::before{content:"";position:absolute;left:-5px;right:-5px;top:-7px;bottom:-7px}
  .tlrail .rnote.cambio{width:3px;background:var(--cambio);opacity:1;border:0}
  .tlrail .rnote.cambio::after{content:"";position:absolute;left:-1px;right:-1px;
    top:-3px;height:3px;background:var(--cambio);border-radius:1px}
  /* hilo con respuestas: una muesca arriba del tick, la misma senal que en la pista */
  .tlrail .rnote.hilo::after{content:"";position:absolute;left:-1.5px;right:-1.5px;
    top:-3px;height:2px;background:var(--own,var(--fg-mute));border-radius:1px}
  .tlrail .rnote.done{opacity:.3}
  .tlrail .rnote:hover{opacity:1;box-shadow:0 0 0 1px var(--fg)}
  .tlrail .rnote:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tlrail .rnote.sel{box-shadow:0 0 0 2px var(--sel-bar);border-radius:2px}
  .tlrail:hover{background:var(--track)}
  /* ── VENTANA VISIBLE sobre la regleta ──
     El rectangulo que dice que trozo del video esta representando la pista de arriba.
     Va por debajo de los ticks (z-index 0 contra 1) y no recibe el puntero, asi que
     no estorba ni al clic de la regleta ni al de un marcador. */
  .tlwin{position:absolute;top:-1px;bottom:-1px;min-width:2px;
    border:1px solid var(--fg);border-radius:3px;background:var(--accent-soft);
    pointer-events:none;display:none;z-index:0}
  .tlwin.on{display:block}
  /* la cuenta de cambios/notas se fue con los controles: en una regleta de 6px no
     hay sitio para texto, y de todas formas es una lectura, no parte del mapa */
  .rlbl{font-family:var(--mono);font-size:9.5px;color:var(--fg-mute);
    letter-spacing:.2px;pointer-events:none;white-space:nowrap;padding-right:2px}


  /* los 5 canales de "esta seleccionado" */
  .pitem.on, .vitem.on{
    background:var(--sel-bg) !important;
    border-color:var(--sel-line) !important;
    font-weight:600;
  }
  .pitem.on::before, .vitem.on::before{
    content:"";position:absolute;left:-1px;top:3px;bottom:3px;width:3px;
    border-radius:0 3px 3px 0;background:var(--sel-bar);
  }
  .pitem.on .vn, .vitem.on .vn{color:var(--fg) !important}
  .pitem.on svg, .vitem.on svg{color:var(--sel-bar) !important;opacity:1 !important;width:13px;height:13px}
  .pitem:hover:not(.on), .vitem:hover:not(.on){background:var(--hover) !important}
  /* el proyecto activo tiene ademas un punto verde si Agente marco cambios sin ver */
  .pitem{position:relative}
  .vitem{position:relative}
  .pitem.on, .vitem.on{border-radius:7px}


  /* ── Paneles plegables ──
     Cristian: "quizas las columnas proyectos y tomas se pueda minimizar para ocupar
     menos espacio". Se pliegan a un asa de 30px que conserva lo accionable:
     numero de notas y si hay cambios sin revisar. */
  /* Los dos botones de la cabecera (plegar / nuevo) miden LO MISMO. Antes uno era
     .plegar (26px, svg 13px) y el otro .btn.icon.sm (28px, svg 16px): se veian
     descuadrados uno al lado del otro. */
  .plegar{display:flex;align-items:center;justify-content:center;
    width:26px;height:26px;flex:0 0 26px;padding:0;border-radius:6px;
    background:transparent;border:1px solid transparent;color:var(--fg-mute);
    cursor:pointer;transition:color .12s,background .12s}
  .plegar:hover{background:var(--hover);color:var(--fg)}
  .plegar svg{width:14px;height:14px;height:14px;transition:transform .16s}
  .plegar > svg{flex:0 0 auto;display:block}
  body.nav-plegado .rail, body.nav-plegado .vcol{
    flex:0 0 0 !important;width:0 !important;overflow:hidden;border-right:0}
  body.nav-plegado .rail-head, body.nav-plegado .vcol-head{display:none}
  /* El asa plegada mide 30px y va pegada al borde izquierdo. El contenido tiene que
     empezar a su derecha: antes se metia debajo y el primer boton de la barra de
     dibujo (lapiz) quedaba tapado. El main ya no existe en esa zona porque el rail
     esta a width:0, asi que el margen va en el stage. */
  body.nav-plegado .stage{padding-left:30px}
  /* el asa vive pegada al borde del stage cuando el panel esta plegado */
  /* El asa plegada va DEBAJO de la cabecera, no encima. Antes era top:0 bottom:0 con
     z-index:20 y tapaba el nombre del programa, el estado y el boton de la build. */
  .navhandle{position:absolute;left:0;top:46px;bottom:0;width:30px;z-index:5;
    display:none;align-items:center;flex-direction:column;gap:9px;padding-top:9px;
    background:var(--panel);border-right:1px solid var(--line)}
  body.nav-plegado .navhandle{display:flex}
  .navhandle .hb{font-family:var(--mono);font-size:10px;color:var(--fg-dim);
    background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
    padding:2px 5px;cursor:pointer}
  .navhandle .hb.chg{background:var(--cambio-soft,#E4F0EA);color:var(--cambio,#277A5A);
    border-color:var(--cambio-ring,#4FB08C)}
  .navhandle button{writing-mode:vertical-rl;padding:7px 3px;border-radius:0 5px 5px 0;
    background:transparent;border:0;border-right:1px solid var(--line);
    color:var(--fg-mute);cursor:pointer;font-size:11px;letter-spacing:.06em}
  .navhandle button:hover{background:var(--hover);color:var(--fg)}


  /* ── UNA SOLA BARRA ──
     Una banda. Dentro: marcadores arriba, pista en medio, regleta abajo (solo con
     zoom). Un borde (ninguno), un fondo (ninguno), un eje X. Los controles — incluidos
     [−] y [+], que antes partian la banda por los lados — viven todos a la derecha.

     Medidas reales de la banda, de abajo arriba (ver :root):
       regleta   0..6px   bajo la banda, solo con zoom
       pista     4..9px   desde el suelo de la banda
       fila 0    9..18px  marcadores
       fila 1   20..29px  marcadores apilados (tope: TL_LANES = 2)
       alto total 32px — FIJO. Ningun pintado lo cambia. */
  .tlinesa{display:flex;align-items:flex-end;gap:10px;padding:0 10px;flex:0 0 auto}
  .tlstack{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:0}
  .tlctrls{display:flex;align-items:center;gap:4px;flex:0 0 auto;padding-bottom:2px}
  /* los [−] [+] son del mismo grupo que los demas: mismo cuadro de 22px */
  .tlctrls .btn.xs.icon{font-size:14px;line-height:1;display:grid;place-items:center}
  /* lecturas numericas de la fila de transporte.
     ANCHO FIJO a proposito: el texto cambia de largo con el zoom ("todo el video" ->
     "00:00:12:04 – 00:00:14:16 · 8× · 60 f"). Si la caja creciera con el texto, cada
     paso de zoom empujaria todos los botones de la fila. Lo que sobra se recorta. */
  .tp-row .tlinfo{font-family:var(--mono);font-size:10.5px;color:var(--fg-mute);
    letter-spacing:.2px;white-space:nowrap;margin:0;
    flex:0 0 252px;width:252px;overflow:hidden;text-overflow:ellipsis}
  .fpsv{font-family:var(--mono);font-size:10.5px;color:var(--fg-mute);white-space:nowrap}


  /* ── Color: UN circulito que se despliega ──
     Antes eran 7 circulitos en fila, que ocupaban 129px de la barra de dibujo y de ahi
     la sensacion de "menu que no se entiende". Ahora: un circulito con el color actual,
     y al hacer clic se despliegan los demas. */
  .colorWrap{position:relative;flex:0 0 auto}
  .swatchBtn{width:26px;height:26px;border-radius:50%;padding:3px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center}
  .swatchBtn:hover{border-color:var(--fg)}
  .swatchDot{width:16px;height:16px;border-radius:50%;background:var(--pincel,#ff4d4d);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
  #edLbl.respondiendo{color:var(--fg);font-weight:650;background:var(--panel-2);
    padding:1px 7px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--fg)}

  /* ── Archivar proyecto ── */
  .parch{position:absolute;right:6px;top:6px;width:22px;height:22px;padding:0;
    display:none;place-items:center;border-radius:5px;border:1px solid transparent;
    background:var(--panel);color:var(--fg-mute);cursor:pointer;z-index:2}
  .parch svg{width:13px;height:13px}
  .parch:hover{background:var(--hover);color:var(--fg);border-color:var(--line)}
  .pitem:hover .parch, .pitem:focus-within .parch{display:grid}
  .pitem.arch{opacity:.62}
  .pitem.arch .parch{display:grid}
  .psecc{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;
    color:var(--fg-dim);padding:14px 10px 6px;margin-top:6px;border-top:1px solid var(--line-soft)}
  /* La banda ocupa TODO el ancho. Antes .tlctrls estaba dentro de .tlinesa y le
     robaba 301px a la pista. */
  .tlinesa{width:100%}
  .tlstack{flex:1 1 auto;min-width:0}
  .tlctrls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    padding:6px 12px 0;border-top:1px solid var(--line-soft);margin-top:6px}
  .tlctrls .rlbl{margin-right:auto}
  .swPop{position:fixed;display:flex;gap:4px;padding:5px;border-radius:9px;
    background:var(--raised);border:1px solid var(--line);
    box-shadow:0 6px 22px var(--shadow-soft);z-index:900;max-width:calc(100vw - 16px);
    flex-wrap:wrap;justify-content:center}
  /* cuando no hay sitio arriba, se voltea hacia abajo */
  .swPop.arrriba{bottom:auto}
  .swPop.abajo{top:auto}
  .swPop[hidden]{display:none}
  .swPop .sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .swPop .sw.on{border-color:var(--fg);transform:scale(1.1)}

  .modal{position:fixed;inset:0;background:var(--modal-bg);z-index:100;display:none;place-items:center;padding:24px}
  .modal.on{display:grid}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:11px;width:100%;max-width:640px;
    max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--sheet-shadow);overflow:hidden}
  .sheet-head{padding:14px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .sheet-head h3{font-size:14px;font-weight:600;flex:1}
  .sheet-body{padding:15px 17px;overflow-y:auto}
  .sheet-foot{padding:11px 17px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--panel-2)}
  pre{font-family:var(--mono);font-size:11.5px;line-height:1.7;background:var(--bg);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px;overflow-x:auto;white-space:pre}
  .copybox{font-family:var(--mono);font-size:11.5px;line-height:1.75;background:var(--bg);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px;max-height:270px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;color:var(--fg-dim)}
  .st{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
  .st .k{color:var(--fg-mute);flex:0 0 100px}
  .st .v{color:var(--fg);flex:1;word-break:break-word;font-family:var(--mono);font-size:11.5px}
  .srow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
  .srow .btn{height:30px;padding:0 11px}
  h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-mute);margin:17px 0 8px;font-weight:600}
  h4:first-child{margin-top:0}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--raised);
    border:1px solid var(--on-border);color:var(--fg);padding:9px 14px;border-radius:8px;font-size:12px;opacity:0;
    transition:.19s;z-index:200;box-shadow:0 10px 30px var(--shadow-soft);pointer-events:none;white-space:nowrap;max-width:88vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .warn{color:var(--danger)}
  .lbl{font-size:11px;color:var(--fg-mute);display:block;margin-bottom:5px}
  .fld{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);
    padding:7px 9px;font-size:12.5px;margin-bottom:11px}
  .fld:focus{border-color:var(--on-border)}
  textarea.fld{min-height:62px;resize:vertical}

  /* ═══ INVITADOS ═══
     Tres autores, tres FORMAS (cero color): Cristian barra negra solida, Agente gris,
     invitado barra A RAYAS y chip con borde discontinuo. Se lee a 9px sin leer el texto. */
  :root{--invitado:#3a3a3a;--invitado-ring:#8a8a8a}
  .note[data-who="invitado"],.rep[data-who="invitado"]{--own:var(--invitado);--own-ring:var(--invitado-ring)}
  .note[data-who="invitado"]::before{
    background:repeating-linear-gradient(180deg,var(--own) 0 3px,transparent 3px 6px)}
  .rep[data-who="invitado"] .rwho::before{border-radius:1px;background:var(--own)}
  .note .who.i{background:var(--panel);color:var(--fg);border:1px dashed var(--fg-dim);font-weight:600}
  .mark.inv{background:repeating-linear-gradient(180deg,var(--own) 0 2px,transparent 2px 4px)}
  .mark.inv::after{border-style:dashed}
  .tlrail .rnote.inv{background:repeating-linear-gradient(180deg,var(--own) 0 1.5px,transparent 1.5px 3px)}
  /* banner fijo del invitado: vive en la barra superior (46px, siempre visible) */
  .invbanner{display:none;align-items:center;gap:5px;font-size:12px;color:var(--fg-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .invbanner b{color:var(--fg);font-weight:600}
  .invbanner .who.i{font-size:9.5px;padding:1px 5px;border-radius:3px;font-family:var(--mono)}
  body.invitado .invbanner{display:flex}
  /* lo que un invitado NO ve: oculto (display:none), no deshabilitado */
  body.invitado .rail, body.invitado .vcol, body.invitado .navhandle,
  body.invitado #bProj, body.invitado .topbar .chk, body.invitado #bClaude, body.invitado #bCopy,
  body.invitado #bOut, body.invitado #sello, body.invitado .undoBox,
  body.invitado #bDel, body.invitado #bMove, body.invitado #tlChg, body.invitado #vfilter,
  body.invitado #bShare, body.invitado #bHer, body.invitado #bUp,
  body.invitado .note .acts .ok, body.invitado .note .acts .mv, body.invitado .note .acts .del,
  body.invitado .rep .racts .del{display:none !important}
  body.invitado .stage{padding-left:0 !important}
  body.invitado .tp-row .tlinfo{flex:0 0 200px;width:200px}
  /* enlace caducado: se ve, no se escribe */
  body.inv-caducado #ta, body.inv-caducado .tools, body.inv-caducado #bEnd,
  body.inv-caducado .note .acts, body.inv-caducado .rep .racts, body.inv-caducado #bErase,
  body.inv-caducado #bUndo, body.inv-caducado #bRedo{opacity:.3;pointer-events:none}
  body.inv-caducado .invbanner b{text-decoration:underline;text-decoration-style:dashed}
  body.inv-caducado .framewrap canvas{cursor:default;pointer-events:none}
  /* ── Compartir (Cristian): popover bajo el boton de la cabecera del video ── */
  .shPop{position:fixed;z-index:900;width:396px;background:var(--raised);border:1px solid var(--line);
    border-radius:9px;box-shadow:0 8px 26px var(--shadow-soft);padding:10px 12px 8px;display:none;
    max-height:calc(100vh - 70px);overflow:hidden;flex-direction:column}
  .shPop.on{display:flex}
  .shPop[hidden]{display:none}
  .shPop h3{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .shPop h3 svg{width:13px;height:13px;color:var(--fg-mute)}
  .shPop h3 .shx{margin-left:auto;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--fg-mute)}
  .shPop h3 .shx:hover{background:var(--hover);color:var(--fg)}
  .shPop h3 .shx svg{width:12px;height:12px;color:inherit}
  .shst-line{font-size:11px;color:var(--fg-mute);margin-bottom:8px;display:flex;align-items:center;gap:5px;min-height:16px}
  .shst-line i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--fg-dim);flex:0 0 7px}
  .shst-line.abierta i{background:var(--fg);border-color:var(--fg)}
  .shform{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line-soft)}
  .shform select,.shform input:not([type=checkbox]){height:26px;padding:0 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-size:11.5px}
  .shform select{flex:0 0 auto}
  .shform input:not([type=checkbox]){flex:1 1 110px;min-width:90px}
  .shform .chk{font-size:11px;flex:0 0 auto}
  .shform .btn.sm{flex:0 0 auto}
  .shnuevo{display:none;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:11px}
  .shnuevo.on{display:flex}
  .shurl{font-family:var(--mono);font-size:10.5px;color:var(--fg);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .shlist{overflow-y:auto;min-height:0}
  .shempty{font-size:11.5px;color:var(--fg-mute);padding:9px 0 3px}
  .shlink{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:11.5px}
  .shlink:last-child{border-bottom:0}
  .shlink .shb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .shlink .shn{display:flex;align-items:center;gap:6px;min-width:0}
  .shlink .shetq{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .shlink .shm{font-family:var(--mono);font-size:10px;color:var(--fg-mute);white-space:nowrap}
  .shst{font-size:9.5px;font-family:var(--mono);padding:1px 5px;border-radius:9px;border:1px solid var(--line);
    color:var(--fg-mute);background:var(--panel-2);white-space:nowrap;flex:0 0 auto}
  .shst.activo{border-color:var(--fg);color:var(--fg);font-weight:600}
  .shst.caducado{border-style:dashed}
  .shst.revocado{text-decoration:line-through}
  .shlink.muerto .shetq,.shlink.muerto .shm{color:var(--fg-mute)}
  .shlink .btn.xs{flex:0 0 auto}
  .shlink .btn.xs.confirmar{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
  .shaviso{font-size:11px;color:var(--fg-dim);padding:6px 0 0}

  /* ── Comparar v01 · v02 (P7) ──
     Estado de VISTA, no de datos: un segundo <video> (#v2) que sigue al principal.
     Lado a lado: .screen pasa a flex y el JS fija en px el tamano de las dos cajas
     (misma altura, cada una con su proporcion). Cortina: #cmpWrap se coloca ENCIMA
     de #fw con su mismo rectangulo y se recorta con clip-path; el tirador vive en
     una capa aparte (#cmpCurtain) para que el recorte no se lo coma. */
  .cmpwrap{position:absolute;display:none;z-index:3;background:#000;border-radius:2px;overflow:hidden}
  .cmpwrap.on{display:block}
  .cmpwrap video{width:100%;height:100%;display:block;background:#000}
  .screen.cmp-side{display:flex;align-items:center;justify-content:center;gap:12px}
  .screen.cmp-side .cmpwrap{position:relative;order:0;flex:0 0 auto}
  .screen.cmp-side .framewrap{order:1;flex:0 0 auto}
  .screen.cmp-side .framewrap video{width:100%;height:100%}
  /* en cortina la capa del otro corte SI recibe el puntero: un clic a la izquierda
     del divisor no debe llegar al canvas (no dibuja ni pausa), como en la maqueta */
  .cmpcurtain{position:absolute;display:none;z-index:4;pointer-events:none}
  .cmpcurtain.on{display:block}
  .cmpline{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;
    box-shadow:0 0 0 1px rgba(0,0,0,.35)}
  .cmphandle{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;
    background:#fff;border:1px solid var(--line);display:grid;place-items:center;cursor:ew-resize;
    pointer-events:auto;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .cmphandle svg{width:14px;height:14px;color:#111;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .cmphandle:focus-visible{outline:2px solid #111;outline-offset:2px}
  .cmplbl{position:absolute;left:8px;top:8px;z-index:5;font-family:var(--mono);font-size:10px;line-height:1.5;
    color:#fff;background:rgba(0,0,0,.62);padding:2px 6px;border-radius:3px;pointer-events:none;
    max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmplbl[hidden]{display:none}
  .screen.cmp-curtain .cmplbl-cur{left:auto;top:auto;right:8px;bottom:8px}
  .cmpctl{position:absolute;top:10px;right:12px;z-index:6;display:flex;align-items:center;gap:4px}
  .cmpctl select{height:22px;padding:0 6px;border:1px solid var(--line);border-radius:4px;
    background:var(--panel-2);font-size:10.5px;max-width:170px;color:var(--fg-dim)}
  .cmpctl [hidden]{display:none !important}
  .cmppill{position:absolute;left:12px;bottom:10px;z-index:6;font-family:var(--mono);font-size:10px;
    color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:2px 7px;border-radius:4px;
    max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmppill[hidden]{display:none}
  /* el invitado no compara: ni boton, ni capa, ni pista de que existe */
  body.invitado .cmpctl,body.invitado .cmpwrap,body.invitado .cmpcurtain,body.invitado .cmppill,
  body.invitado .cmplbl{display:none !important}

  @media (max-width:1180px){
    .rail{flex:0 0 176px;width:176px}
    .vcol{flex:0 0 200px;width:200px}
    .side{flex:0 0 300px;width:300px}
    /* sigue siendo fijo (no crece con el texto), solo mas estrecho */
    .tp-row .tlinfo{flex:0 0 150px;width:150px}
  }
  @media (max-width:1700px){
    .tp-row{flex-wrap:wrap;row-gap:6px}
    .tp-row .tlinfo{flex:1 1 150px;width:auto}
    .x2checks{flex-wrap:wrap;gap:5px 10px}
  }
  @media (max-width:920px){
    .main{flex-wrap:wrap}
    .rail{flex:1 1 100%;width:auto;max-height:118px;border-right:none;border-bottom:1px solid var(--line)}
    .plist{display:flex;gap:5px;overflow-x:auto;padding:7px}
    .pitem{flex:0 0 156px;margin-bottom:0}
    .vcol{flex:0 0 186px;width:186px}
    .side{flex:1 1 100%;width:auto;max-height:44vh;border-left:none;border-top:1px solid var(--line)}
    /* en pantalla estrecha la fila de transporte no cabe en una linea: que baje
       en vez de desbordar y dejar botones fuera del encuadre */
    .tp-row{flex-wrap:wrap;row-gap:6px}
  }
</style>

<svg class="sprite" viewBox="0 0 24 24" aria-hidden="true">

    <g id="i-mkprev"><polyline points="14 18 8 12 14 6"/><path d="M19 5v14"/></g>

           marcadores (arriba) · pista de progreso (medio) · regleta del video entero
