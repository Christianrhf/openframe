/* ── ATajos: una sola tabla, un solo dueñо por tecla ──
   Antes habia DOS cadenas if en paralelo comparando contra la misma tecla, asi que
   Shift+N saltaba AL MISMO TIEMPO al siguiente cambio y a la siguiente nota, y
   Shift+P iba al cambio anterior Y activaba el lapiz. Una tecla, un dueñо. */
const ATAJOS = {
  // transporte
  " ":              () => v.paused ? play() : pause(),
  "ArrowLeft":      e => e.shiftKey ? stepS(-1) : stepF(-1),
  "ArrowRight":     e => e.shiftKey ? stepS( 1) : stepF( 1),
  "Backspace":      () => eraseFrame(),
  // timeline (el ancla 50 = el centro de la ventana se queda quieto)
  "+":              () => tlZoom(TL_ZOOM_PASO, 50),
  "=":              () => tlZoom(TL_ZOOM_PASO, 50),
  "-":              () => tlZoom(1/TL_ZOOM_PASO, 50),
  "_":              () => tlZoom(1/TL_ZOOM_PASO, 50),
  "0":              () => tlReset(),
  "]":              () => tlIrANota(1),
  "[":              () => tlIrANota(-1),
  // Shift+N / Shift+P recorren SOLO los cambios de Agente: el flujo de revision
  // sin ver el video entero. Mayusculas = cambios, minusculas = notas.
  "N":              () => irACambio(1),
  "P":              () => irACambio(-1),
  "n":              () => jumpNote(1),
  "p":              () => jumpNote(-1),
  // dibujo (minusculas y mayusculas, sin shift = misma herramienta)
  "f":              () => $('[data-tool=arrow]').click(),
  "F":              () => $('[data-tool=arrow]').click(),
  "r":              () => $('[data-tool=rect]').click(),
  "R":              () => $('[data-tool=rect]').click(),
  "c":              () => $("#swBtn").click(),
  "C":              () => $("#swBtn").click(),
  // nota
  "e":              () => { ensurePend(); $("#ta").focus(); },
  "E":              () => { ensurePend(); $("#ta").focus(); },
  "s":              () => saveNote(),
  "S":              () => saveNote(),
};
// el lapiz es la herramienta por defecto: "p" minúscula era ambiguo, asi que va en "b"
ATAJOS["b"] = () => $('[data-tool=pen]').click();
ATAJOS["B"] = () => $('[data-tool=pen]').click();
delete ATAJOS["p"];   // "p" minúscula = nota anterior (jumpNote). El lapiz es "b".

document.addEventListener("keydown", e => {
  if($("#modal").classList.contains("on")){ if(e.key==="Escape") closeModal(); return; }
  if($("#invDlg").classList.contains("on")) return;     // sin nombre no hay atajos (ni Escape)
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="textarea"||tag==="input"||tag==="select") return;
  if(!st.vid) return;
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase() === "z"){
    e.preventDefault();
    e.shiftKey ? rehacer() : deshacer();
    return;
  }
  if(e.altKey || e.metaKey || e.ctrlKey) return;
  const fn = ATAJOS[e.key];
  if(!fn) return;
  e.preventDefault();
  fn(e);
});


/* saltar a la nota anterior/siguiente (orden del video actual) */
function jumpNote(dir){
  if(!st.vid) return;
  const list = visibleNotes().filter(n => n.video === st.vid);
  if(!list.length) return;
  const cur = st.pend ? st.pend.frame : -1;
  let target = null;
  if(dir > 0){
    target = list.find(n => n.frame > cur) || list[0];       //: vuelve a la primera
  }else{
    const prev = list.filter(n => n.frame < cur);
    target = prev.length ? prev[prev.length-1] : list[list.length-1];
  }
  if(!target) return;
  st.selId = target.id;
  st.pend = {frame:target.frame, time:target.frame/fps};
  seek(target.frame/fps);
  editingId = null; $("#ta").value = ""; setDirty(false);
  drawCanvas(); renderList(); updateEditor(); updateMarks();
  const el = $("#list").querySelector(".note[data-id=\""+target.id+"\"]");
  if(el) el.scrollIntoView({block:"nearest"});
  toast("f"+target.frame+" · "+target.timecode, 1200);
}

/* scrub */
const scrub = $("#scrub");
let sdrag = false;
function scrubTo(e){ const r = scrub.getBoundingClientRect();
  // con zoom, el ancho de la barra es solo una ventana: hay que pasar por tlTime()
  const pct = clamp((e.clientX-r.left)/r.width,0,1)*100;
  seek(tlTime(pct)); }
scrub.addEventListener("pointerdown", e => {
  /* Arrastrar un MARCADOR no es arrastrar la barra. Los dos gestos estaban
     enganchados al mismo pointerdown de #scrub: el de arrastrar la nota hacia
     stopPropagation(), que no detiene a los demas oyentes del MISMO elemento, asi
     que cada pointermove llamaba a dos seek() con cuentas distintas. Decidir aqui,
     mirando el objetivo, no depende del orden en que se registraron los oyentes. */
  if(e.target.closest && e.target.closest(".mark")) return;
  sdrag=true; scrub.setPointerCapture(e.pointerId); scrubTo(e);
});
scrub.addEventListener("pointermove", e => { if(sdrag) scrubTo(e); });
scrub.addEventListener("pointerup", () => sdrag=false);
scrub.addEventListener("pointercancel", () => sdrag=false);

/* ═══ UI ═══ */
function updateUI(){
  if(!st.vid) return;
  const ct = v.currentTime, f = snap(ct);
  $("#tcTC").textContent = tc(ct, f);
  // el fotograma actual se fija ANTES de colocar el cursor: tlNowT() lo lee
  let cambioNota = false;
  if(f !== st.playhead){
    st.playhead = f;
    // no repintar toda la lista por cada frame: solo si la nota resaltada cambia
    const bajoAntes = st.phNote;
    st.phNote = (notesAt(st.vid, f).map(n => n.id).join(","));
    cambioNota = st.phNote !== bajoAntes;
  }
  /* EL BUG DEL CURSOR QUE SALTABA: aqui se escribia
         $("#fill").style.width = (ct/duracion)*100 + "%"
     es decir coordenada ABSOLUTA del video entero, mientras tlPaint() escribia la
     misma propiedad en coordenada de la VENTANA visible (tlPct). Con zoom, cada
     `timeupdate` (4 veces por segundo) devolvia el cursor al sistema absoluto y el
     siguiente pintado lo traia de vuelta: el cursor parpadeaba entre dos sitios.
     Ahora hay UN solo sistema — la ventana — y un solo escritor por caso:
     tlHead() si la ventana no se mueve, tlPaint() si hay que recolocarla. */
  const off0 = st.tl.off;
  tlFollow();
  if(st.tl.off !== off0) tlPaint(); else tlHead();
  if(cambioNota){ renderList(); scrollToPlayhead(); }
}
// lleva a la vista la nota que esta bajo el cursor, sin mover la pagina entera
function scrollToPlayhead(){
  if(v.paused) return;              // solo al reproducir: al pausar no queremos saltos
  const L = $("#list");
  const el = L.querySelector(".note.ph");
  if(!el) return;
  const lb = L.getBoundingClientRect(), eb = el.getBoundingClientRect();
  if(eb.top < lb.top + 4 || eb.bottom > lb.bottom - 4){
    L.scrollTop += (eb.top - lb.top) - (lb.height / 2) + (eb.height / 2);
  }
}

/* tlPaint / tlHead / tlFollow / updateMarks viven ahora en la seccion
   «LINEA DE TIEMPO» (mas abajo, todo junto). Aqui no queda nada del timeline:
   antes el pintado estaba partido en tres sitios del archivo y dos de ellos
   escribian las MISMAS propiedades con coordenadas distintas. */


/* ── indice del vecino anterior / siguiente ──
   Las DOS cuentas de recorrido estaban mal, cada una a su manera:
   · "nota anterior" hacia `vis.indexOf(antes[antes.length-1]) - 1`, o sea se saltaba
     una nota: desde la nota 5 se iba a la 3.
   · "cambio anterior" hacia `cs.indexOf(antes[...]) + 1`, que es el cambio SIGUIENTE:
     Shift+P devolvia al mismo sitio y parecia que no hacia nada.
   Una sola funcion, probada contra los dos extremos, y da la vuelta al llegar al fin. */
function idxVecino(lista, t, dir){
  if(!lista.length) return -1;
  if(dir > 0){
    const i = lista.findIndex(n => n.frame/fps > t);
    return i >= 0 ? i : 0;                     // no hay nada mas adelante: al primero
  }
  for(let i = lista.length - 1; i >= 0; i--) if(lista[i].frame/fps < t) return i;
  return lista.length - 1;                     // no hay nada antes: al ultimo
}

/* ── "ir a nota": salta a la nota siguiente y la deja AGARRABLE ──
   El problema real no es que no se pueda zoomear: es que hay que saber DONDE esta la
   nota. Este boton te lleva a la siguiente (no a la mas cercana cualquiera) y calcula
   el zoom justo para que si hay otra pegada a 1-2 frames, ambas se puedan agarrar. */
function tlIrANota(direccion){
  const vis = st.notas.filter(n => n.video === st.vid)
                    .sort((a,b) => a.frame - b.frame);
  if(!vis.length){ toast("Este video no tiene notas"); return; }
  const dir = direccion === -1 ? -1 : 1;
  const t = v.currentTime + (dir > 0 ? 0.001 : -0.001);
  const idx = idxVecino(vis, t, dir);
  const mejor = vis[idx];
  if(!mejor) return;

  const dur = tlDur();
  if(!dur) return;
  const anchoPx = tlAnchoPx();

  // la nota pegada mas cercana (para decidir el zoom)
  let gap = 0;
  for(const n of vis){
    if(n.id === mejor.id) continue;
    const g = Math.abs(n.frame - mejor.frame);
    if(g < fps * 2 && (gap === 0 || g < gap)) gap = g;
  }
  let framesVisibles;
  if(gap > 0){
    // que el hueco entre las dos notas mida al menos TL_GRAB_PX*3 pixeles en pantalla
    framesVisibles = anchoPx * gap / (TL_GRAB_PX * 3);
  }else{
    framesVisibles = 6 * fps;             // sola: 6 s de contexto
  }
  framesVisibles = clamp(framesVisibles, 8, dur * fps);
  const span = framesVisibles / fps;

  tlSetView(dur / span, mejor.frame/fps - span/2);

  st.selId = mejor.id;
  st.pend = {frame:mejor.frame, time:mejor.frame/fps};
  seek(mejor.frame/fps);
  $("#ta").value = mejor.text || "";
  tlPaint();
  drawCanvas(); renderList(); updateEditor();
  toast("Nota " + (idx+1) + "/" + vis.length + " · " + mejor.timecode +
        (gap > 0 ? "  ·  pegada, vista a " + Math.round(st.tl.zoom) + "×" : ""), 2400);
}

/* ── zoom del timeline: botones y atajos ── */

/* ── Saltar entre CAMBIOS ──
   Shift+N / Shift+P recorren solo los puntos donde Agente toco algo.
   Es lo que sirve para revisar un corte sin ver los 16 minutos:
   saltas de cambio en cambio y revisas. */
function soloCambios(){
  return st.notas.filter(n => n.video === st.vid && n.kind === "cambio")
                 .sort((a,b) => a.frame - b.frame);
}
function irACambio(dir){
  if(esInvitado) return;                 // los cambios de Agente son flujo de Cristian
  const cs = soloCambios();
  if(!cs.length){ toast("Este video no tiene cambios marcados"); return; }
  const t = v.currentTime + (dir > 0 ? 0.001 : -0.001);
  const idx = idxVecino(cs, t, dir);
  const c = cs[idx];
  if(!c) return;
  // el cambio queda CENTRADO en la ventana, con el zoom que ya tenia el usuario.
  // Antes se escribia off = frame/fps - 1.5 recortado contra `dur - 3`, un limite
  // que no tiene nada que ver con el ancho de la ventana: con zoom alto la ventana
  // acababa en un sitio y el cambio en otro.
  // marcar cual es el cambio actual: el carril lo rodea con el anillo .sel y asi se
  // ve por donde va la revision. Antes Shift+N movia el cursor sin dejar rastro.
  st.selId = c.id;
  st.pend = {frame:c.frame, time:c.frame/fps};
  marcarCambioVisto(c);           // aterrizar aqui = ya lo miraste
  tlCenter(c.frame/fps);          // centra la ventana ANTES de mover el cursor
  seek(c.frame/fps);
  drawCanvas(); renderList(); updateEditor();
  toast("Cambio " + (idx+1) + "/" + cs.length + " · " + c.timecode, 2400);
}
$("#tlChg").onclick = () => {
  const cs = soloCambios();
  if(!cs.length){ toast("Este video no tiene cambios marcados"); return; }
  irACambio(1);
};


/* ── Plegar / desplegar los paneles de proyectos y tomas ──
   Cristian: "quizas las columnas proyectos y tomas se pueda minimizar para ocupar
   menos espacio". Plegadas quedan en un asa de 30px que conserva lo accionable:
   cuantas notas tiene el proyecto y si hay cambios de Agente sin revisar.
   La decision se recuerda entre sesiones. */
const NAV_KEY = "openframe:nav";
function navPlegado(){ return document.body.classList.contains("nav-plegado"); }
function plegarNav(v){
  const plegar = (v === undefined) ? !navPlegado() : v;
  document.body.classList.toggle("nav-plegado", plegar);
  try{ localStorage.setItem(NAV_KEY, plegar ? "plegado" : "abierto"); }catch(e){}
  if(!plegar && st.vid){ requestAnimationFrame(() => { fit(); tlPaint(); pintarRail(); }); }
}
function actualizarAsaNav(){
  /* Las notas cuentan con la regla comun; los cambios son los SIN VER, no todos:
     antes el contador se quedaba en 37 para siempre porque un cambio nunca pasaba
     a "visto", asi que el asa decia "37 sin revisar" ya con todo revisado. */
  const notas = pendientesDe();
  const chg = cambiosSinVer();
  const totalChg = st.notas.filter(n => n.kind === "cambio").length;
  const a = $("#navNotas"), b = $("#navChg");
  if(a){ a.textContent = notas; a.title = notas + (notas===1 ? " nota pendiente" : " notas pendientes"); }
  if(b){ b.textContent = chg; b.title = chg + (chg===1 ? " cambio sin ver" : " cambios sin ver")
           + (chg < totalChg ? " (de " + totalChg + ")" : "");
         b.style.display = chg ? "" : "none"; }
}
$("#bNavFold").onclick = () => plegarNav(true);
$("#navOpen").onclick  = () => plegarNav(false);
try{ if(localStorage.getItem(NAV_KEY) === "plegado") document.body.classList.add("nav-plegado"); }catch(e){}

/* ── CARRIL NAVEGADOR: coordenada pura frame/duracionTotal ──
   Los .mark del scrub se mueven con el zoom (tlPct depende de la ventana). Este carril
   NO: usa frame/duracionTotal, que no depende de nada. Navegar o hacer zoom aqui no
   altera ni un pixel de un marcador. Clic = saltar ahi y ver el fotograma exacto. */
let _railSig = null;    // firma de lo ultimo pintado en el carril
function pintarRail(){
  const rail = $("#tlrail");
  if(!rail) return;
  const m = vmeta();
  const dur = m ? (m.duracion || vdur || 0) : 0;
  if(!dur){
    // sin video (o sin duracion todavia) el carril se VACIA. Antes se volvia sin
    // tocar nada y quedaban los marcadores del video anterior.
    if(_railSig !== ""){ _railSig = ""; $$(".rnote", rail).forEach(e => e.remove()); }
    const l0 = $("#rlLbl"); if(l0) l0.textContent = "";
    return;
  }
  const totalFrames = Math.max(1, Math.round(dur * fps));
  const cambios = st.notas.filter(n => n.video === st.vid && n.kind === "cambio");
  const notas   = st.notas.filter(n => n.video === st.vid && n.kind !== "cambio");
  /* El carril NO depende del zoom, pero se reconstruia entero en cada updateMarks()
     — y updateMarks() corre desde updateEditor(), que tiene un setInterval de 500 ms.
     O sea: cientos de nodos creados y destruidos dos veces por segundo mientras el
     video se reproduce, perdiendo el foco del teclado y cortando los tooltips.
     Con la firma solo se repinta cuando cambia algo que el carril muestra. */
  const sig = [st.vid, st.selId, fps, totalFrames,
               [...notas, ...cambios].map(n => n.id + ":" + n.frame + ":" +
                 (n.resolved ? 1 : 0) + ":" + n.kind + ":" + n.author).join("|")].join("#");
  if(sig === _railSig) return;
  _railSig = sig;
  $$(".rnote", rail).forEach(e => e.remove());
  // notas primero (abajo), cambios encima (arriba): los cambios son lo que se revisa
  {
    for(const n of [...notas, ...cambios]){
      const e = document.createElement("div");
      const q = quienEs(n);
      e.className = "rnote" + (n.kind === "cambio" ? " cambio" : "") + (n.resolved ? " done" : "") + (q === "invitado" ? " inv" : "");
      e.style.left = clamp(n.frame / totalFrames * 100, 0, 100) + "%";     // <-- coordenada pura
      e.style.setProperty("--own", q === "claude" ? "var(--claude)" : q === "invitado" ? "var(--invitado)" : "var(--yo)");
      if(n.id === st.selId) e.classList.add("sel");
      e.dataset.nid = n.id;
      e.tabIndex = 0;
      e.setAttribute("role", "button");
      const et = n.kind === "cambio" ? "Cambio de Agente" : nombreAutor(n);
      e.setAttribute("aria-label", et + " en " + n.timecode);
      e.title = et + " · " + n.timecode + " · f" + n.frame + (n.kind === "cambio" ? "" : "\n" + (n.text||"").slice(0,70));
      e.onclick = ev => { ev.stopPropagation(); saltarANota(n.id); };
      e.onkeydown = ev => { if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); saltarANota(n.id); } };
      rail.appendChild(e);
    }
  }
  const lbl = $("#rlLbl");
  if(lbl) lbl.textContent = cambios.length
    ? (cambios.length + (cambios.length === 1 ? " cambio" : " cambios"))
    : (notas.length + " notas");
}
/* Clic en un marcador: saltar ahi y dejar el fotograma a la vista, con su drawing. */
async function saltarANota(id){
  const n = st.notas.find(x => x.id === id); if(!n) return;
  if(n.video !== st.vid) openVideo(n.video);
  st.selId = n.id;
  st.pend = {frame:n.frame, time:n.frame/fps};
  editingId = null;
  seek(n.frame/fps);
  $("#ta").value = (n.kind === "cambio") ? "" : (n.text||"");
  setDirty(false);
  pintarRail(); drawCanvas(); renderList(); updateMarks(); updateEditor(); updateUI();
  if(n.kind !== "cambio") toast("Nota de " + n.timecode + " · f" + n.frame, 2200);
  else toast("Cambio en " + n.timecode + " · f" + n.frame, 2200);
}

/* Clic en el FONDO del carril = ir a ese punto del video COMPLETO.
   Faltaba la otra mitad del zoom: con la barra de abajo acercada, el scrub solo
   cubre la ventana visible, asi que no habia manera de llegar al resto del video
   sin alejar primero. El carril es el mapa — y un mapa se usa pinchandolo. */
(function(){
  const rail = $("#tlrail");
  if(!rail) return;
  rail.addEventListener("pointerdown", ev => {
    if(ev.target.closest && ev.target.closest(".rnote")) return;   // manda el marcador
    if(!st.vid) return;
    const r = rail.getBoundingClientRect();
    if(!r.width) return;
    const t = clamp((ev.clientX - r.left) / r.width, 0, 1) * tlDur();
    tlCenter(t);   // conserva el zoom y centra la ventana ahi; luego el cursor
    seek(t);       // (en este orden tlFollow() ya lo encuentra dentro y no repinta)
  });
})();

/* ── deshacer: ⌘Z (o Ctrl+Z) y el boton ── */
$("#bUndoAccion").onclick = () => deshacer();
$("#bRedoAccion").onclick = () => rehacer();
actualizarBotonUndo();
/* OJO con los nombres heredados: #tlZout es el boton [+] (ACERCAR) y #tlZin es
   el [−] (ALEJAR). Los ids estan al reves de lo que hacen; se conservan porque
   los usa el CSS y los tooltips, pero el ancla 50 = centro de la ventana. */
$("#tlZout").onclick = () => tlZoom(TL_ZOOM_PASO, 50);      // [+] acercar
$("#tlZin").onclick  = () => tlZoom(1/TL_ZOOM_PASO, 50);    // [−] alejar
$("#tlZfit").onclick = () => tlReset();
$("#tlNear").onclick = () => tlIrANota(1);
$("#tlPrev").onclick = () => tlIrANota(-1);

/* ═══════════════════════════════════════════════════════════════════════════
   LINEA DE TIEMPO — modelo temporal, pintado y marcadores, TODO en un sitio
   ═══════════════════════════════════════════════════════════════════════════

   EL DEFECTO DE RAIZ que arregla esta seccion: el zoom estaba acoplado a la
   GEOMETRIA de la barra, no al tiempo. En concreto, tres acoplamientos:

   1. `tlSeg()` era un getter que MUTABA `st.tl.off` (lo recortaba). Lo llamaban
      tlPct, tlTime, tlFollow y pos2frame, o sea se llamaba desde dentro de los
      pintados y desde los manejadores de eventos. El resultado de preguntar
      "¿donde va este marcador?" dependia de cuantas veces se habia preguntado antes.

   2. `updateMarks()` escribia `host.style.minHeight` con la altura de la pila de
      marcadores apilados. Y `tlPct()` recortaba a 0 % / 100 % todo lo que caia
      FUERA de la ventana, asi que al acercar, casi todas las notas del video se
      apilaban en los dos extremos: la pila llegaba a N-1 filas y la barra crecia
      200 px. Al crecer la barra crecia el transporte, se encogia la pantalla del
      video, el ResizeObserver disparaba fit() y se re-rasterizaba el lienzo.
      ESO era «si acerco el timeline se descuadra la pantalla y se vuelve un desastre».

   3. El ancla del zoom se recalculaba DESPUES de recortar el offset nuevo
      (`rel = (antes - s.ini)/(s.fin - s.ini)`), no con la fraccion pedida, asi que
      el punto bajo el cursor se iba desplazando en cada paso de rueda.

   EL MODELO AHORA: la ventana visible es un dato puro — un instante de inicio y una
   duracion, en SEGUNDOS. Nadie mide el DOM para decidir una posicion, ningun pintado
   cambia el tamano de una caja (el alto de la barra es fijo, en CSS), y solo una
   funcion escribe `st.tl`. La geometria se obtiene del modelo, nunca al contrario.   */

const TL_ZOOM_MIN = 1, TL_ZOOM_MAX = 20000;
const TL_ZOOM_PASO = 2.4;      // un clic de boton
const TL_ZOOM_RUEDA = 1.5;     // un paso de rueda
const TL_LANES = 2;            // filas de marcadores que CABEN en el alto fijo de la barra
const TL_GRAB_PX = 13;         // dos marcadores a menos de esto se estorban: suben de fila
const TL_FOLLOW_EDGE = 0.12;   // margen en el que el cursor arrastra la ventana
const TL_ANCHO_FALLBACK = 480; // ancho de la barra si aun no esta en pantalla

/* ── 1. El modelo (puro: lee st.tl, no lo escribe) ── */

function tlDur(){
  const m = vmeta();
  return ((m ? (m.duracion || vdur) : vdur) || 0) || 1;
}
function tlSpan(){
  // el piso es 1 fotograma visible: mas alla no tiene sentido ni se puede
  return clamp(tlDur() / st.tl.zoom, 1/Math.max(1, fps), tlDur());
}
function tlSeg(){                            // {ini, fin, span, dur} — sin efectos
  const span = tlSpan(), dur = tlDur();
  const ini = clamp(st.tl.off, 0, Math.max(0, dur - span));
  return {ini:ini, fin:ini + span, span:span, dur:dur};
}
function tlFrac(t){ const s = tlSeg(); return (t - s.ini) / s.span; }   // 0..1, SIN recortar
function tlPct(t){ return clamp(tlFrac(t), 0, 1) * 100; }               // para pintar
function tlVisible(t){ const f = tlFrac(t); return f >= -0.001 && f <= 1.001; }
function tlTime(pct){ const s = tlSeg(); return s.ini + (pct/100) * s.span; }

/* ── 2. El UNICO escritor de st.tl ── */
function tlSetView(zoom, off){
  st.tl.zoom = clamp(+zoom || 1, TL_ZOOM_MIN, TL_ZOOM_MAX);
  const span = tlSpan();                     // ya con el zoom nuevo
  st.tl.off = clamp(+off || 0, 0, Math.max(0, tlDur() - span));
}

/* ── 3. Gestos de zoom ──
   `ancla` es la fraccion de la barra que debe quedarse quieta (0 = izquierda,
   1 = derecha). Se conserva exactamente: es el dato que pide el gesto, no algo
   que haya que deducir de la geometria despues de mover la ventana. */
function tlZoom(factor, anclaPct){
  const a = clamp((anclaPct == null ? 50 : anclaPct) / 100, 0, 1);
  const tAncla = tlTime(a * 100);            // el instante bajo el cursor, ANTES
  st.tl.zoom = clamp(st.tl.zoom * factor, TL_ZOOM_MIN, TL_ZOOM_MAX);
  tlSetView(st.tl.zoom, tAncla - a * tlSpan());   // y ahi se queda
  tlPaint();
}
function tlReset(){ tlSetView(1, 0); tlPaint(); }
function tlCenter(t){ tlSetView(st.tl.zoom, t - tlSpan()/2); tlPaint(); }

/* ── 4. Seguimiento del cursor: ajusta el MODELO, no pinta ──
   Antes tlFollow() llamaba a tlPaintSinFollow(), que repintaba y volvia a crear
   todos los marcadores: cada tlPaint() acababa pintando dos veces. */
function tlNowT(){
  // tras un seek, v.currentTime puede ir un instante por detras del fotograma real
  const phT = (st.playhead != null && st.playhead >= 0) ? st.playhead / fps : null;
  return (phT != null && Math.abs(phT - v.currentTime) > 0.05) ? phT : v.currentTime;
}
/* mientras el usuario arrastra (la barra o un marcador) la ventana NO se mueve sola:
   si se recentrara a mitad del gesto, el instante que hay bajo el dedo cambiaria y
   arrastrar hacia el borde se volveria una fuga — cada salto reposiciona el puntero
   y el siguiente movimiento vuelve a saltar. */
function tlCongelado(){ return sdrag || drag != null; }
function tlFollow(){
  if(tlCongelado()) return;
  if(st.tl.zoom <= 1.02){ tlSetView(1, 0); return; }   // video entero: nada que seguir
  const s = tlSeg(), t = tlNowT();
  const m = s.span * TL_FOLLOW_EDGE;
  if(t >= s.ini + m && t <= s.fin - m) return;         // comodo donde esta: no mover
  tlSetView(st.tl.zoom, t - s.span/2);
}

/* ── 5. Pintado. Dos entradas y nada mas:
       tlHead()  — solo mueve el cursor (lo barato, 4 veces por segundo al reproducir)
       tlPaint() — recoloca la ventana entera (al hacer zoom, saltar o cambiar notas) */
function tlAnchoPx(){
  const s = $("#scrub");
  return (s && s.clientWidth) || TL_ANCHO_FALLBACK;
}
function tlHead(){
  if(!st.vid) return;
  const p = tlPct(tlNowT()) + "%";
  $("#fill").style.width = p;
  $("#head").style.left  = p;
}
function tlEtiqueta(s){
  if(st.tl.zoom <= 1.02) return "todo el video";
  // fotogramas visibles: dato del modelo. Antes aqui se media #scrub.clientWidth
  // DESPUES de que updateMarks() hubiera tocado el DOM (lectura forzada de layout),
  // y la cuenta (`dur / fps / span * ancho`) mezclaba segundos con fotogramas:
  // el "N f/pixel" que salia no era ninguna magnitud real.
  const fr = Math.max(1, Math.round(s.span * fps));
  // corto a proposito: #tlInfo tiene ANCHO FIJO en el CSS. Si el texto hiciera crecer
  // su caja, la fila de transporte se recolocaria en cada paso de zoom — el mismo
  // tipo de descuadre que este arreglo elimina, por la puerta de atras.
  return tc(null, Math.round(s.ini * fps)) + " – " + tc(null, Math.round(s.fin * fps)) +
         "  ·  " + Math.round(st.tl.zoom) + "×  ·  " + fr + " f";
}
/* tlPaint() DIBUJA el modelo y nada mas: no decide la ventana.
   Antes terminaba con tlFollow(true), que podia recolocar la ventana recien elegida
   y repintar otra vez. Resultado visible: acercabas con la rueda sobre un punto
   alejado del cursor de reproduccion y la vista se escapaba de vuelta al cursor —
   literalmente «si acerco… todo se mueve». Quien sigue al cursor es updateUI(),
   que es donde el cursor se mueve de verdad. */
function tlPaint(){
  if(!st.vid) return;
  const s = tlSeg();
  tlHead();
  const lbl = $("#tlInfo");
  if(lbl){
    const txt = tlEtiqueta(s);
    lbl.textContent = txt;
    lbl.title = txt;        // la caja es de ancho fijo: el texto completo, al pasar
  }
  tlPintarVentana(s);
  updateMarks();
}
/* el rectangulo del carril que dice QUE trozo del video es la barra de abajo */
function tlPintarVentana(s){
  const w = $("#tlWin");
  if(!w) return;
  const on = st.tl.zoom > 1.02 && s.dur > 0;
  w.classList.toggle("on", on);
  if(!on) return;
  w.style.left  = (clamp(s.ini / s.dur, 0, 1) * 100) + "%";
  w.style.width = (clamp(s.span / s.dur, 0, 1) * 100) + "%";
}

/* ── MOVER ARRASTRANDO el marcador sobre la barra ──
   Esto es lo que faltaba: adivinar un numero de fotograma es una odisea. Con esto,
   agarras la nota en la barra y la dejas donde quieres. Sola operacion, sin adivinar.
   El frame sigue siendo el dato real por debajo, pero TUNO nunca lo escribe a mano. */
let drag = null;
(function(){
  const scrub = $("#scrub"), head = $("#head");
  if(!scrub || !head) return;
  const pos2frame = ev => {
    const r = scrub.getBoundingClientRect();
    const p = clamp((ev.clientX - r.left) / r.width, 0, 1);
    const s = tlSeg();
    const t = s.ini + p * (s.fin - s.ini);
    const d = s.dur;
    return clamp(Math.round(t * fps), 0, Math.max(0, Math.round(d * fps)));
  };
  // rueda del raton = acercar/alejar, anclado donde esta el puntero (como un editor normal)
  scrub.addEventListener("wheel", ev => {
    ev.preventDefault();
    const r = scrub.getBoundingClientRect();
    const pct = clamp((ev.clientX - r.left) / r.width, 0, 1) * 100;
    tlZoom(ev.deltaY < 0 ? TL_ZOOM_RUEDA : 1/TL_ZOOM_RUEDA, pct);
  }, {passive:false});
  scrub.addEventListener("pointerdown", ev => {
    const mk = ev.target.closest(".mark");
    if(!mk) return;                       // en la barra vacia: scrub normal
    ev.stopPropagation(); ev.preventDefault();
    const n = st.notas.find(x => x.id === mk.dataset.nid);
    if(!n) return;
    drag = {id:n.id, nota:n, el:mk, desde:pos2frame(ev), movido:false};
    scrub.setPointerCapture(ev.pointerId);
    document.body.style.cursor = "grabbing";
  });
  scrub.addEventListener("pointermove", ev => {
    if(!drag) return;
    const f = pos2frame(ev);
    if(f !== drag.desde) drag.movido = true;
    drag.f = f;
    // previsualizar: el cursor del video va detras del raton
    seek(f / fps);
    st.pend = {frame:f, time:f / fps};
    const pct = tlPct(f / fps) + "%";
    head.style.left = pct;
    $("#fill").style.width = pct;
    // el marcador agarrado se mueve con el dedo. Antes se quedaba clavado en su
    // sitio original mientras el cursor viajaba: parecia que el arrastre no cogia.
    if(drag.el) drag.el.style.left = pct;
    updateEditor();
  });
  const soltar = async ev => {
    if(!drag) return;
    const d2 = drag; drag = null;
    document.body.style.cursor = "";
    const f = d2.f != null ? d2.f : d2.desde;
    // en TODAS las salidas sin cambio hay que repintar: el marcador se arrastro en
    // pantalla (style.left) y si no se reconstruye se queda donde lo soltaste,
    // mintiendo sobre el fotograma de la nota.
    if(!d2.movido || f === d2.nota.frame){
      drawCanvas(); updateMarks(); return;    // fue un clic, no un arrastre
    }
    const dup = noteAt(st.vid, f);
    if(dup && dup.id !== d2.id){
      toast("Ya hay otra nota ahí — muévela o bórrala primero");
      drawCanvas(); renderList(); updateMarks(); return;
    }
    const viejo = d2.nota.frame;
    await withBusyNote(async () => {
      d2.nota.frame = f;
      try{
        const antesArr = snapNota(d2.nota);
        await api(P(st.slug) + "/notas/" + d2.id, {method:"PATCH", body: JSON.stringify({frame:f})});
        pushUndo("mover nota a " + tc(null,f), {tipo:"campo", antes:antesArr, despues:snapNota(d2.nota), cambios:["frame"]});
        st.pend = {frame:f, time:f / fps};
        seek(f / fps);
        await pullDetail();
        drawCanvas(); renderList(); updateMarks(); updateEditor();
        toast("Movida de " + tc(null, viejo) + " a " + tc(null, f), 2600);
      }catch(e){
        d2.nota.frame = viejo;
        toast("No se pudo mover: " + e.message, 4000);
        drawCanvas(); renderList(); updateMarks();
      }
    });
  };
  scrub.addEventListener("pointerup", soltar);
  scrub.addEventListener("pointercancel", soltar);
})();

/* ── 6. Marcadores agarrables de la barra ──
   Tres reglas, y las tres son el arreglo del bug:
   a) Solo se crean los marcadores que caen DENTRO de la ventana. Antes se creaban
      todos y los de fuera se recortaban a 0 % / 100 % con tlPct(), asi que al
      acercar se apilaban decenas de notas en los dos extremos.
   b) La colision se mide en PIXELES reales (TL_GRAB_PX), no en "0.6 % del ancho".
      Un umbral en % cambia de significado con el zoom y con el ancho de la ventana;
      lo que importa es si caben dos dedos, y eso son pixeles.
   c) El numero de filas esta ACOTADO (TL_LANES) y aqui no se escribe ningun tamano.
      La pila ya no puede empujar la barra, el transporte ni la pantalla del video.
      La geometria de cada fila la pone el CSS, leyendo la variable --fila. */
function updateMarks(){
  const host = $("#head").parentElement;
  // el ancho se mide ANTES de tocar el DOM: medir despues de pintar fuerza al
  // navegador a recalcular el layout a mitad del pintado
  const anchoPx = (host && host.clientWidth) || TL_ANCHO_FALLBACK;
  pintarRail();                       // el carril navegador se actualiza con la barra
  actualizarAsaNav();
  if(!host) return;
  // a mitad de un arrastre NO se reconstruyen: el elemento que el usuario tiene
  // agarrado se destruiria. updateEditor() llama aqui dentro del propio pointermove.
  if(drag) return;
  $$(".mark", host).forEach(e => e.remove());
  if(!vmeta()) return;
  const puestos = [];
  for(const n of st.notas){
    if(n.video !== st.vid) continue;
    const t = n.frame / fps;
    if(!tlVisible(t)) continue;              // fuera de la ventana: no se dibuja
    const frac = clamp(tlFrac(t), 0, 1);
    const px = frac * anchoPx;
    let fila = 0;
    while(fila < TL_LANES - 1 &&
          puestos.some(p => p.fila === fila && Math.abs(p.px - px) < TL_GRAB_PX)) fila++;
    puestos.push({px:px, fila:fila});

    const e = document.createElement("div");
    const q = quienEs(n);
    e.className = "mark" + (n.resolved ? " done" : "") + (n.kind === "cambio" ? " cambio" : "") + (q === "invitado" ? " inv" : "");
    e.style.left = (frac * 100) + "%";
    e.style.setProperty("--fila", String(fila));
    // el marcador hereda el color del autor: mismo mecanismo que la tarjeta
    e.style.setProperty("--own", q === "claude" ? "var(--claude)" : q === "invitado" ? "var(--invitado)" : "var(--yo)");
    e.dataset.nid = n.id;   // para arrastrarlo sobre la barra
    e.dataset.t = t;
    e.title = n.kind === "cambio"
      ? "Cambio de Agente · " + n.timecode + " · clic para ver"
      : nombreAutor(n) + " · " + n.timecode + " — " + (n.text||"");
    e.onclick = ev => { ev.stopPropagation();
      st.pend = {frame:n.frame, time:n.frame/fps}; seek(n.frame/fps);
      if(n.kind === "cambio"){ editingId = null; setDirty(false); }
      $("#ta").value = n.text||""; drawCanvas(); renderList(); updateEditor(); };
    host.appendChild(e);
  }
}
function updateEditor(){
  const enEdicion = editingId ? st.notas.find(x => x.id === editingId) : null;
  const f = snap(v.currentTime);
  $("#edAt").textContent = enEdicion ? enEdicion.timecode : tc(v.currentTime, f);
  $("#edLbl").textContent = enEdicion ? ("editando " + enEdicion.timecode) : ("fotograma " + f);
  const ta = $("#ta");
  /* ── Modo respuesta: el cuadro DEBE_DECIRLO ──
     Cristian: "a veces se buggea y no me deja crear". La causa era que st.replyTo se
     quedaba pegado y Enter respondia al hilo viejo en silencio. Ahora, mientras haya
     un hilo apuntado, el rotulo, el placeholder y el boton lo dicen en grande; y si
     la nota apuntada ya no existe (borrada por el poll), se suelta solo. */
  if(st.replyTo && !st.notas.find(x => x.id === st.replyTo)){ st.replyTo = null; editingId = null; }
  const replying = !!st.replyTo;
  const rNota = replying ? st.notas.find(x => x.id === st.replyTo) : null;
  const lbl = $("#edLbl");
  if(lbl){
    if(replying){
      lbl.textContent = "respondiendo en " + (rNota ? rNota.timecode : "el hilo");
      lbl.classList.add("respondiendo");
    } else {
      lbl.textContent = enEdicion ? ("editando " + enEdicion.timecode) : ("fotograma " + f);
      lbl.classList.remove("respondiendo");
    }
  }
  const ed = $("#edAt");
  if(ed && replying && rNota) ed.textContent = rNota.timecode;
  // invitado con tramo marcado: el cuadro dice de donde a donde va la proxima nota
  if(esInvitado && st.invTramo && !replying && !enEdicion){
    if(ed) ed.textContent = tc(null, st.invTramo.ini) + " → " + tc(null, st.invTramo.fin);
    if(lbl) lbl.textContent = "tramo · " + (st.invTramo.fin - st.invTramo.ini + 1) + " f";
  }
  ta.placeholder = replying
    ? "Escribe tu respuesta al hilo…  Enter envía al hilo, no crea otra nota"
    : "Escribe la nota y pulsa Enter para enviarla. Shift+Enter = nueva linea.";
  const bc = $("#bCancel");
  if(bc) bc.style.display = (replying || editingId) ? "" : "none";
  const bs2 = $("#bSave");
  if(bs2) bs2.title = replying
    ? "Enviar la respuesta al hilo de " + (rNota ? rNota.timecode : "arriba")
    : (enEdicion ? ("Actualizar la nota de " + enEdicion.timecode)
                 : ("Enviar la nota nueva al fotograma " + f));
  // modo chat: el cuadro NUNCA se rellena solo. Solo si hay edicion explicita.
  if(document.activeElement !== ta && !editingId && !replying) ta.value = "";
  const nCursor = curNote();
  $("#bDel").disabled = !nCursor;
  $("#bMove").disabled = !nCursor;
  if(!editingId) $("#bCancel").style.display = "none";
  // el boton Guardar dice a donde va la nota, para no sobrescribir sin querer
  const atajos = "Enter enviar · Shift+Enter nueva linea · N siguiente nota · ⇧N anterior · E editar";
  const bs = $("#bSave");
  if(bs) bs.title = (enEdicion
    ? ("Actualizar la nota de " + enEdicion.timecode)
    : ("Enviar la nota nueva al fotograma " + f)) + "\n" + atajos;
  if(bs) bs.dataset.tipLong = atajos;
  if(st.adjustTo){
    const c = st.notas.find(n => n.id === st.adjustTo);
    $(".editor").classList.add("adjusting");
    ta.placeholder = "Qué ajuste le pides al Agente sobre " + (c ? x2Numero(c) : "este cambio") + "…";
    if(lbl) lbl.textContent = "pidiendo ajuste en " + (c ? x2Numero(c) : "el cambio");
    if(bc) bc.style.display = "";
    if(bs) bs.title = "Enviar el ajuste al Agente";
  }
  updateMarks();
}

function payloadAll(){
  const p = pro();
  const notes = st.notas.slice().sort(cmpNotas)
    .map(n => {
      const o = {video:n.video, frame:n.frame, timecode:n.timecode, time:n.time,
                 end_frame:n.end_frame!=null?n.end_frame:null,
                 end_timecode:n.end_timecode||null, text:n.text, resolved:!!n.resolved, author:n.author};
      if(n.fps) o.fps = n.fps;
      if(n.drawing && n.drawing.strokes && n.drawing.strokes.length) o.drawing = n.drawing;
      if(st.thumbs && n.thumb) o.thumbnail_url = "/thumbs/" + st.slug + "/" + n.thumb;
      return o; });
  return { tool:"visor-notas", version:2, exported_at:new Date().toISOString(),
           proyecto:{slug:st.slug, nombre:p?p.nombre:"", cliente:p?p.cliente:"", nota:p?p.nota:""},
           videos:(st.videos||[]).map(x => ({id:x.id, nombre:x.nombre, codec:x.codec,
             duracion:x.duracion, fps:x.fps, ancho:x.ancho, alto:x.alto, bytes:x.bytes})),
           counts:{total:notes.length, pending:notes.filter(n=>!n.resolved).length},
           notes };
}
function asMD(){
  const p = pro(); if(!p) return "";
  const d = payloadAll();
  let s = "# Notas de revisión — " + p.nombre + "\n\n";
  if(p.cliente) s += "Cliente: " + p.cliente + "\n";
  s += "Videos: " + d.videos.length + " · Notas: " + d.counts.total + " (" + d.counts.pending + " pendientes)\n\n";
  const byV = {};
  for(const n of d.notes) (byV[n.video] = byV[n.video] || []).push(n);
  for(const vid of Object.keys(byV)){
    const vm = d.videos.find(x => x.id === vid);
    s += "## " + (vm ? vm.nombre : vid) + (vm && vm.fps ? "  ·  " + vm.fps + " fps · " + vm.duracion.toFixed(2) + " s" : "") + "\n\n";
    for(const n of byV[vid]){
      s += "### " + n.timecode + "  (fotograma " + n.frame + ", " + n.time + " s" +
        (n.end_frame!=null ? " → " + n.end_timecode + ", " + n.end_time + " s" : "") + ")\n";
      s += (n.resolved ? "[resuelto] " : "") + (n.text || "_(nota sin texto)_") + "\n";
      if(n.drawing) s += "_Tiene un dibujo en el fotograma._\n";
      s += "\n";
    }
  }
  return s;
}

  const bl = new Blob([t],{type:ty}); const u = URL.createObjectURL(bl);

function asCSV(){

          n.resolved?"si":"no", n.author||"", n.text].map(q).join(",") + "\n";
  return s;
}

  const nombre = String(i.value || "").replace(/[\u0000-\u001f\u007f]/g, "").trim().slice(0, 40);
  if(!nombre){ err.textContent = "Escribe tu nombre"; i.focus(); return; }
  $("#invDlgOk").disabled = true;
  try{
    const r = await api("/api/invitado/nombre", {method:"POST", body: JSON.stringify({nombre: nombre})});
    INV.nombre = String((r && r.nombre) || nombre).slice(0, 40);
    $("#invDlg").classList.remove("on");
    invPintarBanner(); renderList();
    toast("Hola, " + INV.nombre, 1800);
    $("#ta").focus();
  }catch(e){ err.textContent = "No se pudo guardar el nombre: " + e.message; }
  $("#invDlgOk").disabled = false;
}
$("#invDlgOk").onclick = invEnviarNombre;
$("#invNombre").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); invEnviarNombre(); } });
/* Enlace caducado a mitad de sesion: se avisa claro y se apaga TODA la escritura.
   Lo detectan dos vias: el reloj (INV.expira) y un 404 de la puerta en el sondeo. */
function invMarcarCaducado(){
  if(!esInvitado || invCaducado) return;
  invCaducado = true;
  document.body.classList.add("inv-caducado");
  st.tool = null; $$("[data-tool]").forEach(x => x.classList.remove("on"));
  st.replyTo = null; editingId = null; st.invTramo = null;
  const ta = $("#ta"); ta.value = ""; ta.disabled = true;
  ta.placeholder = "Este enlace caducó: ya no se pueden enviar notas.";
  $("#bSave").disabled = true; $("#bCancel").style.display = "none";
  $("#invDlg").classList.remove("on");
  invPintarBanner(); renderList(); updateEditor();
  toast("Este enlace caducó: ya no se pueden enviar notas", 6000);
}
function invVigilarCaducidad(){
  const t = (INV && INV.expira) ? Date.parse(INV.expira) : NaN;
  if(!isFinite(t)) return;
  const mirar = () => { if(Date.now() >= t) invMarcarCaducado(); };
  mirar(); setInterval(mirar, 5000);
}
/* «fin» del invitado: la puerta no deja PATCH end_frame, asi que el tramo se decide
   ANTES de enviar y viaja en el POST. Inicio = fotograma donde empezo a escribir
   (st.pend) o el cursor; fin = el cursor al pulsar «fin». Se consume al enviar. */
function invMarcarFin(){
  if(!puedeEscribir()){ toast("Este enlace caducó"); return; }
  if(!st.vid) return;
  const f = snap(v.currentTime);
  if(st.invTramo && st.invTramo.fin === f){ st.invTramo = null; toast("Intervalo quitado"); updateEditor(); return; }
  const ini = st.pend ? st.pend.frame : f;
  if(f <= ini){ toast("Mueve el cursor más allá del inicio"); return; }
  st.invTramo = {ini: ini, fin: f};
  st.pend = {frame: ini, time: frameT(ini)};
  toast("La próxima nota va de " + tc(null, ini) + " a " + tc(null, f), 2600);
  updateEditor();
}
async function invArrancar(){
  // un solo proyecto, el del enlace: pro() y absorbDetail() lo encuentran aqui
  st.proyectos = [{slug: INV.slug, nombre: (INV.proyecto && INV.proyecto.nombre) || INV.slug,
                   cliente: (INV.proyecto && INV.proyecto.cliente) || "", videos: 1, notas: 0, pendientes: 0}];
  st.slug = INV.slug; st.filterVid = "";
  document.body.classList.remove("nav-plegado");
  invPintarBanner();
  await pullDetail();
  const pv = (st.videos || []).find(x => x.id === INV.video) || (st.videos || [])[0];
  if(pv) await openVideo(pv.id);
  renderList(); updateEditor(); updateUI();
  invVigilarCaducidad();
  if(!INV.nombre && !invCaducado) invPedirNombre();
}

/* ═══ COMPARTIR (Cristian): un enlace secreto por invitado ═══
   Popover bajo el boton de la cabecera del video. Crear, listar (estado, usos,
   nº de notas), copiar y revocar (confirmacion en el propio boton, sin confirm()).
   Si server.py aun no tiene los endpoints (404), lo dice en una linea y no rompe nada.
   Etiquetas y URLs se pintan con textContent: nada del servidor entra como HTML. */
const SH = {enlaces: [], estado: null, sinEndpoints: false, error: "", cargando: false, confirmar: null, confirmarT: 0, nuevo: null};
const shBtn = $("#bShare"), shPop = $("#shPop");
function shAbierto(){ return !!shPop && !shPop.hidden; }
function shUrl(){ return P(st.slug) + "/videos/" + encodeURIComponent(st.vid) + "/invitar"; }
function shEstadoEnlace(e){
  if(e.revocado) return "revocado";
  const t = Date.parse(e.expira || "");
  return (isFinite(t) && t <= Date.now()) ? "caducado" : "activo";
}
function shEl(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt != null) e.textContent = txt;
  return e;
}
function shColocar(){
  if(!shAbierto() || !shBtn) return;
  const b = shBtn.getBoundingClientRect(), M = 8;
  shPop.style.top = Math.round(b.bottom + 6) + "px";
  const W = shPop.offsetWidth || 396;
  shPop.style.left = Math.round(Math.max(M, Math.min(b.left, innerWidth - W - M))) + "px";
}
function shCerrar(){
  if(!shPop || shPop.hidden) return;
  shPop.hidden = true; shPop.classList.remove("on");
  if(shBtn) shBtn.setAttribute("aria-expanded", "false");
  SH.confirmar = null; SH.nuevo = null;
}
async function shAbrir(){
  if(esInvitado || !shPop) return;
  if(!st.slug || !st.vid){ toast("Abre un video primero"); return; }
  shPop.hidden = false; shPop.classList.add("on");
  shBtn.setAttribute("aria-expanded", "true");
  const m = vmeta();
  $("#shTitulo").textContent = "Compartir «" + ((m && m.nombre) || st.vid) + "»";
  $("#shEtq").value = ""; $("#shVe").checked = false; $("#shDias").value = "7";
  SH.nuevo = null;
  shPintar(); shColocar();
  await shCargar();
  shColocar();
}
async function shCargar(){
  if(!st.slug || !st.vid) return;
  SH.cargando = true; SH.error = ""; shPintar();
  try{
    const d = await api(shUrl());
    SH.enlaces = (d && Array.isArray(d.enlaces)) ? d.enlaces : [];
    SH.sinEndpoints = false;
    try{ SH.estado = await api("/api/invitados/estado"); }catch(e){ SH.estado = null; }
  }catch(e){
    SH.enlaces = [];
    SH.sinEndpoints = /^HTTP 404|no encontrado/.test(e.message || "");
    SH.error = SH.sinEndpoints ? "" : (e.message || "error");
  }
  SH.cargando = false; shPintar();
}
function shPintar(){
  if(!shPop) return;
  // ── linea de estado ──
  const est = $("#shEstado"); est.textContent = ""; est.classList.remove("abierta");
  est.appendChild(shEl("i"));
  const activos = SH.enlaces.filter(e => shEstadoEnlace(e) === "activo").length;
  let linea;
  if(SH.cargando) linea = "Consultando…";
  else if(SH.sinEndpoints) linea = "El servidor aún no admite enlaces de invitado.";
  else if(SH.error) linea = "No se pudo consultar: " + SH.error;
  else if(SH.estado && typeof SH.estado.publicada === "boolean"){
    linea = (SH.estado.publicada ? "Puerta abierta" : "Puerta cerrada") + " · " +
            (SH.estado.enlaces_activos != null ? SH.estado.enlaces_activos : activos) + " activos";
    if(SH.estado.publicada) est.classList.add("abierta");
  } else linea = activos + (activos === 1 ? " enlace activo" : " enlaces activos");
  est.appendChild(shEl("span", "", linea));
  est.title = SH.sinEndpoints ? "Falta la parte del servidor (server.py): los enlaces se crearán cuando exista"
            : "Puerta abierta = el túnel está publicado mientras haya enlaces vivos";
  for(const id of ["shDias", "shEtq", "shVe", "shCrear"]){ const e = $("#" + id); if(e) e.disabled = SH.sinEndpoints || SH.cargando; }
  // ── enlace recien creado ──
  const nu = $("#shNuevo"); nu.textContent = ""; nu.classList.toggle("on", !!SH.nuevo);
  if(SH.nuevo){
    nu.appendChild(shEl("span", "shurl", SH.nuevo.url || ""));
    nu.lastChild.title = SH.nuevo.url || "";
    const bc = shEl("button", "btn xs", "Copiar"); bc.title = "Copiar el enlace al portapapeles";
    bc.onclick = async () => toast((await copyText(SH.nuevo.url)) ? "Enlace copiado" : "No se pudo copiar", 2200);
    nu.appendChild(bc);
    if(SH.nuevo.publicada === false){
      const av = shEl("div", "shaviso", "La puerta NO quedó abierta" + (SH.nuevo.aviso ? ": " + SH.nuevo.aviso : "") + ". El invitado no podrá entrar hasta abrirla (publicar.sh on).");
      av.style.flex = "1 1 100%"; nu.appendChild(av);
    }
  }
  // ── lista ──
  const L = $("#shList"); L.textContent = "";
  if(!SH.cargando && !SH.sinEndpoints && !SH.enlaces.length){
    L.appendChild(shEl("div", "shempty", "Este video no tiene enlaces. Crea uno arriba."));
  }
  const orden = SH.enlaces.slice().sort((a, b) => String(b.creado||"").localeCompare(String(a.creado||"")));
  for(const e of orden){
    const estado = shEstadoEnlace(e);
    const row = shEl("div", "shlink" + (estado === "activo" ? "" : " muerto"));
    row.dataset.eid = e.id || "";
    row.dataset.estado = estado;
    const body = shEl("div", "shb");
    const n1 = shEl("div", "shn");
    n1.appendChild(shEl("span", "shst " + estado, estado));
    n1.appendChild(shEl("span", "shetq", e.etiqueta ? String(e.etiqueta).slice(0, 60) : ("enlace " + (e.id || ""))));
    body.appendChild(n1);
    const usos = +e.usos || 0, notas = +e.notas || 0;
    body.appendChild(shEl("span", "shm",
      usos + (usos === 1 ? " uso" : " usos") + " · " + notas + (notas === 1 ? " nota" : " notas") +
      (e.ve_otras ? " · ve otras" : "") +
      (e.expira ? " · " + (estado === "caducado" ? "caducó " : "hasta ") + fechaCorta(e.expira) : "")));
    row.appendChild(body);
    if(estado === "activo"){
      const bc = shEl("button", "btn xs", "Copiar");
      bc.title = "Copiar el enlace de " + (e.etiqueta || e.id || "este invitado");
      bc.onclick = async () => toast((await copyText(e.url || "")) ? "Enlace copiado" : "No se pudo copiar", 2200);
      row.appendChild(bc);
      const br = shEl("button", "btn xs" + (SH.confirmar === e.id ? " confirmar" : ""), SH.confirmar === e.id ? "¿Revocar?" : "Revocar");
      br.title = SH.confirmar === e.id ? "Pulsa otra vez para revocar: el invitado deja de entrar al instante"
                                       : "Revocar este enlace (pide confirmación)";
      br.dataset.rev = e.id || "";
      br.onclick = () => shRevocar(e.id);
      row.appendChild(br);
    }
    L.appendChild(row);
  }
}
async function shCrear(){
  if(esInvitado || !st.slug || !st.vid) return;
  const dias = +$("#shDias").value || 7;
  const etiqueta = String($("#shEtq").value || "").trim().slice(0, 60);
  const ve_otras = !!$("#shVe").checked;
  $("#shCrear").disabled = true;
  try{
    const r = await api(shUrl(), {method:"POST", body: JSON.stringify({dias: dias, etiqueta: etiqueta, ve_otras: ve_otras})});
    SH.nuevo = r || null;
    $("#shEtq").value = "";
    toast(r && r.publicada === false ? "Enlace creado, pero la puerta NO quedó abierta" : "Enlace creado", 3000);
    await shCargar();
    if(SH.nuevo && SH.nuevo.url) copyText(SH.nuevo.url).then(ok => { if(ok) toast("Enlace creado y copiado", 2600); });
  }catch(e){ toast("No se pudo crear el enlace: " + e.message, 4000); }
  $("#shCrear").disabled = false;
  shColocar();
}
// confirmacion EN el boton: primer clic lo arma 4 s, segundo clic revoca
async function shRevocar(id){
  if(esInvitado || !id) return;
  if(SH.confirmar !== id){
    SH.confirmar = id; shPintar();
    clearTimeout(SH.confirmarT);
    SH.confirmarT = setTimeout(() => { if(SH.confirmar === id){ SH.confirmar = null; shPintar(); } }, 4000);
    return;
  }
  SH.confirmar = null; clearTimeout(SH.confirmarT);
  try{
    await api(shUrl() + "/" + encodeURIComponent(id), {method:"DELETE"});
    toast("Enlace revocado", 2200);
  }catch(e){ toast("No se pudo revocar: " + e.message, 4000); }
  await shCargar(); shColocar();
}
if(shBtn && shPop){
  shBtn.onclick = ev => { ev.stopPropagation(); shAbierto() ? shCerrar() : shAbrir(); };
  $("#shCerrar").onclick = shCerrar;
  $("#shCrear").onclick = shCrear;
  $("#shEtq").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); shCrear(); } });
  document.addEventListener("click", ev => {
    // un boton del popover que se repinto durante su propio clic ya no esta en el DOM:
    // no es «clic fuera»
    if(!ev.target || !ev.target.isConnected) return;
    if(shAbierto() && !shPop.contains(ev.target) && !shBtn.contains(ev.target)) shCerrar();
  });
  document.addEventListener("keydown", ev => { if(ev.key === "Escape" && shAbierto()){ shCerrar(); } });
  window.addEventListener("resize", shColocar);
}

/* ═══ COMPARAR v01 · v02 (P7, solo anfitrion) ═══
   Estado de VISTA: no toca notas ni entra en el historial de deshacer. El corte
   actual (#v, con sus notas, marcadores y canvas) se muestra junto a OTRO corte del
   mismo proyecto en #v2, que SIGUE al principal: reproducir, pausar, saltar, velocidad
   y scrub se replican por TIEMPO (currentTime), nunca por fotograma, asi que dos
   cortes con fps distintos tambien van a la par (y el rotulo lo dice).
   - Por defecto se compara con el corte ANTERIOR por `created`; el selector permite
     cualquier otro. Sin otro corte reproducible el boton queda desactivado con title.
   - «Lado a lado»: las dos cajas con la misma altura, cada una con su proporcion.
   - «Cortina»: #cmpWrap encima de #fw con su mismo rectangulo, recortado con
     clip-path; el tirador es role=slider (← → 1 %, Shift 10 %).
   - #v2 no lleva src hasta entrar y lo suelta al salir. Esc sale. Al salir se
     restaura el estado exacto: posicion, pausa, velocidad, zoom y seleccion. */
const CMP = {on:false, modo:"side", otro:null, pct:50, snap:null, raf:0, corr:0};
const v2 = $("#v2");
function cmpEstado(){ return CMP; }
function cmpCandidatos(){
  return (st.videos || []).filter(x => x.id !== st.vid && x.reproducible !== false);
}
// el anterior por `created`; si el actual es el mas viejo, el siguiente
function cmpAnterior(){
  const vs = (st.videos || []).slice().sort((a,b) => String(a.created||"").localeCompare(String(b.created||"")));
  const cand = cmpCandidatos();
  const i = vs.findIndex(x => x.id === st.vid);
  for(let k = i - 1; k >= 0; k--) if(cand.some(c => c.id === vs[k].id)) return vs[k];
  for(let k = i + 1; k < vs.length; k++) if(cand.some(c => c.id === vs[k].id)) return vs[k];
  return cand[0] || null;
}
function cmpPintarControl(){
  const b = $("#bCmp"); if(!b || esInvitado) return;
  const m = vmeta();
  const cand = cmpCandidatos();
  const puede = !!m && m.reproducible !== false && cand.length > 0;
  b.disabled = !puede;
  b.setAttribute("aria-disabled", puede ? "false" : "true");
  b.title = puede ? "Comparar este corte con otro del proyecto"
                  : "Para comparar hace falta otro corte reproducible en este proyecto";
  b.hidden = CMP.on;
  const sel = $("#cmpSel");
  if(CMP.on){
    sel.innerHTML = cand.map(x => '<option value="' + esc(x.id) + '"' + (x.id === CMP.otro ? ' selected' : '') + '>' +
                                  esc(x.nombre) + '</option>').join("");
    sel.value = CMP.otro || "";
  }
  for(const id of ["cmpSel", "cmpSide", "cmpCurt", "cmpExit"]){ const e = $("#" + id); if(e) e.hidden = !CMP.on; }
  const bs = $("#cmpSide"), bc = $("#cmpCurt");
  if(bs){ bs.classList.toggle("on", CMP.modo === "side");    bs.setAttribute("aria-pressed", CMP.modo === "side" ? "true" : "false"); }
  if(bc){ bc.classList.toggle("on", CMP.modo === "curtain"); bc.setAttribute("aria-pressed", CMP.modo === "curtain" ? "true" : "false"); }
}
function cmpPintarRotulos(){
  const pill = $("#cmpPill"), lc = $("#cmpLblCur"), lo = $("#cmpLblOtro");
  const m1 = vmeta(), m2 = (st.videos || []).find(x => x.id === CMP.otro);
  if(!CMP.on || !m1 || !m2){ pill.hidden = true; lc.hidden = true; lo.hidden = true; return; }
  const corto = s => { s = String(s || ""); return s.length > 28 ? s.slice(0, 27) + "…" : s; };
  let extra = "";
  const f1 = okFps(m1.fps) ? +m1.fps : 0, f2 = okFps(m2.fps) ? +m2.fps : 0;
  if(f1 && f2 && Math.abs(f1 - f2) > 0.01) extra += " · fps " + f1 + " / " + f2 + ": a la par por tiempo";
  const r1 = (vw && vh) ? vw / vh : 0;
  const r2 = (v2.videoWidth && v2.videoHeight) ? v2.videoWidth / v2.videoHeight : 0;
  if(r1 && r2 && Math.abs(r1 - r2) > 0.01) extra += " · proporción distinta (" + vw + "×" + vh + " / " + v2.videoWidth + "×" + v2.videoHeight + ")";
  pill.textContent = "Comparando «" + corto(m1.nombre) + "» con «" + corto(m2.nombre) + "»" + extra;
  pill.title = pill.textContent; pill.hidden = false;
  lc.textContent = corto(m1.nombre); lc.hidden = false;
  lo.textContent = corto(m2.nombre); lo.hidden = false;
}
function cmpSetPct(p){
  CMP.pct = clamp(+p || 0, 0, 100);
  $("#cmpWrap").style.clipPath = "inset(0 " + (100 - CMP.pct) + "% 0 0)";
  $("#cmpLine").style.left = CMP.pct + "%";
  const h = $("#cmpHandle");
  h.style.left = CMP.pct + "%";
  h.setAttribute("aria-valuenow", String(Math.round(CMP.pct)));
  h.setAttribute("aria-valuetext", Math.round(CMP.pct) + " %");
}
// escribe solo si cambia: el ResizeObserver de #fw vuelve a llamar aqui y no debe ciclar
function cmpPx(el, css){
  for(const k of Object.keys(css)){
    const val = Math.round(css[k]) + "px";
    if(el.style[k] !== val) el.style[k] = val;
  }
}
let _cmpLayoutBusy = false;
function cmpLayout(){
  if(!CMP.on || _cmpLayoutBusy) return;
  _cmpLayoutBusy = true;
  try{
    const sc = $("#screen"), fw = $("#fw"), w2 = $("#cmpWrap"), cu = $("#cmpCurtain");
    const r1 = (vw && vh) ? vw / vh : 16 / 9;
    const r2 = (v2.videoWidth && v2.videoHeight) ? v2.videoWidth / v2.videoHeight : r1;
    if(CMP.modo === "side"){
      const PAD = 16, GAP = 12;
      const W = sc.clientWidth - 2 * PAD, H = sc.clientHeight - 2 * PAD;
      if(W <= 0 || H <= 0) return;
      // sin pasar del tamano natural: el visor normal tampoco amplia un clip pequeno
      const natural = Math.max(vh || H, v2.videoHeight || 0);
      const h = Math.floor(Math.min(H, (W - GAP) / (r1 + r2), natural));
      cmpPx(fw, {width: h * r1, height: h});
      cmpPx(w2, {width: h * r2, height: h});
    } else {
      const sr = sc.getBoundingClientRect(), fr = fw.getBoundingClientRect();
      const css = {left: fr.left - sr.left, top: fr.top - sr.top, width: fr.width, height: fr.height};
      cmpPx(w2, css); cmpPx(cu, css);
    }
  } finally { _cmpLayoutBusy = false; }
}
function cmpSetModo(m){
  CMP.modo = (m === "curtain") ? "curtain" : "side";
  const sc = $("#screen");
  sc.classList.toggle("cmp-side", CMP.modo === "side");
  sc.classList.toggle("cmp-curtain", CMP.modo === "curtain");
  $("#cmpCurtain").classList.toggle("on", CMP.modo === "curtain");
  // limpiar la geometria del modo anterior antes de medir la del nuevo
  $("#fw").style.cssText = ""; $("#cmpWrap").style.cssText = ""; $("#cmpCurtain").style.cssText = "";
  if(CMP.modo === "curtain") cmpSetPct(CMP.pct);
  cmpPintarControl(); cmpLayout(); fit();
}
function cmpEntrar(otroId){
  if(esInvitado || !st.vid) return false;
  const m = vmeta();
  if(!m || m.reproducible === false) return false;
  const otro = (otroId && cmpCandidatos().find(x => x.id === otroId)) || cmpAnterior();
  if(!otro){ toast("No hay otro corte con el que comparar"); return false; }
  if(!CMP.on){
    CMP.snap = {t: v.currentTime, paused: v.paused, rate: v.playbackRate,
                zoom: st.tl.zoom, off: st.tl.off, selId: st.selId,
                pend: st.pend ? Object.assign({}, st.pend) : null, replyTo: st.replyTo};
    pause();                                   // el segundo corte tiene que cargar primero
    CMP.on = true;
    $("#screen").classList.add("cmp-on");
    $("#cmpWrap").classList.add("on");
  }
  if(CMP.otro !== otro.id || !v2.getAttribute("src")){
    CMP.otro = otro.id;
    v2.src = "/media/" + encodeURIComponent(st.slug) + "/" + otro.id + "/" + otro.archivo;
    v2.load();
  }
  v2.playbackRate = v.playbackRate;
  cmpSetModo(CMP.modo);
  cmpPintarRotulos();
  return true;
}
function cmpSalir(restaurar){
  if(!CMP.on) return false;
  CMP.on = false;
  if(CMP.raf){ cancelAnimationFrame(CMP.raf); CMP.raf = 0; }
  v2.pause(); v2.removeAttribute("src"); v2.load();   // liberar el segundo video
  const sc = $("#screen");
  sc.classList.remove("cmp-on", "cmp-side", "cmp-curtain");
  $("#cmpWrap").classList.remove("on"); $("#cmpCurtain").classList.remove("on");
  $("#fw").style.cssText = ""; $("#cmpWrap").style.cssText = ""; $("#cmpCurtain").style.cssText = "";
  const s = CMP.snap; CMP.snap = null; CMP.otro = null;
  cmpPintarControl(); cmpPintarRotulos();
  if(s && restaurar !== false){
    tlSetView(s.zoom, s.off);
    v.playbackRate = s.rate;
    st.selId = s.selId; st.pend = s.pend; st.replyTo = s.replyTo;
    seek(s.t); tlPaint();
    if(!s.paused) play();
    renderList(); updateEditor(); drawCanvas();
  }
  fit();
  return true;
}
/* ── seguimiento: #v manda, #v2 sigue por tiempo ── */
function cmpSync(forzar){
  if(!CMP.on || v2.readyState < 1) return;
  const d = v.currentTime - v2.currentTime;
  if(forzar || Math.abs(d) > 0.5 / Math.max(1, fps)) v2.currentTime = v.currentTime;
}
function cmpLoop(){
  if(CMP.raf) cancelAnimationFrame(CMP.raf);
  const paso = () => {
    if(!CMP.on || v.paused){ CMP.raf = 0; return; }
    if(v2.readyState >= 2 && !v2.seeking){
      const d = v.currentTime - v2.currentTime;          // > 0: #v2 va por detras
      const fr = 1 / Math.max(1, fps), ahora = performance.now();
      if(Math.abs(d) > 0.5 * fr && ahora - CMP.corr > 250){
        v2.currentTime = v.currentTime; CMP.corr = ahora; v2.playbackRate = v.playbackRate;
      } else if(Math.abs(d) > 0.004){
        // deriva pequena: se corrige con la velocidad, sin salto visible
        v2.playbackRate = v.playbackRate * (1 + clamp(d * 4, -0.08, 0.08));
      } else if(v2.playbackRate !== v.playbackRate) v2.playbackRate = v.playbackRate;
      if(v2.paused) v2.play().catch(() => {});
    }
    CMP.raf = requestAnimationFrame(paso);
  };
  CMP.raf = requestAnimationFrame(paso);
}
v.addEventListener("seeking", () => cmpSync(true));
v.addEventListener("seeked",  () => cmpSync(true));
v.addEventListener("play",  () => { if(!CMP.on) return; cmpSync(true); v2.play().catch(() => {}); cmpLoop(); });
v.addEventListener("pause", () => { if(!CMP.on) return; v2.pause(); cmpSync(true); });
v.addEventListener("ended", () => { if(CMP.on) v2.pause(); });
v.addEventListener("ratechange", () => { if(CMP.on) v2.playbackRate = v.playbackRate; });
v2.addEventListener("loadedmetadata", () => {
  if(!CMP.on) return;
  v2.playbackRate = v.playbackRate; cmpSync(true);
  if(!v.paused){ v2.play().catch(() => {}); cmpLoop(); }
  cmpLayout(); cmpPintarRotulos();
});
v2.addEventListener("error", () => { if(CMP.on) toast("No se pudo cargar el otro corte", 3000); });
// la geometria depende de la escena y del tamano real de #fw (la carga del video lo cambia)
new ResizeObserver(() => cmpLayout()).observe($("#screen"));
new ResizeObserver(() => cmpLayout()).observe($("#fw"));
/* ── tirador de la cortina: arrastre con captura y teclado ── */
(function(){
  const h = $("#cmpHandle"), cu = $("#cmpCurtain");
  if(!h || !cu) return;
  let arrastrando = false;
  const aPct = ev => { const r = cu.getBoundingClientRect(); return r.width ? clamp((ev.clientX - r.left) / r.width, 0, 1) * 100 : CMP.pct; };
  h.addEventListener("pointerdown", ev => {
    ev.preventDefault(); ev.stopPropagation();
    arrastrando = true; try{ h.setPointerCapture(ev.pointerId); }catch(_){}
    h.focus(); cmpSetPct(aPct(ev));
  });
  h.addEventListener("pointermove", ev => { if(arrastrando) cmpSetPct(aPct(ev)); });
  const fin = () => { arrastrando = false; };
  h.addEventListener("pointerup", fin); h.addEventListener("pointercancel", fin);
  h.addEventListener("keydown", ev => {
    const paso = ev.shiftKey ? 10 : 1;
    if(ev.key === "ArrowLeft") cmpSetPct(CMP.pct - paso);
    else if(ev.key === "ArrowRight") cmpSetPct(CMP.pct + paso);
    else if(ev.key === "Home") cmpSetPct(0);
    else if(ev.key === "End") cmpSetPct(100);
    else return;
    ev.preventDefault(); ev.stopPropagation();   // que ← → no muevan ademas el fotograma
  });
})();
$("#bCmp").onclick = () => { if(!$("#bCmp").disabled) cmpEntrar(); };
$("#cmpSel").onchange = e => cmpEntrar(e.target.value);
$("#cmpSide").onclick = () => cmpSetModo("side");
$("#cmpCurt").onclick = () => cmpSetModo("curtain");
$("#cmpExit").onclick = () => cmpSalir(true);
document.addEventListener("keydown", ev => {
  if(ev.key !== "Escape" || !CMP.on) return;
  if($("#modal").classList.contains("on")) return;
  if(typeof shAbierto === "function" && shAbierto()) return;
  const sw = $("#swPop"); if(sw && !sw.hidden) return;
  const tag = (ev.target.tagName || "").toLowerCase();
  if(tag === "textarea" || tag === "input") return;
  cmpSalir(true);
});

/* ═══ arranque ═══ */
/* Color: un circulito con el color actual; al clic se despliega el resto.
   Fuera del popover = se cierra. Escape = se cierra. */
(function(){
  const btn = $("#swBtn"), pop = $("#swPop"), dot = $("#swDot");
  if(!btn || !pop) return;
  const pintar = () => {
    dot.style.background = st.color;
    btn.setAttribute("aria-label", "Color del pincel: " + st.color);
    pop.innerHTML = PALETTE.map(c =>
      '<span class="sw'+(c===st.color?" on":"")+'" data-c="'+c+'" title="'+c+'" style="background:'+c+'"></span>').join("");
    for(const el of $$("#swPop .sw")) el.onclick = (ev) => {
      ev.stopPropagation();
      st.color = el.dataset.c; pintar(); cerrar();
    };
  };
  /* Colocar el popover midiendo el boton, en coordenadas de ventana. Se voltea
     hacia abajo si arriba no cabe, y se corrige en horizontal para que nunca
     se salga — que era lo que pasaba con el panel plegado (x = -56). */
  const colocar = () => {
    if(pop.hidden) return;
    const b = btn.getBoundingClientRect();
    const M = 8, GAP = 10;
    pop.classList.remove("arriba","abajo");
    // medir con las dos propiedades en auto
    pop.style.left = "0px"; pop.style.top = "0px"; pop.style.bottom = "auto";
    const p = pop.getBoundingClientRect();
    const H = p.height, W = p.width;
    const cabeArriba = (b.top - H - GAP) >= M;
    const cabeAbajo  = (b.bottom + GAP + H) <= (innerHeight - M);
    let top;
    if(cabeArriba) top = b.top - H - GAP;
    else if(cabeAbajo) top = b.bottom + GAP;
    else {
      // no cabe ni arriba ni abajo (ventana muy baja): se ancla al borde visible
      top = Math.max(M, Math.min(b.bottom + GAP, innerHeight - H - M));
      if(top + H > innerHeight - M) top = Math.max(M, b.top - H - GAP);
      if(top < M) top = M;
    }
    pop.classList.add(top < b.top ? "arriba" : "abajo");
    let x = b.left + b.width/2 - W/2;
    x = Math.max(M, Math.min(x, innerWidth - W - M));
    pop.style.left = Math.round(x) + "px";
    pop.style.top = Math.round(top) + "px";
    pop.style.bottom = "auto";
  };
  const abrir = () => { pop.hidden = false; btn.setAttribute("aria-expanded","true"); colocar();
    setTimeout(colocar, 0); };
  const cerrar = () => { pop.hidden = true; btn.setAttribute("aria-expanded","false"); };
  btn.onclick = ev => { ev.stopPropagation(); pop.hidden ? abrir() : cerrar(); };
  document.addEventListener("click", ev => {
    if(!pop.hidden && !pop.contains(ev.target) && ev.target !== btn) cerrar();
  });
  document.addEventListener("keydown", ev => { if(ev.key === "Escape" && !pop.hidden) cerrar(); });
  window.addEventListener("resize", () => { if(!pop.hidden) colocar(); });
  window.addEventListener("scroll", () => { if(!pop.hidden) colocar(); }, true);
  /* Recolocar cuando el boton se mueva. Un MutationObserver con subtree:true sobre
     todo el body se disparaba en bucle (colocar cambia el estilo del popover -> vuelve
     a disparar -> cuelga la pagina entera y todo devuelve null). Se sustituye por
     recolocar en los momentos donde el boton SI puede moverse. */
  const recolocar = () => { if(!pop.hidden) colocar(); };
  if(typeof requestAnimationFrame !== "undefined"){
    // tras el plegado del panel y tras cualquier cambio de layout relevante
    document.addEventListener("click", ev => {
      if(ev.target && ev.target.closest && (ev.target.closest("#bNavFold,#navOpen"))) setTimeout(recolocar, 260);
    }, true);
  }
  pintar();
  window.__colocarPopover = colocar;
  window.__cerrarPopover = cerrar;
})();
$("#ws").innerHTML = SIZES.map(s => '<button data-s="'+s+'" class="'+(s===st.size?"on":"")+'" style="width:'+(3+s)+'px;height:'+(3+s)+'px"></button>').join("");
for(const el of $$("#ws button")) el.onclick = () => { st.size = +el.dataset.s; $$("#ws button").forEach(x => x.classList.toggle("on", x===el)); };
for(const el of $$("[data-tool]")) el.onclick = () => { st.tool = el.dataset.tool; $$("[data-tool]").forEach(x => x.classList.toggle("on", x===el)); };

(function init(){
  renderFilter(); renderList();
  if(esInvitado){ invArrancar(); return; }
  pull(true).then(() => {
    if(st.slug || !st.proyectos.length) return;
    const ses = leerSesion();
    const sigue = st.proyectos.find(p => p.slug === ses.slug && !p.archivado);
    // si el guardado ya no esta (archivado o borrado), se abre el primero activo
    openProject(sigue ? sigue.slug : st.proyectos[0].slug, {vid: sigue ? ses.vid : null});
  });
  setInterval(() => { if(st.vid && !v.paused) updateEditor(); }, 500);
// Enter / Guardar envian al instante: no queda nada "en el aire" al cerrar.
})();
</script>
