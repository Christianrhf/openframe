<script>
"use strict";
const $ = s => document.querySelector(s);
// el segundo argumento es la raiz. Habia dos llamadas que ya lo pasaban —
// $$(".rnote", rail) y $$(".mark", host) — y se ignoraba: borraban por TODO el
// documento. Funcionaba por casualidad (solo hay un carril y un scrub).
const $$ = (s, root) => [...(root || document).querySelectorAll(s)];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const pad = (n,l=2) => String(n).padStart(l,'0');
let _tt;
function toast(m,ms=2100){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove("on"),ms); }
async function copyText(s){ try{ await navigator.clipboard.writeText(s); return true; }catch(e){
  const ta=document.createElement("textarea"); ta.value=s; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); return ok; } }
const base = s => s.replace(/\.[^.\/]+$/,"");

const PALETTE = ["#ff4d4d","#ff9f0a","#ffd60a","#5ac08a","#40c8e0","#5b8cff","#bf5af2"];
const SIZES = [3,5,8];
let st = { proyectos:[], slug:null, vid:null, videos:[], notas:[], rev:-1, pendingPoll:false,
           // vista del timeline: zoom (1 = video entero) y off (inicio en segundos).
           // Vive aqui desde el arranque: antes se creaba 1300 lineas mas abajo y
           // cualquier lectura anterior (vmeta, tlSeg) encontraba st.tl undefined.
           tl:{zoom:1, off:0},
           tool:null, color:PALETTE[0], size:SIZES[1], pend:null, hist:[], hpos:-1,
           det:true, onlyPend:false, thumbs:false, filterVid:"", busyNote:false,
           x2Search:"", x2Type:"all", x2Person:"all", x2Drawing:false,
           x2Page:0, adjustTo:null,
           selId:null,        // id de la nota activa (editar/mover/borrar)
           playhead:-1,      // fotograma bajo el cursor de reproduccion
           phNote:"",         // ids de las notas bajo el cursor (para no repintar de mas)
           // ── HILOS ──
           replyTo:null,      // id de la nota raiz a la que apunta el cuadro de texto
           plegados:{}        // {idRaiz:true} hilos con las respuestas escondidas
         };

/* ═══ INVITADOS ═══
   `guest.py` inyecta window.__INVITADO = {slug, video, nombre, expira, ve_otras,
   proyecto:{nombre,cliente}, version:{nombre,fps,duracion,ancho,alto}} antes de este
   script. Si existe, la pagina es la de UN invitado: un solo video, sin proyectos,
   sin borrar/resolver/subir. Ocultar NO es seguridad (la puerta de guest.py niega);
   aqui ademas cada accion oculta esta guardada para que ni teclado ni consola la
   dispare. Todo texto del invitado se pinta con textContent o con esc(). */
const INV = (window.__INVITADO && typeof window.__INVITADO === "object") ? window.__INVITADO : null;
const esInvitado = !!INV;
let invCaducado = false;
if(esInvitado) document.body.classList.add("invitado");
const puedeEscribir = () => !esInvitado || !invCaducado;
// quien firma una nota: "cristian" | "claude" | "invitado"
function quienEs(n){
  if(!n) return "cristian";
  return n.author === "claude" ? "claude" : n.author === "invitado" ? "invitado" : "cristian";
}
// texto del chip de autor. El invitado SIEMPRE lleva «Invitado · Nombre»: no se
// confunde ni con Cristian («Tú») ni con Agente.
function nombreAutor(n){
  const q = quienEs(n);
  if(q === "claude") return "Agente";
  if(q === "invitado") return "Invitado · " + String(n.autor_nombre || "sin nombre").slice(0, 40);
  return esInvitado ? "Cristian" : "Tú";
}
// ¿esta nota la escribio quien mira la pantalla? (edicion de texto/dibujo)
function esMia(n){
  if(!n) return false;
  if(!esInvitado) return quienEs(n) === "cristian";
  if(quienEs(n) !== "invitado") return false;
  if(INV.enlace_id && n.enlace_id) return n.enlace_id === INV.enlace_id;
  return !!INV.nombre && n.autor_nombre === INV.nombre;
}
// PATCH de una nota: la puerta de invitados solo admite /api/notas/<slug>/<id>
const NP = id => esInvitado ? ("/api/notas/" + encodeURIComponent(st.slug) + "/" + encodeURIComponent(id))
                             : ("/api/proyectos/" + encodeURIComponent(st.slug) + "/notas/" + id);

/* ═══ HILOS ═══
   Una nota es RAIZ (sin parent) o RESPUESTA (parent = id de la raiz). La respuesta
   no tiene momento propio: comparte video y fotograma con su raiz, y por eso NO pinta
   marcador — un hilo entero es un solo punto del video, como en Frame.io.

   El estado es DERIVADO de los datos que ya existen, no un campo nuevo:
     pendiente  = raiz sin respuestas y sin resolver
     respondida = raiz con respuestas y sin resolver
     cerrada    = raiz con resolved = true   (lo que ya hacia "marcar como hecha")
   Asi "cerrar" y "reabrir" siguen siendo el mismo boton de siempre y no hay dos
   verdades que puedan desincronizarse. */
const esRespuesta = n => !!(n && n.parent);
function respuestasDe(id){
  return st.notas.filter(n => n.parent === id)
                 .sort((a,b) => String(a.created||"").localeCompare(String(b.created||"")) ||
                                String(a.id).localeCompare(String(b.id)));
}
const EST = {PEND:"pendiente", RESP:"respondida", CERR:"cerrada"};
function estadoHilo(raiz){
  if(!raiz) return EST.PEND;
  if(raiz.resolved) return EST.CERR;
  return respuestasDe(raiz.id).length ? EST.RESP : EST.PEND;
}
// la nota raiz de cualquier nota (una respuesta devuelve su raiz)
function raizDe(n){
  if(!n) return null;
  return esRespuesta(n) ? (st.notas.find(x => x.id === n.parent) || n) : n;
}
/* ── fps: UN SOLO lugar lo decide ──
   El fps es propiedad del VIDEO. Lo que mide el navegador solo rellena cuando el
   contenedor no lo declara, y una nota NUNCA cambia el fps del reproductor.
   Antes `fps` se escribia desde tres sitios (meta del video, tickFps y el valor
   por defecto) y las notas se pintaban con el ultimo que hubiera ganado: de ahi
   venia la sensacion de que las notas "se mueven". */
const FPS_MIN = 12, FPS_MAX = 240, FPS_DEFAULT = 24;
const okFps = x => Number.isFinite(+x) && +x >= FPS_MIN && +x <= FPS_MAX;
let fps = FPS_DEFAULT;     // solo setFps() escribe aqui
let detFps = 0;            // lo ultimo que midio el navegador (0 = nada fiable)
let fpsSrc = "defecto";    // de donde salio: archivo | medido | defecto
let vw = 0, vh = 0, vdur = 0;
const v = $("#v"), cv = $("#cv"), ctx = cv.getContext("2d");
/* ── Que cuenta como pendiente ──
   La MISMA regla que el servidor (es_pendiente). Antes cada sitio contaba lo suyo y
   por eso la tarjeta del proyecto decia "51 pendientes" con 37 marcadores de cambio
   metidos: Cristian tenia 2 notas que atender, no 51. Un cambio no se resuelve, se
   mira: se marca `visto` al aterrizar en el. */
/* ── Un cambio se marca "visto" al aterrizar en el ──
   Fable 2.7: el contador de "sin revisar" se quedaba en 37 para siempre porque un
   cambio nunca pasaba a visto. Ahora aterrizar en el (Shift+N o clic en el marcador)
   lo marca, el contador baja solo y el punto se ve mas apagado. */
async function marcarCambioVisto(c){
  if(esInvitado) return;                 // «visto» es de Cristian; la puerta lo niega
  if(!c || c.visto || c.kind !== "cambio") return;
  c.visto = true;                        // optimista: el contador baja ya
  renderList(); updateMarks(); actualizarAsaNav();
  try{
    const r = await api(P(st.slug)+"/notas/"+c.id, {method:"PATCH", body:JSON.stringify({visto:true})});
    if(r && r.nota) upsertNote(r.nota);
  }catch(e){ c.visto = false; }           // si fallo, volver atras
}

function esPendiente(n){
  if(!n) return false;
  if(n.kind === "cambio") return false;   // no es trabajo pendiente de Cristian
  if(n.parent) return false;               // cuelga de su raiz, no cuenta dos veces
  return !n.resolved;
}
function pendientesDe(vid){
  return st.notas.filter(n => (!vid || n.video === vid) && esPendiente(n)).length;
}
function cambiosSinVer(){
  return st.notas.filter(n => n.kind === "cambio" && !n.visto).length;
}

const pro = () => st.proyectos.find(p => p.slug === st.slug) || null;
// mientras se muta una nota, el polling no debe pisar st.notas (provoca "no encontrado")
async function withBusyNote(fn){
  st.busyNote = true;
  try{ return await fn(); }
  finally{ st.busyNote = false; }
}
// `st.videos` puede no existir todavia (el detalle llega por red): || [] evita que
// un fallo de conexion tire toda la UI con "find of undefined"
const vmeta = () => ((pro() ? st.videos : []) || []).find(x => x.id === st.vid) || null;

/* ═══ tema CLARO, obligatorio ═══
   Cristian lo dijo dos veces. Habia un boton que cambiaba a oscuro y lo guardaba en
   localStorage: un clic sin querer dejaba la app oscura hasta descubrir como volver.
   El boton se elimino y el tema se fija en claro. No queda forma de cambiarlo. */
function applyTheme(){
  document.documentElement.setAttribute("data-theme", "light");
}
try{ localStorage.removeItem("visor-notas:tema"); }catch(e){}
applyTheme();
/* ═══ API ═══ */
async function api(path, opt){
  const r = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, opt||{}));
  if(!r.ok){ let m=""; try{ m=(await r.json()).error; }catch(_){}
    if(esInvitado){
      // la puerta pide nombre antes de escribir; y cuando el enlace muere, TODO es 404
      if(r.status === 403 && m === "nombre") invPedirNombre();
      if(r.status === 404 && path === P(INV.slug)) invMarcarCaducado();
    }
    throw new Error(m || ("HTTP "+r.status)); }
  return r.json();
}
const P = p => "/api/proyectos/" + encodeURIComponent(p);

/* ═══ carga / sincronizacion ═══ */
/* ── Recordar donde estabas ──
   Cristian: "cuando uno recarga siempre vuelve al proyecto 1, deberia quedarse en
   el que uno esta trabajando". Se guarda el proyecto y el video en localStorage y al
   arrancar se abre ese. Si ya no existe (se archivó o se borró), se cae al primero
   que NO esté archivado. */
const LAST_KEY = "openframe:last";
function guardarSesion(){
  if(esInvitado) return;
  try{ localStorage.setItem(LAST_KEY, JSON.stringify({slug: st.slug, vid: st.vid})); }catch(e){}
}
function leerSesion(){
  try{ return JSON.parse(localStorage.getItem(LAST_KEY) || "null") || {}; }catch(e){ return {}; }
}
/* El invitado no tiene lista de proyectos (/api/proyectos es 404 en la puerta):
   sondea directamente el detalle de SU proyecto, que ya trae rev + videos + notas. */
async function pullInvitado(){
  try{
    const d = await api(P(INV.slug));
    setConn(true);
    if(st.rev !== d.rev){
      st.rev = d.rev;
      if(!st.busyNote && !drawing && !cur) absorbDetail(d);
      if(st.vid && !drawing){ renderList(); updateMarks(); updateEditor(); }
    }
  }catch(e){ setConn(invCaducado); }   // enlace muerto = 404 a todo, no «sin conexión»
}
async function pull(force){
  if(esInvitado) return pullInvitado();
  try{
    const d = await api("/api/proyectos");
    st.proyectos = d.proyectos || [];
    st.archivados  = d.archivados || [];
    setConn(true);
    if(st.rev !== d.rev){
      const antes = st.rev;
      st.rev = d.rev;
      /* Mientras se dibuja NO se pisan las notas: pullDetail() reemplaza st.notas
         entero con la lista del servidor y la nota optimista (tmp_...) se perdia a
         mitad del gesto — el trazo desaparecia sin explicacion. Hay 2 opciones:
         seguir dibujando o dejar el trazo de lado; el poll espera 2 s. */
      if(st.slug && !st.busyNote) await pullDetail();
      renderProyectos();
      /* Repintar SIEMPRE. Antes el poll traia las notas de Agente al estado pero
         nunca las pintaba: lo que Agente subia era invisible hasta que Cristian
         hacia clic en algo. Ahora se ve solo, y se avisa si son cosas nuevas. */
      if(st.slug){
        // (antes decia `dibujando`, una variable que no existe: ReferenceError en cada
        //  cambio de rev y el poll nunca repintaba. La bandera real es `drawing`.)
        if(!drawing){ renderList(); updateMarks(); renderVideos(); updateEditor();
          if(antes !== -1) avisarSiLlegoAlgoDeClaude(); }
      }
    }
  }catch(e){ setConn(false); }
}
// Extrae las notas de una respuesta de detalle (compartida por fetch y por PATCH)
function absorbDetail(d){
  if(d.videos) st.videos = d.videos;
  if(d.notas){
    /* Las notas optimistas (todavia sin id del servidor) se conservan: si se perdieran
       al absorber, el trazo que se esta haciendo se perdia con ellas. */
    const optimistas = (st.notas||[]).filter(n => String(n.id).startsWith("tmp_"));
    st.notas = d.notas;
    for(const o of optimistas){
      if(!st.notas.some(n => n.id === o.id)) st.notas.push(o);
    }
    st.notas.sort(cmpNotas);
  }
  // la meta del video puede haber cambiado de fps: reevaluar la unica fuente
  if(d.videos && st.vid && typeof setFps === "function") setFps();
  if(d.proyecto){ const p = pro(); if(p){ p.nombre = d.proyecto.nombre; p.cliente = d.proyecto.cliente; p.nota = d.proyecto.nota; } }
}
async function pullDetail(){
  if(!st.slug) return;
  /* Nunca reemplazar st.notas a mitad de un trazo. Esta es la UNICA funcion que lo
     hace (absorbe la lista del servidor), asi que la guarda va aqui y no en pull():
     cuando pull() evaluaba la condición, el POST de la nota nueva ya habia cambiado
     `rev` y el poll entraba con la nota optimista todavia en la mano. */
  if(typeof drawing !== "undefined" && (drawing || cur)) return;
  try{
    const d = await api(P(st.slug));
    // si hay una nota mutandose, no pisar la lista: la operacion traera el dato fresco
    if(!st.busyNote) absorbDetail(d);
    setConn(true);
  }catch(e){ setConn(false); }
}

/* ── Aviso de que Agente subió algo ──
   Fable: "Agente's uploads invisible until Cristian clicks something". Con el poll
   ya repintando, solo falta que Cristian entienda que algo llego sin que el脉冲
   loonsonara: un aviso corto, no una notificacion cada 2 segundos. */
let _ultimoRevVisto = -1;
function avisarSiLlegoAlgoDeClaude(){
  if(_ultimoRevVisto === -1){ _ultimoRevVisto = st.rev; return; }   // primer arranque: no avisar
  if(st.rev === _ultimoRevVisto) return;
  _ultimoRevVisto = st.rev;
  const nuevos = st.notas.filter(n => n.author === "claude" && !n._visto);
  if(!nuevos.length) return;
  for(const n of nuevos) n._visto = true;
  const cambios = nuevos.filter(n => n.kind === "cambio").length;
  const respuestas = nuevos.length - cambios;
  const partes = [];
  if(respuestas) partes.push(respuestas + (respuestas===1 ? " respuesta" : " respuestas"));
  if(cambios)   partes.push(cambios   + (cambios===1   ? " cambio"   : " cambios"));
  toast("Agente: " + partes.join(" y "), 3200);
}


/* ── Traer los hilos de otra versión ──
   Fable: "#bHer (inherit threads to new cut) has no onclick. Dead button." El boton
   existia en la interfaz pero no hacia nada. Ahora trae los hilos del video anterior
   de este proyecto al video actual, y dice cuantos trajo. */
/* Trae los hilos abiertos del corte ANTERIOR a este video. Devuelve cuantos trajo.
   La usa la subida desde la UI; `visor.sh subir` hace lo mismo por su cuenta. */
async function heredarDesdeAnterior(nuevoId){
  const vs = st.videos || [];
  const otros = vs.filter(v => v.id !== nuevoId && v.id !== st.vid);
  if(!otros.length) return 0;
  const idx = vs.findIndex(v => v.id === nuevoId);
  const prev = (idx > 0) ? vs[idx-1] : otros[otros.length-1];
  if(!prev || prev.id === nuevoId) return 0;
  try{
    const r = await api(P(st.slug) + "/heredar", {method:"POST",
      body: JSON.stringify({desde: prev.id, hacia: nuevoId, solo_pendientes:true, offset_frames:0})});
    return (r && r.heredados) ? r.heredados : 0;
  }catch(e){ return 0; }
}

async function heredarHilos(){
  if(esInvitado) return;
  if(!st.slug){ toast("Abre un proyecto primero"); return; }
  const vs = st.videos || [];
  if(vs.length < 2){ toast("Necesitas al menos dos versiones para heredar los hilos"); return; }
  const otros = vs.filter(v => v.id !== st.vid);
  // el anterior = el que queda justo antes del actual en la lista
  const idx = vs.findIndex(v => v.id === st.vid);
  const origen = otros.length ? (idx >= 0 ? vs[idx-1] : otros[otros.length-1]) : null;
  if(!origen){ toast("No hay otra versión en este proyecto"); return; }
  const datos = await openModal({
    titulo: "Traer hilos de «" + origen.nombre + "»",
    cuerpo: '<p class="muted">Se copian al video actual las notas que siguen abiertas ' +
            '(sin resolver) de la version anterior, con sus respuestas.</p>' +
            '<div class="frow"><label>Version de origen</label><div>' +
            otros.map(v => '<label class="chk"><input type="radio" name="herOrigen" value="' +
              esc(v.id) + '"' + (v.id === origen.id ? " checked" : "") + '> ' +
              esc(v.nombre) + '</label>').join("") + '</div></div>',
    pie: '<button class="btn" id="hCancel">Cancelar</button>' +
         '<button class="btn pri" id="hGo">Traer los hilos</button>'
  });
  if(!datos) return;
  const sel = datos.herOrigen || origen.id;
  try{
    const r = await api(P(st.slug) + "/heredar", {method:"POST",
      body: JSON.stringify({desde: sel, hacia: st.vid, solo_pendientes:true, offset_frames:0})});
    const n = (r && (r.heredados != null)) ? r.heredados : (r && r.ok ? 1 : 0);
    await pullDetail(); renderList(); updateMarks(); renderVideos(); updateEditor();
    toast(n ? ("Se trajeron " + n + (n===1?" hilo":" hilos") + " de la version anterior")
             : "No hay hilos abiertos que traer", 3000);
  }catch(e){ toast("No se pudieron traer los hilos: " + e.message, 3600); }
}

function setConn(ok){
  const c = $("#conn"); c.classList.toggle("live", ok);
  $("#connTxt").textContent = ok ? "en línea" : "sin conexión";
}
setInterval(()=>{ if(!st.pendingPoll && !st.busyNote) pull(); }, 2200);


/* ═══ HISTORIAL DE ACCIONES (deshacer) ═══
   Cristian: "hay que agregar un boton de deshacer el ultimo cambio hecho".
   Cubre lo que uno hace de verdad en una sesion de revision: crear, borrar, mover,
   editar el texto, marcar como hecha, y el dibujo. Cada accion guarda el estado
   anterior de la nota, asi que deshacer es volver a ponerlo — no adivinar.
   Se cruza con el undo del dibujo: si hay un dibujo sin deshacer, primero ese. */
st.undo = [];        // pila de acciones
st.uPos = -1;        // posicion dentro de la pila (permite rehacer)

function snapNota(n){
  if(!n) return null;
  return {id:n.id, video:n.video, frame:n.frame, end_frame:n.end_frame == null ? null : n.end_frame,
          text:n.text, resolved:!!n.resolved, drawing:n.drawing ? JSON.parse(JSON.stringify(n.drawing)) : null,
          thumb:n.thumb || null, author:n.author, fps:n.fps, time:n.time, timecode:n.timecode,
          // sin parent, "rehacer" una respuesta la recrearia como nota suelta en el
          // fotograma de la raiz: dos notas donde habia un hilo
          parent:n.parent || null, kind:n.kind || "nota", created:n.created || null,
          from_note:n.from_note || null, from_video:n.from_video || null,
          resuelve:n.resuelve || null, visto:!!n.visto, decision:n.decision || null};
}
function pushUndo(etiqueta, acc){
  // si hay rehacer pendiente, se descarta: se esta haciendo una accion nueva
  st.undo.length = st.uPos + 1;
  st.undo.push(Object.assign({etiqueta:etiqueta, ts:Date.now()}, acc));
  if(st.undo.length > 80) st.undo.shift();
  st.uPos = st.undo.length - 1;
  actualizarBotonUndo();
}
function hayUndo(){ return st.uPos >= 0; }
function actualizarBotonUndo(){
  const b = $("#bUndoAccion"), r = $("#bRedoAccion");
  const a = hayUndo() ? st.undo[st.uPos] : null;
  const prox = st.undo[st.uPos + 1] || null;
  if(b){ b.style.display = a ? "" : "none"; if(a) b.setAttribute("data-tip", "Deshacer: " + a.etiqueta); }
  if(r){ r.style.display = prox ? "" : "none";
         if(prox) r.setAttribute("data-tip", "Rehacer: " + prox.etiqueta); }
  const e = $("#undoLbl");
  if(e) e.textContent = a ? a.etiqueta : "";
}
async function deshacer(){
  // si el dibujo tiene historial propio sin usar, ese va primero
  if(st.hpos < st.hist.length - 1){ undo(); actualizarBotonUndo(); return; }
  if(esInvitado) return;                 // el historial de acciones (borrar/crear) es de Cristian
  if(!hayUndo()){ toast("Nada que deshacer"); return; }
  const a = st.undo[st.uPos];
  st.uPos--;
  const P_ = st.slug;
  try{
    if(a.tipo === "multi"){
      for(const x of [...a.acciones].reverse()) await aplicarAccionHist(x, false, P_);
    }else if(a.tipo === "crear"){
      await api(P(P_)+"/notas/"+a.antes.id, {method:"DELETE"});
    }else if(a.tipo === "borrar"){
      // volver a crear la nota tal cual estaba (el id se conserva si el servidor lo acepta)
      await api(P(P_)+"/notas", {method:"POST", body:JSON.stringify(a.antes)});
    }else if(a.tipo === "campo"){
      const patch = {};
      for(const k of a.cambios) patch[k] = a.antes[k];
      await api(P(P_)+"/notas/"+a.antes.id, {method:"PATCH", body:JSON.stringify(patch)});
    }
    await pullDetail();
    st.hist = []; st.hpos = -1;
    drawCanvas(); renderList(); renderVideos(); updateMarks(); updateEditor(); updateUI();
    actualizarBotonUndo();
    toast("Deshecho: " + a.etiqueta, 2400);
  }catch(e){
    st.uPos++;  // no se pudo: devolverlo al punto de partida
    toast("No se pudo deshacer: " + e.message, 4000);
  }
}
async function rehacer(){
  if(esInvitado){ redo(); return; }      // solo el rehacer del dibujo
  if(st.uPos + 1 >= st.undo.length){ toast("Nada que rehacer"); return; }
  st.uPos++;
  const a = st.undo[st.uPos];
  const P_ = st.slug;
  try{
    if(a.tipo === "multi"){
      for(const x of a.acciones) await aplicarAccionHist(x, true, P_);
    }else if(a.tipo === "crear"){
      await api(P(P_)+"/notas", {method:"POST", body:JSON.stringify(a.despues)});
    }else if(a.tipo === "borrar"){
      await api(P(P_)+"/notas/"+a.antes.id, {method:"DELETE"});
    }else if(a.tipo === "campo"){
      const patch = {};
      for(const k of a.cambios) patch[k] = a.despues[k];
      await api(P(P_)+"/notas/"+a.antes.id, {method:"PATCH", body:JSON.stringify(patch)});
    }
    await pullDetail();
    drawCanvas(); renderList(); renderVideos(); updateMarks(); updateEditor(); updateUI();
    actualizarBotonUndo();
    toast("Rehecho: " + a.etiqueta, 2200);
  }catch(e){
    st.uPos--;
    toast("No se pudo rehacer: " + e.message, 4000);
  }
}

async function aplicarAccionHist(a, rehaciendo, slug){
  if(a.tipo === "crear"){
    if(rehaciendo) await api(P(slug)+"/notas", {method:"POST", body:JSON.stringify(a.despues)});
    else await api(P(slug)+"/notas/"+a.antes.id, {method:"DELETE"});
  }else if(a.tipo === "borrar"){
    if(rehaciendo) await api(P(slug)+"/notas/"+a.antes.id, {method:"DELETE"});
    else await api(P(slug)+"/notas", {method:"POST", body:JSON.stringify(a.antes)});
  }else if(a.tipo === "campo"){
    const src = rehaciendo ? a.despues : a.antes, patch = {};
    for(const k of a.cambios) patch[k] = src[k];
    await api(P(slug)+"/notas/"+a.antes.id, {method:"PATCH", body:JSON.stringify(patch)});
  }
}

  }
  for(const p of st.proyectos){
    const el = document.createElement("div");

  /* ── Archivados ──
     Cristian: "el 1 ya esta terminado, deberia archivarse o algo... y que se acomode
     por ahi". Archivar NO borra nada: el proyecto desaparece de la lista normal, deja
     de abrirse al recargar, y queda plegado aqui abajo con un boton para sacarlo. */
  const ar = st.archivados || [];
  if(ar.length){
    const t = document.createElement("div");
    t.className = "psecc";
    t.textContent = "Archivados (" + ar.length + ")";
    h.appendChild(t);
    for(const p of ar){
      const e2 = document.createElement("div");
      e2.className = "pitem arch";
      e2.innerHTML = '<div class="pname">' + esc(p.nombre) + '</div>' +
        '<div class="pmeta"><span class="vd">' + p.videos + ' vid</span>' +

        '<button class="parch" title="Sacar de archivados" data-tip="Desarchivar">' +
          '<svg viewBox="0 0 24 24"><use href="#i-up"/></svg></button>';
      e2.onclick = (ev) => {
        if(ev.target.closest(".parch")){ archivarProyecto(p.slug, false); return; }
        openProject(p.slug);
      };
      h.appendChild(e2);
    }
  }
}

/* Archivar / desarchivar. No borra nada: solo cambia el estado. */
async function archivarProyecto(slug, archivar){
  if(esInvitado) return;
  const p = st.proyectos.find(x => x.slug === slug) || (st.archivados||[]).find(x => x.slug === slug);
  const nombre = p ? p.nombre : slug;
  if(archivar && st.slug === slug){
    if(!confirm("Archivar \u00ab" + nombre + "\u00bb?\n\nSe saca de la lista de trabajo y no se abrir\u00e1 al recargar.\nNo se borra nada: siempre puedes recuperarlo.")) return;
  }
  try{
    const r = await api(P(slug) + "/archivar", {method:"POST",
      body: JSON.stringify({archivado: archivar})});
    if(r && r.ok === false){ toast("No se pudo archivar: " + (r.error||""), 3000); return; }
    // si se archivó el proyecto abierto, mover a otro para no dejar la UI colgada
    if(archivar && st.slug === slug){
      st.slug = null; st.vid = null; guardarSesion();
      const otro = st.proyectos.find(x => x.slug !== slug);
      if(otro) await openProject(otro.slug);
      else { renderProyectos(); toast("Proyecto archivado", 2000); }
    }
    await pull(true);
    toast(archivar ? ("\u00ab" + nombre + "\u00bb archivado") : ("\u00ab" + nombre + "\u00bb devuelto al trabajo"), 2200);
  }catch(e){ toast("No se pudo archivar: " + e.message, 3400); }
}
async function openProject(slug, opts){
  if(esInvitado) return;                 // el invitado solo tiene SU proyecto (invArrancar)
  opts = opts || {};
  st.slug = slug; st.vid = null; st.filterVid = "";
  st.vidAVolver = opts.vid || null;
  await pullDetail();
  // si pullDetail fallo (servidor caido), st.videos puede no traer nada: sin esto
  // `st.videos[0]` reventaba la funcion y el proyecto no se abria nunca mas
  guardarSesion();
  // si venia con un video concreto, ese; si no, el primero
  const pv = (st.videos || []).find(x => x.id === st.vidAVolver) || (st.videos || [])[0];
  if(pv) await openVideo(pv.id);
  else { st.vid = null; v.removeAttribute("src"); v.load(); $("#fw").classList.remove("on"); st.pend=null; setDirty(false); }
  // el selector "Filtrar por video" solo se rellenaba en el arranque, cuando aun no
  // habia ningun proyecto cargado: estaba siempre vacio.
  renderFilter();
  renderProyectos(); renderVideos(); renderList(); updateEditor(); updateUI();
}
async function openVideo(vid){
  if(esInvitado && vid !== INV.video) return;   // un invitado ve UN video
  if(typeof shCerrar === "function") shCerrar();
  cmpSalir(false);                      // otro corte: la comparacion anterior no vale (sin restaurar)
  st.vid = vid; st.pend = null; st.hist=[]; st.hpos=-1;
  guardarSesion();
  st.undo=[]; st.uPos=-1; actualizarBotonUndo();
  st.tl = {zoom:1, off:0};              // vista del timeline: siempre empieza entera
  _railSig = null;                      // otro video: el carril se repinta entero
  const w0 = $("#tlWin"); if(w0) w0.classList.remove("on");   // y sin ventana de zoom
  pintarRail();
  const m = vmeta();
  if(!m) return;
  // cambiar de video invalida lo medido: si no, las muestras del clip anterior
  // contaminan la mediana del nuevo
  resetFpsProbe(); detFps = 0; setFps();
  $("#ta").value = "";
  $("#fw").classList.add("on");
  $("#nocodec").classList.toggle("on", !m.reproducible);
  if(m.reproducible === false){
    $("#ncMsg").textContent = m.nombre + " — " + m.codec + ". El navegador no lo abre; pedile a Agente un H.264 para poder verlo aquí.";
  }
  v.src = "/media/" + encodeURIComponent(st.slug) + "/" + vid + "/" + m.archivo;
  v.load();
  fit(); renderVideos(); renderList(); updateEditor();
}

/* ── RESPONDER EN EL HILO ──
   Cristian: "si claude dejo un comentario yo le comento en ese comentario y asi se va
   viendo el hilo de lo que se va hablando."
   El cuadro de abajo no cambia de sitio: cambia de MODO. Mientras hay un hilo apuntado,
   Enter manda una respuesta a ese hilo en vez de crear una nota nueva en el fotograma
   del cursor. El hilo apuntado se marca en la lista (fondo + barra inferior) para que
   nunca se responda a ciegas. */
function startReply(id){
  if(!puedeEscribir()){ toast("Este enlace caducó"); return; }
  const n = st.notas.find(x => x.id === id); if(!n) return;
  const raiz = raizDe(n);
  if(raiz.kind === "cambio"){ toast("Un marcador de cambio no lleva conversación"); return; }
  if(raiz.video !== st.vid) openVideo(raiz.video);
  st.replyTo = raiz.id;
  st.selId = raiz.id;
  st.plegados[raiz.id] = false;           // responder abre el hilo: hay que ver a que
  editingId = null;
  st.pend = {frame:raiz.frame, time:raiz.frame/fps};
  seek(raiz.frame/fps);
  $("#ta").value = "";
  setDirty(false);
  $("#bCancel").style.display = "";
  renderList(); updateEditor(); drawCanvas();
  $("#ta").focus();
}
function cancelReply(){
  if(!st.replyTo) return false;
  st.replyTo = null;
  $("#ta").value = "";
  setDirty(false);
  $("#bCancel").style.display = "none";
  renderList(); updateEditor();
  return true;
}
function selectNoteById(id){
  if(esInvitado) return;                 // «mover» es de Cristian
  const n = st.notas.find(x => x.id === id); if(!n) return;
  if(n.video !== st.vid) openVideo(n.video);
  st.pend = {frame:n.frame, time:n.frame/fps};

}

/* Orden de notas: TOTAL (siempre devuelve -1, 0 o 1) y ESTABLE (desempata por id).
   El comparador anterior no devolvia 0 para notas con el mismo video+frame, asi que
   el resultado del sort dependia del orden de llegada del array. Con dos notas en el
   mismo fotograma, el poll de 2200ms podia intercambiarlas de posicion. */
function cmpNotas(x, y){
  const xv = String(x.video ?? ""), yv = String(y.video ?? "");
  if(xv !== yv) return xv < yv ? -1 : 1;               // 1 o -1, nunca 0
  const xf = Number(x.frame) || 0, yf = Number(y.frame) || 0;
  if(xf !== yf) return xf < yf ? -1 : 1;               // 1 o -1, nunca 0
  const xi = String(x.id ?? ""), yi = String(y.id ?? "");
  if(xi !== yi) return xi < yi ? -1 : 1;                // DESEMPATE por id
  return 0;                                            // misma nota
}
function visibleNotes(){
  // SOLO RAICES. Una respuesta no es una fila de la lista ni un marcador: viaja
  // dentro de su hilo. Si entrara aqui, "nota siguiente" pararia dos veces en el
  // mismo fotograma y la barra pintaria dos marcas encima de la misma marca.
  let a = st.notas.filter(n => !esRespuesta(n));
  if(st.filterVid) a = a.filter(n => n.video === st.filterVid);
  else if(st.vid) a = a.filter(n => n.video === st.vid);
  if(st.onlyPend) a = a.filter(n => n.kind === "cambio" ? !n.decision : !n.resolved);
  // orden TOTAL y determinista: desempata por id, nunca devuelve "incomparable"
  a.sort(cmpNotas);
  return a;
}
// las respuestas comparten fotograma con su raiz: si entraran aqui, "ya hay una nota
// en este fotograma" se disparararia por una respuesta y bloquearia mover la raiz.
function noteAt(vid, frame){
  return st.notas.find(n => !esRespuesta(n) && n.video === vid && n.frame === frame) || null;
}
// notas que caen en un fotograma (puede haber varias: la app permite duplicadas)
function notesAt(vid, frame){
  return st.notas.filter(n => !esRespuesta(n) && n.video === vid && n.frame === frame);
}
// la nota "activa": por id si estamos editando/moviendo una, si no la primera del frame
function curNote(){
  if(!st.vid) return null;
  if(st.selId){ const byId = st.notas.find(n => n.id === st.selId); if(byId) return byId; }
  if(st.pend) return noteAt(st.vid, st.pend.frame);
  return null;
}

function x2Numero(n){
  if(n.numero) return n.numero;
  const kind = n.kind === "cambio" ? "cambio" : "nota";
  const a = st.notas.filter(x => !esRespuesta(x) && (x.kind === "cambio" ? "cambio" : "nota") === kind)
    .sort((x,y) => String(x.created||"").localeCompare(String(y.created||"")) || String(x.id).localeCompare(String(y.id)));
  const k = Math.max(0, a.findIndex(x => x.id === n.id)) + 1;
  return kind === "cambio" ? "A" + k : "Nota " + k;
}
function x2Normaliza(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }

    if(st.x2Drawing && !(n.drawing && n.drawing.strokes && n.drawing.strokes.length)) return false;
    if(q && !x2Normaliza([x2Numero(n), nombreAutor(n), n.text, n.timecode].join(" ")).includes(q)) return false;

v.addEventListener("loadedmetadata", () => {
  const m = vmeta(); if(!m) return;

  const patch = { duracion: vdur, ancho: vw, alto: vh };

  // "dato del archivo" y contaminaria todas las notas nuevas. El fps medido se
  // manda aparte, desde tickFps, solo cuando el contenedor no lo trae.
  if(!okFps(m.fps) && okFps(detFps)) patch.fps = detFps;
  // la meta del video la escribe Cristian; para el invitado esa ruta es 404
  if(!esInvitado) api(P(st.slug) + "/videos/" + st.vid + "/meta", {method:"POST", body: JSON.stringify(patch)})
    .then(()=>pull()).catch(()=>{});
  setFps();
  fit(); updateUI(); renderVideos();
});
/* El dibujo pertenece a UN fotograma. Al movernos hay que repintar el canvas:
   antes el listener solo llamaba updateUI(), asi que el trazo de la nota anterior se
   quedaba dibujado encima durante todo el video — de ahi "se queda en todo el video". */
let _fDibujo = -1, _fUltimoReply = null;
function alCambiarFotograma(){
  updateUI();                                   // el timecode y los botones, siempre
  const f = st.vid ? snap(v.currentTime) : -1;
  /* Si estabamos respondiendo a un hilo y el video se movio a OTRO fotograma, salimos
     del modo respuesta. Antes no se soltaba y Enter iba al hilo viejo — de ahi que
     "no me deja crear y tengo que hacer clic en otro comentario". */
  if(st.replyTo && _fUltimoReply!==null && f !== _fUltimoReply){
    const r = st.notas.find(n => n.id === st.replyTo);
    const rf = r ? (r.frame!=null ? r.frame : snap(r.time||0)) : null;
    const rf2 = (r && r.end_frame!=null) ? r.end_frame : rf;
    const dentro = (rf!=null && f>=rf && (rf2==null || f<=rf2));
    if(!dentro && f !== rf2){ st.replyTo = null; editingId = null;
      $("#bCancel").style.display = "none"; renderList(); updateEditor(); }
  }
  _fUltimoReply = f;
  if(f === _fDibujo) return;                    // el canvas solo si cambio el frame
  _fDibujo = f;

}

/* El UNICO sitio que escribe `fps`. Precedencia: archivo > medido > 24. */
function setFps(){
  const m = vmeta();
  let next = FPS_DEFAULT, src = "defecto";
  if(m && okFps(m.fps)){ next = +m.fps; src = "archivo"; }
  else if(okFps(detFps)){ next = detFps; src = "medido"; }
  const cambio = (next !== fps);
  fps = next; fpsSrc = src;
  showFps();
  return cambio;
}
function showFps(){
  const e = $("#fpsLbl"); if(!e) return;
  e.textContent = fps.toFixed(fps % 1 ? 2 : 0) + " fps · " + fpsSrc;
}
// todo lo que se pinta a partir del fps
function refreshFpsDeps(){
  if(!st.slug || !st.vid) return;
  renderVideos(); renderList(); updateMarks(); updateUI(); updateEditor();
}

let _lMT=null,_lPF=null,_fs=[];
function resetFpsProbe(){ _lMT = null; _lPF = null; _fs = []; }
v.addEventListener("seeking", resetFpsProbe);
v.addEventListener("pause", resetFpsProbe);

function tickFps(now, meta){
  const again = () => { if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(tickFps); };
  // Solo se mide REPRODUCIENDO. Un seek (o frame-step, o la pestaña oculta) deja un
  // hueco largo de mediaTime con un solo frame presentado, y dF/dT da cosas como
  // 1/0.2915 = 3.43 o 1/0.125 = 8.0 — exactamente los fps rotos de los datos reales.
  if(v.paused || v.seeking){ resetFpsProbe(); return again(); }
  if(_lPF!==null && meta.presentedFrames!==_lPF){
    const dT = meta.mediaTime-_lMT, dF = meta.presentedFrames-_lPF;
    // ventana corta y pocos frames: descarta huecos de seek / stall / tab oculta
    if(dT>0.002 && dT<0.25 && dF>0 && dF<=4){
      const i = dF/dT;
      if(i>=FPS_MIN && i<=FPS_MAX){ _fs.push(i); if(_fs.length>40) _fs.shift(); }
    }
  }
  _lMT = meta.mediaTime; _lPF = meta.presentedFrames;
  if(st.det && _fs.length>=12){
    const s = _fs.slice().sort((a,b)=>a-b), med = s[s.length>>1];
    const g = guess(med);
    if(g && g !== detFps){
      detFps = g;
      // si el contenedor no traia fps, dejarlo escrito para que la nota y el
      // servidor usen el mismo numero
      const m = vmeta();
      if(m && !okFps(m.fps) && st.slug && st.vid){
        m.fps = g;
        if(!esInvitado) api(P(st.slug) + "/videos/" + st.vid + "/meta", {method:"POST", body: JSON.stringify({fps:g})}).catch(()=>{});
      }
      if(setFps()) refreshFpsDeps();
    }
  }
  again();
}
if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(tickFps);
/* Devuelve null si la medicion no cae en una cadencia de video conocida.
   Antes devolvia Math.round(x*100)/100 y por eso un numero inventado (3.43, 8.0)
   terminaba guardado en las notas. */
function guess(x){
  const c=[23.976,24,25,29.97,30,48,50,59.94,60,119.88,120];
  for(const k of c) if(Math.abs(x-k)<0.14) return k;
  return null;
}
function snap(t){ return Math.round(t*fps); }
function frameT(f){ return f/fps; }
// mismo redondeo que tc_from() en server.py: el campo de fotogramas usa round(fps)
function tc(t,f){ f = f==null ? snap(t) : f;
  const r = Math.max(1, Math.round(fps));
  const ff = Math.floor(f % r), tot = Math.floor(f/r);
  return pad(Math.floor(tot/3600))+":"+pad(Math.floor(tot/60)%60)+":"+pad(tot%60)+":"+pad(ff); }

function play(){ v.play().catch(()=>toast("No se pudo reproducir")); }
function pause(){ v.pause(); }
/* updateUI() ya decide si basta mover el cursor o hay que repintar la ventana.
   Antes seek() llamaba ademas a tlFollow(), que repintaba por su cuenta: dos
   pintados por cada salto, con dos listas de marcadores creadas y destruidas. */
function seek(t){ pause(); v.currentTime = clamp(t,0,vdur||0); updateUI(); }
function stepF(d){ pause(); seek(frameT(snap(v.currentTime)+d)); }
function stepS(d){ pause(); seek(v.currentTime+d); }

function fit(){
  if(!vw) return;
  const r = v.getBoundingClientRect();
  if(!r.width) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
  drawCanvas();
}

let drawing=false, cur=null;
/* Gesto de dibujo: la nota se crea al SOLTAR un trazo real, no al empezar. Asi un
   clic sueltito con el lapiz encima nunca deja una nota vacia (habia 7 en los datos). */
let _inicioX=0, _inicioY=0, _dibujandoEnNota=null, _gestoReal=false;
/* OJO: aqui habia una segunda definicion de curNote() que pisaba la de arriba y
   ignoraba st.selId. Con dos notas en el mismo fotograma, "mover" y "borrar"
   actuaban sobre la primera, no sobre la seleccionada. */
function ensurePend(){ if(st.pend && st.pend.frame === snap(v.currentTime)) return;
  st.pend = {frame:snap(v.currentTime), time:v.currentTime}; st.hist=[]; st.hpos=-1; drawCanvas(); }

function pushHist(){ st.hist = st.hist.slice(0, st.hpos+1);
  const n = curNote(); st.hist.push(n && n.drawing ? JSON.parse(JSON.stringify(n.drawing)) : null);
  if(st.hist.length>60) st.hist.shift(); st.hpos = st.hist.length-1; }
function undo(){ if(st.hpos<0) return;
  const n = curNote(); const s = st.hist[st.hpos]; st.hpos--;
  if(n) n.drawing = s ? JSON.parse(JSON.stringify(s)) : null;
  st.hist.length = st.hpos+1; drawCanvas(); saveDrawing(); renderList(); }
function redo(){ if(st.hpos+1>=st.hist.length) return;
  st.hpos++; const n = curNote();
  if(n){ const s = st.hist[st.hpos]; n.drawing = s ? JSON.parse(JSON.stringify(s)) : null; }
  drawCanvas(); saveDrawing(); renderList(); }
async function saveDrawing(){
  const n = curNote(); if(!n) return;
  if(esInvitado && !esMia(n)) return;    // el dibujo de otro no se toca
  if(String(n.id).startsWith("tmp_")) return;   // aun sin id del servidor: viaja al sincronizar
  try{ await api(NP(n.id), {method:"PATCH", body:JSON.stringify({drawing: n.drawing})}); }
  catch(e){}
}
function pt(ev){
  const r = cv.getBoundingClientRect();
  return {x: clamp((ev.clientX-r.left)/r.width,0,1), y: clamp((ev.clientY-r.top)/r.height,0,1)};
}
cv.addEventListener("pointerdown", e => {
  /* ── Sin herramienta activa, el clic es play/pausa. ──
     Fable, leyendo los datos reales: "cualquier clic sobre el video, el gesto
     universal de pausar, crea una nota vacia... 7 notas vacias en rafaga y 4 trazos
     de 1 punto". El lapiz ya no viene activo y el canvas no se come el clic. */
  if(!st.tool){
    // con la cortina activa el clic sobre el video es parte del gesto del divisor:
    // no cambia reproducir/pausar (igual que en la maqueta)
    if(cmpEstado().on && cmpEstado().modo === "curtain") return;
    if(v.paused) play(); else pause();
    return;
  }
  if(!puedeEscribir()){ toast("Este enlace caducó"); return; }
  e.preventDefault();
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  ensurePend();
  /* La nota se resuelve YA, en el pointerdown, y de forma optimista: se pinta en
     el instante para que el trazo tenga donde agarrarse. Crearla al soltar hacia
     perder siempre el primer trazo. */
  let n = curNote();
  if(esInvitado && n && !esMia(n)) n = null;   // nunca dibujar sobre la nota de otro
  /* El dibujo pertenece a UN fotograma: la nota seleccionada (st.selId) solo sirve
     si cubre el fotograma actual. Si no, el trazo iba a una nota de otro momento y
     no se veia (drawCanvas solo pinta la nota del fotograma). */
  if(n){ const f0 = snap(v.currentTime);
    const dentro = f0 === n.frame || (n.end_frame != null && f0 >= n.frame && f0 <= n.end_frame);
    if(!dentro) n = null; }
  if(!n) n = crearNotaParaDibujar();
  if(!n) return;
  _inicioX = e.clientX; _inicioY = e.clientY; _gestoReal = false;
  if(!n.drawing) n.drawing = {strokes:[]};
  pushHist();
  cur = {tool:st.tool, color:st.color, size:st.size, pts:[pt(e)]};
  n.drawing.strokes.push(cur);
  drawing = true; _dibujandoEnNota = n;
  drawCanvas();
});
cv.addEventListener("pointermove", e => {
  if(!drawing || !cur) return;
  if(Math.hypot(e.clientX - _inicioX, e.clientY - _inicioY) > 4) _gestoReal = true;
  const p = pt(e), l = cur.pts[cur.pts.length-1];
  if(Math.hypot(p.x-l.x, p.y-l.y) < 0.0015) return;
  cur.pts.push(p); drawCanvas();
});
function endDraw(e){
  if(!drawing) return;
  /* Un clic suelto con el lapiz encima NO es un dibujo: se descarta entero,
     incluida la nota creada para el gesto. Antes dejaba 7 notas vacias y 4 trazos
     de un solo punto en los datos de Cristian. */
  if(!_gestoReal || !cur || cur.pts.length < 2){
    const n = _dibujandoEnNota;
    cur = null; drawing = false; _dibujandoEnNota = null;
    if(n && n.drawing && n.drawing.strokes && n.drawing.strokes.length) n.drawing.strokes.pop();
    const vacia = n && !(n.text||"").trim() && !(n.drawing.strokes||[]).length;
    if(n && vacia){
      const i2 = st.notas.findIndex(x => x.id === n.id);
      if(i2 >= 0) st.notas.splice(i2, 1);
      if(st.selId === n.id) st.selId = null;
    }
    drawCanvas(); renderList(); updateMarks(); updateEditor();
    return;
  }
  drawing=false; cur=null; _dibujandoEnNota=null;
  saveDrawing(); renderList();
}

cv.addEventListener("pointerup", endDraw);
cv.addEventListener("pointercancel", endDraw);

/* Dibujar sin nota previa: crea la nota vacia en el fotograma del cursor.
   Sin esto, dibujar encima de un frame sin nota no hacia nada y parecia un bug. */
function crearNotaParaDibujar(){
  /* El trazo nace como BORRADOR local. No se crea una nota vacia en el servidor:
     texto, dibujo, tramo y JPEG viajan juntos en el unico POST de Guardar. */
  if(!st.slug || !st.vid) return null;
  const f = snap(v.currentTime);
  // el invitado solo reutiliza una nota del fotograma si es SUYA
  const ya = esInvitado ? (notesAt(st.vid, f).find(esMia) || null) : noteAt(st.vid, f);
  if(ya){ st.pend = {frame:f, time:f/fps}; return ya; }
  const nota = {
    id: "tmp_" + Date.now().toString(36),
    video: st.vid, frame: f, fps: fps,
    timecode: tc(f/fps, f), time: Math.round(f/fps*1000)/1000,
    end_frame: null, text: "", kind: "nota", resolved: false,
    author: esInvitado ? "invitado" : "cristian", drawing: {strokes:[]}, pendiente_sync: true
  };
  if(esInvitado) nota.autor_nombre = INV.nombre || "";
  st.notas.push(nota);
  st.notas.sort(cmpNotas);
  st.pend = {frame:f, time:f/fps};
  st.selId = nota.id;
  pushHist();
  drawCanvas(); renderList(); updateMarks(); updateEditor();
  return nota;
}

function eraseFrame(){
  /* El borrador limpia el dibujo DEL FOTOGRAMA ACTUAL, no el de la nota seleccionada.
     Antes usaba curNote(), asi que desde otro frame borraba el dibujo equivocado. */
  if(!puedeEscribir()) return;
  ensurePend();
  const n = notaVisibleEnElFrameActual();
  if(!n || !n.drawing || !n.drawing.strokes.length) return;
  if(esInvitado && !esMia(n)){ toast("Solo puedes borrar tus dibujos"); return; }
  pushHist(); n.drawing = {strokes:[]}; drawCanvas(); saveDrawing(); renderList();
}
function drawCanvas(){
  if(!cv.width){ return; }
  ctx.clearRect(0,0,cv.width,cv.height);
  /* Un dibujo SOLO se ve en su fotograma. Antes se pintaba la nota seleccionada
     durante todo el video, porque curNote() la devolvia sin mirar donde estabamos.
     Ahora: si el frame actual no es el de la nota, el canvas queda limpio. */
  const n = notaVisibleEnElFrameActual();
  if(!n || !n.drawing || !n.drawing.strokes || !n.drawing.strokes.length) return;
  for(const s of n.drawing.strokes) drawStroke(s, cv.width, cv.height);
}

/* Devuelve la nota cuyo dibujo debe verse AHORA: la del fotograma actual.
   Si no hay ninguna, null. No mira la seleccion. */
function notaVisibleEnElFrameActual(){
  if(!st.vid || !cv.width) return null;
  const f = snap(v.currentTime);
  // rango primero (notas con duracion)
  for(const n of st.notas){
    if(n.video !== st.vid || !n.drawing || !n.drawing.strokes || !n.drawing.strokes.length) continue;
    const ini = (n.frame!=null) ? n.frame : snap(n.time||0);
    const fin = (n.end_frame!=null) ? n.end_frame
              : (n.frame_range!=null) ? n.frame_range[1] : null;
    if(fin==null){ if(f === ini) return n; }
    else if(f >= ini && f <= fin) return n;
  }
  return null;
}
function drawStroke(s,W,H){
  if(!s.pts || !s.pts.length) return;
  ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
  ctx.lineWidth = s.size*(W/1000)*1.15; ctx.lineCap="round"; ctx.lineJoin="round";
  if(s.tool==="pen"){
    ctx.beginPath();
    if(s.pts.length===1){ const p=s.pts[0]; ctx.arc(p.x*W,p.y*H,ctx.lineWidth/2,0,7); ctx.fill(); return; }
    ctx.moveTo(s.pts[0].x*W, s.pts[0].y*H);
    for(let i=1;i<s.pts.length-1;i++){ const a=s.pts[i],b=s.pts[i+1];
      ctx.quadraticCurveTo(a.x*W,a.y*H,(a.x+b.x)/2*W,(a.y+b.y)/2*H); }
    const l=s.pts[s.pts.length-1]; ctx.lineTo(l.x*W,l.y*H); ctx.stroke();
  } else if(s.tool==="arrow"){
    const a=s.pts[0],b=s.pts[s.pts.length-1];
    const x1=a.x*W,y1=a.y*H,x2=b.x*W,y2=b.y*H;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const ang=Math.atan2(y2-y1,x2-x1), hd=ctx.lineWidth*4.2;
    ctx.beginPath(); ctx.moveTo(x2,y2);
    ctx.lineTo(x2-hd*Math.cos(ang-0.42), y2-hd*Math.sin(ang-0.42));
    ctx.lineTo(x2-hd*Math.cos(ang+0.42), y2-hd*Math.sin(ang+0.42));
    ctx.closePath(); ctx.fill();
  } else if(s.tool==="rect" || s.tool==="ellipse"){
    const a=s.pts[0],b=s.pts[s.pts.length-1];
    const x=Math.min(a.x,b.x)*W, y=Math.min(a.y,b.y)*H;
    const w=Math.abs(b.x-a.x)*W, h=Math.abs(b.y-a.y)*H;
    ctx.beginPath();
    if(s.tool==="rect") ctx.rect(x,y,w,h); else ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,7);
    ctx.stroke();
  }
}

function x2Thumb(n){
  if(!n || !n.drawing || !n.drawing.strokes || !n.drawing.strokes.length) return null;
  const sw = v.videoWidth || cv.width || 1280, sh = v.videoHeight || cv.height || 720;
  const scale = Math.min(1, 1280 / Math.max(sw, sh));
  const out = document.createElement("canvas"); out.width = Math.max(1,Math.round(sw*scale)); out.height = Math.max(1,Math.round(sh*scale));
  const g = out.getContext("2d");
  try{ g.drawImage(v,0,0,out.width,out.height); }catch(_){ g.fillStyle="#000"; g.fillRect(0,0,out.width,out.height); }
  for(const s of n.drawing.strokes){
    g.strokeStyle=s.color;g.fillStyle=s.color;g.lineWidth=s.size*(out.width/1000)*1.15;g.lineCap="round";g.lineJoin="round";
    if(!s.pts||!s.pts.length) continue;
    if(s.tool==="pen"){
      g.beginPath();g.moveTo(s.pts[0].x*out.width,s.pts[0].y*out.height);
      for(let i=1;i<s.pts.length;i++) g.lineTo(s.pts[i].x*out.width,s.pts[i].y*out.height);g.stroke();
    }else if(s.tool==="arrow"){
      const a=s.pts[0],b=s.pts[s.pts.length-1],x1=a.x*out.width,y1=a.y*out.height,x2=b.x*out.width,y2=b.y*out.height;
      g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();const ang=Math.atan2(y2-y1,x2-x1),hd=g.lineWidth*4.2;
      g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-hd*Math.cos(ang-.42),y2-hd*Math.sin(ang-.42));g.lineTo(x2-hd*Math.cos(ang+.42),y2-hd*Math.sin(ang+.42));g.closePath();g.fill();
    }else{
      const a=s.pts[0],b=s.pts[s.pts.length-1],x=Math.min(a.x,b.x)*out.width,y=Math.min(a.y,b.y)*out.height,w=Math.abs(b.x-a.x)*out.width,h=Math.abs(b.y-a.y)*out.height;
      g.beginPath();if(s.tool==="rect")g.rect(x,y,w,h);else g.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,7);g.stroke();
    }
  }
  return out.toDataURL("image/jpeg",.82);
}

/* ═══ editor: Enter envia (modo chat), mover, borrar ═══ */
let dirty = false;          // hay texto escrito que aun no se ha enviado
let editingId = null;       // id de la nota en edicion; null = crear nueva (modo chat)

function setDirty(on){
  dirty = !!on;
  $("#edDirty").classList.toggle("on", dirty);
  $("#bSave").disabled = !dirty;
}
function editorFrame(){
  // modo chat: la nota va SIEMPRE al fotograma del cursor
  return snap(v.currentTime);
}

/* Mandar una RESPUESTA al hilo apuntado. Camino aparte del de crear nota:
   no elige fotograma (lo hereda la respuesta en el servidor), no avanza el cursor y
   no toca st.pend — el hilo se queda donde esta y la conversacion crece hacia abajo. */
async function saveReply(){
  const raiz = st.notas.find(x => x.id === st.replyTo);
  if(!raiz){ st.replyTo = null; return; }
  const val = $("#ta").value;
  if(!val.trim()){ setDirty(false); toast("Escribe la respuesta", 1600); return; }
  $("#ta").value = ""; setDirty(false); $("#bSave").disabled = true;
  try{
    let saved = null;
    await withBusyNote(async ()=>{
      const r = await api(P(st.slug)+"/notas", {method:"POST", body: JSON.stringify({
        parent: raiz.id, text: val, author: esInvitado ? "invitado" : "cristian" })});
      saved = r.nota || null;
    });
    if(saved) upsertNote(saved);
    else { const d = await api(P(st.slug)); absorbDetail(d); }
    if(saved) pushUndo("responder en " + raiz.timecode,
      {tipo:"crear", antes:snapNota(saved), despues:snapNota(saved)});
    st.plegados[raiz.id] = false;
    renderList(); renderVideos(); updateMarks(); updateEditor();
    toast("Respuesta enviada en " + raiz.timecode);
  }catch(e){
    $("#ta").value = val; setDirty(true);
    toast("No se pudo responder: " + e.message, 4000);
  }
}

function x2SalirAjuste(){
  st.adjustTo = null;
  $(".editor").classList.remove("adjusting");
  $("#ta").placeholder = "Escribe la nota y pulsa Enter para enviarla. Shift+Enter = nueva linea.";
}
async function x2GuardarAjuste(){
  const c = st.notas.find(n => n.id === st.adjustTo && n.kind === "cambio");
  if(!c){ x2SalirAjuste(); return; }
  const val = $("#ta").value.trim();
  if(!val){ toast("Escribe el ajuste que necesitas",1800); return; }
  const linked = c.resuelve ? st.notas.find(n => n.id === c.resuelve) : null;
  const antesC = snapNota(c), antesN = snapNota(linked);
  let reply = null;
  try{
    await withBusyNote(async () => {
      const rr = await api(P(st.slug)+"/notas", {method:"POST", body:JSON.stringify({parent:c.id,text:val,author:"cristian"})});
      reply = rr.nota || null;
      await api(P(st.slug)+"/notas/"+c.id, {method:"PATCH", body:JSON.stringify({decision:"adjust",visto:true})});
      if(linked) await api(P(st.slug)+"/notas/"+linked.id, {method:"PATCH", body:JSON.stringify({resolved:false})});
    });
    const acciones = [];
    if(reply) acciones.push({tipo:"crear",antes:snapNota(reply),despues:snapNota(reply)});
    acciones.push({tipo:"campo",antes:antesC,despues:Object.assign({},antesC,{decision:"adjust",visto:true}),cambios:["decision","visto"]});
    if(linked) acciones.push({tipo:"campo",antes:antesN,despues:Object.assign({},antesN,{resolved:false}),cambios:["resolved"]});
    pushUndo("ajuste pedido en "+x2Numero(c), {tipo:"multi",acciones:acciones});
    $("#ta").value=""; setDirty(false); x2SalirAjuste(); $("#bCancel").style.display="none";
    await pullDetail(); renderList(); renderVideos(); updateMarks(); updateEditor();
    toast("Ajuste pedido al Agente");
  }catch(e){ toast("No se pudo pedir el ajuste: "+e.message,4000); }
}

async function saveNote(){
  if(!st.slug || !st.vid) return;
  if(!puedeEscribir()){ toast("Este enlace caducó: ya no se pueden enviar notas"); return; }
  if(st.adjustTo) return x2GuardarAjuste();
  if(st.replyTo) return saveReply();      // el cuadro esta en modo respuesta
  const val = $("#ta").value;
  // invitado con tramo marcado: la nota nace en el INICIO del tramo y llega hasta «fin»
  const tramo = (esInvitado && st.invTramo) ? st.invTramo : null;
  const draft = st.notas.find(n => String(n.id).startsWith("tmp_") && n.id === st.selId) || null;
  const f = draft ? draft.frame : (tramo ? tramo.ini : editorFrame());
  // sin texto y sin edicion activa: nada que enviar
  if(!val.trim() && !editingId && !(draft && draft.drawing && draft.drawing.strokes.length)){
    setDirty(false); toast("Escribe algo para guardar", 1600); return;
  }
  // inmediata: el cuadro se limpia al instante y la UI deja de esperar
  const existing = editingId ? st.notas.find(x => x.id === editingId) : draft;
  const esBorrador = !!(existing && String(existing.id).startsWith("tmp_"));
  const antesDeGuardar = existing ? snapNota(existing) : null;   // para deshacer la edicion
  $("#ta").value = "";
  setDirty(false);
  $("#bSave").disabled = true;
  try{
    let saved = null;
    await withBusyNote(async ()=>{
      if(existing && !esBorrador){
        const r = await api(NP(existing.id), {method:"PATCH", body:JSON.stringify({text: val})});
        saved = r.nota || null;
        if(saved) saved.video = st.vid;
      }else{
        const cuerpo = { video: st.vid, frame: f, text: val, author: esInvitado ? "invitado" : "cristian", fps: fps };
        if(tramo && tramo.fin > f) cuerpo.end_frame = tramo.fin;
        if(esBorrador){
          cuerpo.drawing = existing.drawing;
          if(existing.end_frame != null) cuerpo.end_frame = existing.end_frame;
          cuerpo.thumb = x2Thumb(existing);
        }
        const r = await api(P(st.slug)+"/notas", {method:"POST", body: JSON.stringify(cuerpo)});
        saved = r.nota || null;
      }
    });
    editingId = null;
    st.invTramo = null;
    // la nota entra a la lista sin refetch (el PATCH ya la devuelve)
    if(saved){
      if(esBorrador) st.notas = st.notas.filter(n => n.id !== existing.id);
      upsertNote(saved);
    }else{
      const d = await api(P(st.slug));
      absorbDetail(d);
    }
    // ── HISTORIAL: registrar la accion para poder deshacerla ──
    if(saved){
      if(existing && !esBorrador){
        if(antesDeGuardar && antesDeGuardar.text !== saved.text){
          pushUndo("editar nota en " + saved.timecode,
            {tipo:"campo", antes:antesDeGuardar, despues:snapNota(saved), cambios:["text"]});
        }
      }else{
        pushUndo("crear nota en " + saved.timecode,
          {tipo:"crear", antes:snapNota(saved), despues:snapNota(saved)});
      }
    }
    /* El cursor SE QUEDA donde estaba. Antes saltaba al proximo fotograma libre, y
       como el dibujo solo se pinta en su fotograma exacto, el trazo que acababas de
       hacer desaparecia de pantalla al pulsar Enter — parecia que se habia perdido.
       Fable 2.2. La app ya admite varias notas en el mismo fotograma, asi que no
       hay nada que proteger. */
    st.pend = {frame: f, time: frameT(f)};
    // si ya hay una nota tuya en este fotograma, Enter responde en su hilo en vez de
    // crear otra nota (asi no se duplican: habia un par duplicado en los datos)
    const miaAqui = st.notas.find(n => n.video === st.vid && n.frame === f
      && esMia(n) && !n.parent && !esRespuesta(n));
    if(miaAqui && !existing){ setTimeout(() => startReply(miaAqui.id), 120); }
    $("#bCancel").style.display = "none";
    renderList(); renderVideos(); updateMarks(); updateEditor();
    toast((existing && !esBorrador ? "Nota actualizada en " : "Nota enviada en ") + tc(null, f));
  }catch(e){
    // si fallo, devolver el texto al cuadro para no perderlo
    $("#ta").value = val;
    setDirty(true);
    toast("No se pudo guardar: " + e.message, 4000);
  }
}

// inserta o actualiza una nota en st.notas sin perder el orden
function upsertNote(n){
  const i = st.notas.findIndex(x => x.id === n.id);
  if(i >= 0) st.notas[i] = Object.assign(st.notas[i], n);
  else st.notas.push(n);
  st.notas.sort(cmpNotas);
}

$("#ta").addEventListener("input", () => {
  if(!st.slug || !st.vid) return;
  // en modo respuesta NO se toca st.pend: el momento es el del hilo, no el del cursor.
  // ensurePend() lo movia al fotograma actual y la respuesta habria perdido su ancla.
  if(!st.replyTo && !st.adjustTo) ensurePend();
  setDirty(true);          // no se envia nada hasta Enter o Guardar
});
$("#ta").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault(); saveNote();          // Enter = guardar
  }
  // Shift+Enter = salto de linea normal
});

/* ── Mover nota: NO se pide un numero de fotograma ──
   El bug de uso: obligaba a calcular "a que fotograma" a mano, y el numero cambia
   con cada tecla. Ahora se elige el MOMENTO: hay una vista previa del video, se navega
   con los mismos controles del reproductor, y se muestran puntos de referencia. */
const _mov = {frame: 0, t: 0, paused: true, raf: 0};

function _movTick(){
  const v2 = $("#mvPreview");
  if(!v2){ _mov.raf = 0; return; }
  /* ESTABA AL REVES: con la vista previa en PAUSA avanzaba `_mov.t += 1/30` en cada
     frame de animacion (60 fps x 1/30 = el doble de velocidad real) y al llegar al
     final volvia a 0. O sea: abrias "mover la nota" y el momento de destino se iba
     solo, en bucle; lo que elegias ya no era lo que confirmabas. En pausa el destino
     no se mueve: solo lo mueven los botones, el campo de segundos o la barra. */
  if(!_mov.paused) _mov.t = v2.currentTime;
  const f = Math.round(_mov.t * fps);
  const el = $("#mvTc");
  if(el) el.textContent = tc(_mov.t, f) + "   f" + f;
  const bar = $("#mvBar");
  if(bar) bar.style.left = clamp((_mov.t/(_mov.dur||1))*100, 0, 100) + "%";
  const mk = $("#mvMarks");
  if(mk && !mk.dataset.done){
    mk.dataset.done = "1";
    // solo las notas de ESTE video: antes se pintaban las de todo el proyecto, en
    // una barra que representa la duracion de este clip
    for(const nn of st.notas){
      if(nn.id === _mov.notaId || nn.video !== st.vid) continue;
      const d2 = document.createElement("div");
      d2.className = "mark2";
      d2.style.left = clamp((nn.frame/fps/(_mov.dur||1))*100, 0, 100) + "%";
      d2.title = (nn.text||"").slice(0,50);
      mk.appendChild(d2);
    }
  }
  // el handle nuevo se guarda: antes se llamaba a requestAnimationFrame sin recoger
  // el id, asi que cancelAnimationFrame(_mov.raf) cancelaba uno viejo y el bucle
  // seguia vivo para siempre (y se acumulaba otro en cada apertura del dialogo)
  if(_mov.raf) _mov.raf = requestAnimationFrame(_movTick);
}

$("#bMove").onclick = () => {
  if(esInvitado) return;                 // mover (PATCH frame) no existe para el invitado
  const n = curNote();
  if(!n){ toast("No hay ninguna nota que mover"); return; }
  const maxF = Math.max(0, Math.round((vdur||0)*fps));
  const m = vmeta();
  _mov.frame = n.frame; _mov.t = n.frame/fps; _mov.notaId = n.id; _mov.dur = vdur || 1;
  _mov.paused = true;

  openModal("Mover la nota a otro momento",
    '<p style="color:var(--fg-dim);font-size:12.5px;line-height:1.7;margin-bottom:12px">' +
      'Esta nota está en <b>' + n.timecode + '</b> (f' + n.frame + '). ' +
      'Lleva el clip hasta donde la quieres y confirma.</p>' +

    '<div class="mvprev">' +
      '<video id="mvPreview" muted playsinline preload="metadata" src="' +
        "/media/" + encodeURIComponent(st.slug) + "/" + st.vid + "/" + (m?m.archivo:"") + '"></video>' +
      '<div class="mvtc" id="mvTc">' + tc(n.frame/fps, n.frame) + '</div>' +
    '</div>' +

    '<div class="mvbar" id="mvBarWrap">' +
      '<div class="mvtrack"></div><div class="mvhead" id="mvBar"></div><div class="mvmarks" id="mvMarks"></div>' +
    '</div>' +

    // "1 s" se media en 24 fotogramas fijos: en un clip de 30 fps saltaba 0,8 s.
    // Ahora el paso de segundo se declara en SEGUNDOS y lo convierte el handler.
    '<div class="mvrow">' +
      '<button class="btn" data-mv-sec="-1">⏮ 1 s atrás</button>' +
      '<button class="btn" data-mv-step="-1">◀ 1 f</button>' +
      '<button class="btn" id="mvPlay">▶ reproducir</button>' +
      '<button class="btn" data-mv-step="1">1 f ▶</button>' +
      '<button class="btn" data-mv-sec="1">1 s ⏭</button>' +
    '</div>' +
    '<div class="mvrow" style="margin-top:6px">' +
      '<label class="lbl" style="display:inline-block;margin:0 6px 0 0">O escribe el segundo exacto</label>' +
      '<input class="fld mvsec" id="mvSec" type="text" inputmode="decimal" value="' + (n.frame/fps).toFixed(2) + '">' +
    '</div>' +
    '<p style="color:var(--fg-mute);font-size:11.5px;line-height:1.7;margin-top:8px">' +
      'Los puntos grises en la barra son las otras notas. Mover aqui no cambia nada hasta que confirmes.</p>',

    '<span style="flex:1"></span><button class="btn" id="mvCancel">Cancelar</button>' +
    '<button class="btn pri" id="mvOk">Mover aqui</button>');

  const pv = $("#mvPreview");
  pv.currentTime = _mov.t;

  // scrub de la vista previa (nombre propio: `drag` ya es la variable del arrastre
  // de marcadores en la barra principal, y tlCongelado() la consulta)
  const wrap = $("#mvBarWrap");
  let mvDrag = false;
  const toT = ev => {
    const r = wrap.getBoundingClientRect();
    _mov.t = clamp((ev.clientX - r.left)/r.width, 0, 1) * (_mov.dur||1);
    pv.currentTime = _mov.t;      // la imagen sigue al dedo: antes la barra se movia sola
  };
  wrap.addEventListener("pointerdown", ev => { mvDrag = true; wrap.setPointerCapture(ev.pointerId); toT(ev); });
  wrap.addEventListener("pointermove", ev => { if(mvDrag) toT(ev); });
  wrap.addEventListener("pointerup",   () => mvDrag = false);
  wrap.addEventListener("pointercancel",() => mvDrag = false);

  const mvSaltar = seg => { _mov.t = clamp(_mov.t + seg, 0, _mov.dur); pv.currentTime = _mov.t; };
  for(const b of $$("#mBody [data-mv-step]")) b.onclick = () => mvSaltar((+b.dataset.mvStep)/fps);
  for(const b of $$("#mBody [data-mv-sec]"))  b.onclick = () => mvSaltar(+b.dataset.mvSec);
  $("#mvPlay").onclick = e => {
    _mov.paused = !_mov.paused;
    e.currentTarget.textContent = _mov.paused ? "▶ reproducir" : "⏸ pausar";
    if(!_mov.paused){ pv.currentTime = _mov.t; pv.play().catch(()=>{}); }
    else pv.pause();
  };
  $("#mvSec").oninput = e => {
    const s = parseFloat(e.target.value.replace(",", "."));
    if(!isNaN(s)){ _mov.t = clamp(s, 0, _mov.dur); pv.currentTime = _mov.t; }
  };
  // la limpieza (parar el video y el bucle de animacion) vive en closeModal(), que
  // es el unico sitio por el que se cierra: boton, Escape y clic fuera incluidos.
  // Antes "Cancelar" cerraba sin parar nada y el rAF se quedaba corriendo.
  $("#mvCancel").onclick = closeModal;
  $("#mClose").onclick = closeModal;

  if(_mov.raf) cancelAnimationFrame(_mov.raf);
  _mov.raf = requestAnimationFrame(_movTick);

  $("#mvOk").onclick = async () => {
    pv.pause();
    if(_mov.raf) cancelAnimationFrame(_mov.raf);
    const nf = clamp(Math.round(_mov.t * fps), 0, maxF);
    closeModal();
    if(nf === n.frame){ toast("Sigue en el mismo momento"); return; }
    const dup = noteAt(st.vid, nf);
    if(dup && dup.id !== n.id){ toast("Ya hay una nota en " + tc(null,nf) + " — muevela o borrala"); return; }
    const old = n.frame;
    await withBusyNote(async ()=>{
      n.frame = nf;
      try{
        const antesMov = snapNota(n);
        await api(P(st.slug)+"/notas/"+n.id, {method:"PATCH", body:JSON.stringify({frame: nf})});
        pushUndo("mover nota de " + antesMov.timecode + " a " + tc(null,nf),
          {tipo:"campo", antes:antesMov, despues:snapNota(n), cambios:["frame"]});
        st.pend = {frame:nf, time:frameT(nf)};
        seek(frameT(nf));
        await pullDetail();
        drawCanvas(); renderList(); renderVideos(); updateMarks(); updateEditor();
        toast("Movida de " + n.timecode + " a " + tc(null,nf), 2800);
      }catch(e){
        n.frame = old;
        toast("No se pudo mover: " + e.message, 4000);
      }
    });
  };
};

/* ═══ etiquetas al pasar el mouse ═══
   Una sola capa fixed para TODO [data-tip], incluidos los botones que se pintan
   despues (los de cada nota): la delegacion en document los cubre sin re-enganchar. */
const TIP_GAP = 8, TIP_MARGIN = 6;
const tipEl = document.createElement("div");
tipEl.id = "tipLayer";
tipEl.setAttribute("role", "tooltip");
document.body.appendChild(tipEl);
let tipFor = null;

function tipText(el){
  const t = (el.dataset.tip || "").trim();
  const k = (el.getAttribute("title") || "").trim();
  if(!t) return "";
  // el atajo vivia en title= y abria ADEMAS el tooltip nativo del navegador:
  // se absorbe en la etiqueta propia y se quita el title
  if(k && k !== t){ el.dataset.key = k; el.removeAttribute("title"); }
  const key = el.dataset.key;
  return key ? t + ' <kbd>' + esc(key) + '</kbd>' : t;
}
function hideTip(){
  if(!tipFor) return;
  tipFor = null;
  tipEl.classList.remove("on");
}
function showTip(el){
  const html = tipText(el);
  if(!html){ hideTip(); return; }
  tipFor = el;
  tipEl.innerHTML = html;
  tipEl.classList.add("on");
  // medir con la capa ya visible: si no, el rect sale vacio y la posicion se va a (0,0)
  const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  let x = r.left + r.width/2 - t.width/2;
  x = clamp(x, TIP_MARGIN, Math.max(TIP_MARGIN, window.innerWidth - t.width - TIP_MARGIN));
  // ARRIBA por defecto; si no cabe, ABAJO; y si tampoco, pegado al borde inferior.
  // (antes: y podia quedar por fuera de la ventana y la etiqueta no se veia)
  let y = r.top - t.height - TIP_GAP;
  if(y < TIP_MARGIN) y = r.bottom + TIP_GAP;
  y = Math.min(y, Math.max(TIP_MARGIN, window.innerHeight - t.height - TIP_MARGIN));
  tipEl.style.left = Math.round(x) + "px";
  tipEl.style.top  = Math.round(y) + "px";
}
document.addEventListener("pointerover", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if(el === tipFor) return;
  if(el) showTip(el); else hideTip();
}, true);
document.addEventListener("pointerdown", hideTip, true);
document.addEventListener("pointerleave", hideTip);
document.addEventListener("focusin", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if(el) showTip(el); else hideTip();
});
document.addEventListener("focusout", hideTip);
window.addEventListener("scroll", hideTip, true);
window.addEventListener("resize", hideTip);
window.addEventListener("blur", hideTip);
